apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base
- artifact-registry-credentials.yaml

generators:
- caching-helm-generator.yaml

# Existing build tasks mount caching-ca-bundle. Trust both proxies during migration.
patches:
- target:
    group: trust.cert-manager.io
    version: v1alpha1
    kind: Bundle
    name: caching-ca-bundle
  patch: |-
    - op: add
      path: /spec/sources/-
      value:
        secret:
          name: container-image-proxy-root-ca-secret
          key: ca.crt
