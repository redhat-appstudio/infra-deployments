- ../../base
- ../../base/external-secrets
- https://github.com/konflux-ci/build-service/config/default?ref=20a113cc1c8a3db67bf4f7e093cc435cfe580c9d

namespace: build-service

images:
- name: quay.io/konflux-ci/build-service
