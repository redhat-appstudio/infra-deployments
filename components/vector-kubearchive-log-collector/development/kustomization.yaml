apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

commonAnnotations:
  ignore-check.kube-linter.io/drop-net-raw-capability: |
    "Vector runs requires access to socket."
  ignore-check.kube-linter.io/run-as-non-root: |
    "Vector runs as Root and attach host Path."
  ignore-check.kube-linter.io/sensitive-host-mounts: |
    "Vector runs requires certain host mounts to watch files being created by pods."
  ignore-check.kube-linter.io/pdb-unhealthy-pod-eviction-policy: |
    "Managed by upstream Loki chart (no value exposed for unhealthyPodEvictionPolicy)."
  ignore-check.kube-linter.io/no-read-only-root-fs: |
    "Minio post-jobs from chart require write access to filesystem."
  ignore-check.kube-linter.io/unset-cpu-requirements: |
    "Minio post-job containers from chart do not expose resource configuration options."
  ignore-check.kube-linter.io/unset-memory-requirements: |
    "Minio post-job containers from chart do not expose resource configuration options."

resources:
- ../base
- rbac.yaml
- loki-secret.yaml
- sa.yaml
- prometheus-rules.yaml
- namespace.yaml
- minio-create-buckets-job.yaml

patches:
  - path: scc-patch.yaml
    target:
      kind: SecurityContextConstraints
      name: kubearchive-logging-scc
  # Patch all Loki PodDisruptionBudgets to allow eviction of unhealthy pods
  # This is critical for StatefulSets where stale pods should be evicted
  - patch: |
      - op: add
        path: /spec/unhealthyPodEvictionPolicy
        value: AlwaysAllow
    target:
      group: policy
      version: v1
      kind: PodDisruptionBudget
      labelSelector: app.kubernetes.io/name=loki
  - patch: |-
      - op: add
        path: /spec/persistentVolumeClaimRetentionPolicy
        value:
          whenDeleted: Delete
          whenScaled: Delete
    target:
      group: apps
      version: v1
      kind: StatefulSet
      namespace: product-kubearchive-logging
      labelSelector: app.kubernetes.io/name=loki,app.kubernetes.io/component=ingester
  - patch: |
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: loki-compactor
      spec:
        template:
          spec:
            volumes:
              - name: temp
                emptyDir: {}
            initContainers:
              - name: create-minio-buckets
                image: quay.io/minio/mc:RELEASE.2024-11-21T17-21-54Z
                imagePullPolicy: IfNotPresent
                volumeMounts:
                  - name: temp
                    mountPath: /tmp
                command:
                  - /bin/sh
                  - -c
                  - |
                    set -e
                    MC="mc --config-dir /tmp --insecure"
                    ATTEMPTS=0
                    until $MC alias set myminio http://loki-minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" 2>/dev/null; do
                      ATTEMPTS=$((ATTEMPTS + 1))
                      if [ $ATTEMPTS -gt 30 ]; then
                        echo "Failed to connect to MinIO after 30 attempts, last error:"
                        $MC alias set myminio http://loki-minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"
                        exit 1
                      fi
                      sleep 2
                    done
                    for BUCKET in chunks ruler; do
                      if ! $MC stat myminio/$BUCKET >/dev/null 2>&1; then
                        $MC mb myminio/$BUCKET
                      fi
                    done
                    echo "Buckets ready"
                env:
                  - name: MINIO_ROOT_USER
                    valueFrom:
                      secretKeyRef:
                        name: loki-minio
                        key: rootUser
                  - name: MINIO_ROOT_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: loki-minio
                        key: rootPassword
                resources:
                  requests:
                    cpu: 10m
                    memory: 64Mi
                  limits:
                    memory: 128Mi
    target:
      group: apps
      version: v1
      kind: StatefulSet
      namespace: product-kubearchive-logging
      labelSelector: app.kubernetes.io/name=loki,app.kubernetes.io/component=compactor
  - patch: |-
      - op: replace
        path: /spec/endpoints/0/scheme
        value: http
      - op: replace
        path: /spec/endpoints/0/port
        value: http-metrics
      - op: remove
        path: /spec/endpoints/0/bearerTokenSecret
      - op: remove
        path: /spec/endpoints/0/tlsConfig
      - op: replace
        path: /spec/selector/matchExpressions
        value:
        - key: app.kubernetes.io/component
          operator: In
          values:
          - querier
          - ingester
          - distributor
          - compactor
        - key: app.kubernetes.io/name
          operator: In
          values:
          - loki
    target:
      group: monitoring.coreos.com
      version: v1
      kind: ServiceMonitor
      name: product-kubearchive-logging-monitor

  # Fix ArgoCD sync drift caused by OpenShift SCC admission mutations on Loki workloads
  - patch: |-
      - op: add
        path: /metadata/annotations/argocd.argoproj.io~1sync-options
        value: ServerSideApply=true
    target:
      group: apps
      version: v1
      kind: Deployment
      namespace: product-kubearchive-logging
      labelSelector: app.kubernetes.io/name=loki
  - patch: |-
      - op: add
        path: /metadata/annotations/argocd.argoproj.io~1sync-options
        value: ServerSideApply=true
    target:
      group: apps
      version: v1
      kind: StatefulSet
      namespace: product-kubearchive-logging
      labelSelector: app.kubernetes.io/name=loki

generators:
- vector-helm-generator.yaml
- loki-helm-generator.yaml
- grafana-helm-generator.yaml
