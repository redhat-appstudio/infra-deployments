---
apiVersion: batch/v1
kind: Job
metadata:
  name: loki-minio-create-buckets
  namespace: product-kubearchive-logging
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 5
  template:
    metadata:
      labels:
        app: minio-create-buckets
    spec:
      restartPolicy: OnFailure
      serviceAccountName: minio-sa
      containers:
        - name: minio-make-bucket
          image: quay.io/minio/mc:RELEASE.2024-11-21T17-21-54Z
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "Waiting for MinIO to be ready..."
              ATTEMPTS=0
              until mc alias set myminio http://loki-minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" --insecure 2>/dev/null; do
                ATTEMPTS=$((ATTEMPTS + 1))
                if [ $ATTEMPTS -gt 30 ]; then
                  echo "Failed to connect to MinIO after 30 attempts"
                  exit 1
                fi
                echo "Attempt $ATTEMPTS: MinIO not ready, retrying in 2s..."
                sleep 2
              done
              echo "Connected to MinIO"

              for BUCKET in chunks ruler; do
                if mc stat myminio/$BUCKET --insecure >/dev/null 2>&1; then
                  echo "Bucket '$BUCKET' already exists"
                else
                  echo "Creating bucket '$BUCKET'"
                  mc mb myminio/$BUCKET --insecure
                fi
              done
              echo "All buckets ready"
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: loki-minio
                  key: rootUser
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: loki-minio
                  key: rootPassword
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 128Mi
