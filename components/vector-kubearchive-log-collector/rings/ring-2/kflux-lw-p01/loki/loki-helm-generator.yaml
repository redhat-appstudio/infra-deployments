apiVersion: builtin
kind: HelmChartInflationGenerator
metadata:
  name: loki
name: loki
repo: https://grafana.github.io/helm-charts
version: 6.49.0
releaseName: loki
namespace: product-kubearchive-logging
valuesFile: loki-helm-values.yaml
additionalValuesFiles:
  - loki-helm-prod-values.yaml
valuesInline:
  # Cluster-specific overrides
  serviceAccount:
    create: true
    name: loki-sa
  loki:
    storage:
      bucketNames:
        chunks: kflux-lw-p01-kubearchive-loki-3xm6
        admin: kflux-lw-p01-kubearchive-loki-3xm6
      s3:
        endpoint: s3.direct.us-east.cloud-object-storage.appdomain.cloud
        s3ForcePathStyle: true
    storage_config:
      aws:
        bucketnames: kflux-lw-p01-kubearchive-loki-3xm6
        endpoint: s3.direct.us-east.cloud-object-storage.appdomain.cloud
        s3forcepathstyle: true
  ingester:
    extraEnvFrom:
      - secretRef:
          name: cos-credentials
  distributor:
    extraEnvFrom:
      - secretRef:
          name: cos-credentials
  querier:
    extraEnvFrom:
      - secretRef:
          name: cos-credentials
  compactor:
    extraEnvFrom:
      - secretRef:
          name: cos-credentials
  indexGateway:
    extraEnvFrom:
      - secretRef:
          name: cos-credentials
