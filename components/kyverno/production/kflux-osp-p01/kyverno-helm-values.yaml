fullnameOverride: konflux-kyverno
namespaceOverride: konflux-kyverno
admissionController:
  replicas: 3
  initContainer:
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 100m
        memory: 256Mi
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: null
      runAsGroup: null
      capabilities:
        drop:
        - "ALL"
  container:
    extraArgs:
      leaderElectionRetryPeriod: 26s
    resources:
      requests:
        cpu: 4000m
        memory: 2Gi
      limits:
        cpu: 4000m
        memory: 2Gi
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: null
      runAsGroup: null
      capabilities:
        drop:
        - "ALL"
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 2
    minAvailable: null
    unhealthyPodEvictionPolicy: AlwaysAllow
backgroundController:
  replicas: 3
  extraArgs:
    leaderElectionRetryPeriod: 26s
  resources:
    requests:
      cpu: 4000m
      memory: 2Gi
    limits:
      cpu: 4000m
      memory: 2Gi
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: null
    runAsGroup: null
    capabilities:
      drop:
      - "ALL"
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 2
    minAvailable: null
    unhealthyPodEvictionPolicy: AlwaysAllow
cleanupController:
  replicas: 3
  extraArgs:
    leaderElectionRetryPeriod: 26s
  resources:
    requests:
      cpu: 500m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 256Mi
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: null
    runAsGroup: null
    capabilities:
      drop:
      - "ALL"
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 2
    minAvailable: null
    unhealthyPodEvictionPolicy: AlwaysAllow
reportsController:
  enabled: false
policyReportsCleanup:
  image:
    registry: mirror.gcr.io
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: null
    runAsGroup: null
    runAsGroup: null
    runAsUser: null
    capabilities:
      drop:
      - "ALL"
webhooksCleanup:
  image:
    registry: mirror.gcr.io
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: null
    runAsGroup: null
    runAsGroup: null
    runAsUser: null
    capabilities:
      drop:
      - "ALL"
test:
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: null
    runAsGroup: null
    runAsGroup: null
    runAsUser: null
    capabilities:
      drop:
      - "ALL"
crds:
  annotations:
    argocd.argoproj.io/sync-options: "Replace=true"
  migration:
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: null
      runAsGroup: null
      runAsGroup: null
      runAsUser: null
      capabilities:
        drop:
        - "ALL"
features:
  admissionReports:
    enabled: false
  aggregateReports:
    enabled: false
  policyReports:
    enabled: false
  validatingAdmissionPolicyReports:
    enabled: false
  reporting:
    validate: false
    mutate: false
    mutateExisting: false
    imageVerify: false
    generate: false
kyverno-api:
  annotations:
    argocd.argoproj.io/sync-options: "Replace=true"
