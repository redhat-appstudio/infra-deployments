apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: notification-controller

resources:
- https://github.com/konflux-ci/notification-service/config/default?ref=de31079d6cd7175360c9d77fa5664a023199f80d
- aws-sns-es.yaml

images:
  - name: quay.io/konflux-ci/notification-service
    newName: quay.io/konflux-ci/notification-service
    newTag: de31079d6cd7175360c9d77fa5664a023199f80d

patches:
  - path: patches/topic_region_add-patch.yaml
    target:
      name: notification-controller-controller-manager
      kind: Deployment
  - path: patches/pipelinerun_filters-patch.yaml
    target:
      name: notification-controller-controller-manager
      kind: Deployment
