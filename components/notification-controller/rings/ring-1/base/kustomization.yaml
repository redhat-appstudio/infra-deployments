apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: notification-controller

resources:
- https://github.com/konflux-ci/notification-service/config/default?ref=abc7f34a39732a77611b03984197c95f9e00951f
- aws-sns-es.yaml

images:
  - name: quay.io/konflux-ci/notification-service
    newName: quay.io/konflux-ci/notification-service
    newTag: abc7f34a39732a77611b03984197c95f9e00951f

patches:
  - path: patches/topic_region_add-patch.yaml
    target:
      name: notification-controller-controller-manager
      kind: Deployment
  - path: patches/pipelinerun_filters-patch.yaml
    target:
      name: notification-controller-controller-manager
      kind: Deployment
