apiVersion: konflux.konflux-ci.dev/v1alpha1
kind: Konflux
metadata:
  name: konflux
spec:
  buildService:
    spec:
      pacWebhookInsecureSSL: true
      logEncoder: console
      webhookURLs:
        "https://codeberg.org": "SMEE_CHANNEL_PLACEHOLDER"
      pipelineConfig:
        # Align with legacy build-pipeline-config (default + additional-params).
        defaultPipelineName: docker-build-oci-ta
        pipelines:
          - name: fbc-builder
            bundle: quay.io/konflux-ci/tekton-catalog/pipeline-fbc-builder:devel
            description: "Build and validate File Based Catalogs"
            additionalParams:
              - build-platforms
          - name: docker-build-multi-platform-oci-ta
            bundle: quay.io/konflux-ci/tekton-catalog/pipeline-docker-build-multi-platform-oci-ta:devel
            description: "Build multi-platform container images with secure data transfer for the pipelines"
            additionalParams:
              - build-platforms
      buildControllerManager:
        replicas: 1
        manager:
          env:
            - name: IMAGE_TAG_ON_PR_EXPIRATION
              value: ""
