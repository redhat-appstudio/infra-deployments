# Same monitoring.coreos.com view verbs as o11y-admins-cluster-view, for
# RoleBindings scoped to konflux-operator managed namespaces.
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: konflux-servicemonitor-view
rules:
  - apiGroups:
      - monitoring.coreos.com
    resources:
      - alertmanagers
      - prometheuses
      - prometheusrules
      - servicemonitors
      - podmonitors
      - thanosrulers
    verbs:
      - get
      - list
      - watch
