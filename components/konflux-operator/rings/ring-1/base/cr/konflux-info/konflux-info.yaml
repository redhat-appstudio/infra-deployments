apiVersion: konflux.konflux-ci.dev/v1alpha1
kind: Konflux
metadata:
  name: konflux
spec:
  info:
    spec:
      clusterConfig:
        data:
          additionalCBOMGenerationRulesImage: image-registry.openshift-image-registry.svc:5000/crypto-scanner/crypto-rules-image:latest
          allowCacheProxy: true
          allowPackageRegistryProxy: true
          enableCBOMGenerationTask: true
          httpProxy: squid.container-image-proxy.svc.cluster.local:3128
          noProxy: ""
          packageRegistryProxyGomodUrl: https://artifact-registry-proxy.artifact-registry-proxy.svc.cluster.local/repository/go-proxy
          packageRegistryProxyNpmUrl: https://artifact-registry-proxy.artifact-registry-proxy.svc.cluster.local/repository/npm-proxy
          packageRegistryProxyPipUrl: https://artifact-registry-proxy.artifact-registry-proxy.svc.cluster.local/repository/pypi-proxy/simple
          packageRegistryProxyPnpmUrl: https://artifact-registry-proxy.artifact-registry-proxy.svc.cluster.local/repository/npm-proxy
          packageRegistryProxyYarnUrl: https://artifact-registry-proxy.artifact-registry-proxy.svc.cluster.local/repository/npm-proxy
      publicInfo:
        environment: staging
        integrations:
          sbom_server:
            url: "https://atlas.build.stage.devshift.net/sbom/content/<PLACEHOLDER>"
            sbom_sha: "https://atlas.build.stage.devshift.net/sboms/<PLACEHOLDER>"
          image_controller:
            enabled: true
            notifications:
              - title: "SBOM-event-to-Bombino"
                event: "repo_push"
                method: "webhook"
                config:
                  url: "https://bombino.preprod.api.redhat.com/v1/sbom/quay/push"
      banner:
        items:
          - summary: "**Konflux clusters are temporarily blocked and PipelineRuns will not run.** Builds, tests and releases are paused; retrying will not help. Follow **#konflux-users** for updates and [open a user support ticket](https://redhat.enterprise.slack.com/archives/C04PZ7H0VA8) if you need help."
            type: danger
