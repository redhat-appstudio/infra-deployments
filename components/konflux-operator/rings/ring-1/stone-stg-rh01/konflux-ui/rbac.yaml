kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: konflux-ui-admin
  namespace: konflux-ui
rules:
  - apiGroups:
      - ''
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch
      - update
      - patch
      - delete
---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: konflux-ui-admins
  namespace: konflux-ui
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: konflux-ui
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: konflux-ui-admin
