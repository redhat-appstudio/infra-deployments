apiVersion: konflux.konflux-ci.dev/v1alpha1
kind: Konflux
metadata:
  name: konflux
spec:
  info:
    spec:
      banner:
        items:
          - summary: "This cluster is being migrated to the Konflux Operator. Users are not expected to be affected."
            type: info
          - summary: "Konflux Maintenance Window Every Friday"
            type: info
            dayOfWeek: 5
            startTime: "02:00"
            endTime: "06:00"
            timeZone: "America/Los_Angeles"
      clusterConfig:
        data:
          packageRegistryProxyBundlerUrl: https://artifact-registry-proxy.artifact-registry-proxy.svc.cluster.local/repository/rubygems-proxy
          packageRegistryProxyCargoUrl: https://artifact-registry-proxy.artifact-registry-proxy.svc.cluster.local/repository/cargo-proxy
      publicInfo:
        visibility: public
        statusPageUrl: "https://grafana.app-sre.devshift.net/d/aes1ns0htwni8a/konflux-status-page?var-cluster=stone-stg-rh01"
        integrations:
          github:
            application_url: "https://github.com/apps/konflux-staging"
