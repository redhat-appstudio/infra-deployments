apiVersion: apps/v1
kind: Deployment
metadata:
  name: konflux-operator-controller-manager
  namespace: konflux-operator
spec:
  template:
    spec:
      containers:
        - name: manager
          resources:
            limits:
              cpu: 500m
              memory: 1Gi
            requests:
              cpu: 500m
              memory: 1Gi
