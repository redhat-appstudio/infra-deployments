apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Owned by konflux-operator-stone-prd-rh01 after the legacy image-controller Application
# is removed. Keep in sync with components/image-controller/production/stone-prd-rh01/resources
# until that copy is deleted.
resources:
- redhat-appstudio-pr-token.yaml
- redhat-appstudio-pr-cronjob.yaml
- konflux-ci-pull-request-builds-pruner-token.yaml
- konflux-ci-pull-request-builds-pruner-cronjob.yaml
configMapGenerator:
- name: single-image-pruner-configmap
  files:
  - image_pruner/prune_images.py
namespace: image-controller
