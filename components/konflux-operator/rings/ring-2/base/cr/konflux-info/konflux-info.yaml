apiVersion: konflux.konflux-ci.dev/v1alpha1
kind: Konflux
metadata:
  name: konflux
spec:
  info:
    spec:
      clusterConfig:
        data:
          allowCacheProxy: true
          allowPackageRegistryProxy: true
          httpProxy: squid.container-image-proxy.svc.cluster.local:3128
          noProxy: ""
          packageRegistryProxyBundlerUrl: https://artifact-registry-proxy.artifact-registry-proxy.svc.cluster.local/repository/rubygems-proxy
          packageRegistryProxyCargoUrl: https://artifact-registry-proxy.artifact-registry-proxy.svc.cluster.local/repository/cargo-proxy
          packageRegistryProxyGomodUrl: https://artifact-registry-proxy.artifact-registry-proxy.svc.cluster.local/repository/go-proxy
          packageRegistryProxyNpmUrl: https://artifact-registry-proxy.artifact-registry-proxy.svc.cluster.local/repository/npm-proxy
          packageRegistryProxyPipUrl: https://artifact-registry-proxy.artifact-registry-proxy.svc.cluster.local/repository/pypi-proxy/simple
          packageRegistryProxyPnpmUrl: https://artifact-registry-proxy.artifact-registry-proxy.svc.cluster.local/repository/npm-proxy
          packageRegistryProxyYarnUrl: https://artifact-registry-proxy.artifact-registry-proxy.svc.cluster.local/repository/npm-proxy
      publicInfo:
        environment: production
        integrations:
          sbom_server:
            url: "https://atlas.build.devshift.net/sbom/content/<PLACEHOLDER>"
            sbom_sha: "https://atlas.build.devshift.net/sboms/<PLACEHOLDER>"
          image_controller:
            enabled: true
            notifications:
              - title: "SBOM-event-to-Bombino"
                event: "repo_push"
                method: "webhook"
                config:
                  url: "https://bombino.api.redhat.com/v1/sbom/quay/push"
      banner:
        items:
          - summary: "**Konflux service recovery is in progress.** You may experience intermittent build, release, or workspace failures while we validate services. Please retry failed operations and [open a user support ticket](https://slack.com/shortcuts/Ft06PVJ0MA4C/faf6b3b07e3f985826663ff1fea965f0) in **#konflux-users** if the issue persists."
            type: warning
