apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../base
  - konflux-ui/letsencrypt

patches:
  - path: build/external-secret-path-patch.yaml
    target:
      name: pipelines-as-code-secret
      namespace: build-service
      group: external-secrets.io
      version: v1
      kind: ExternalSecret
  - path: integration/external-secret-path-patch.yaml
    target:
      name: pipelines-as-code-secret
      namespace: integration-service
      group: external-secrets.io
      version: v1
      kind: ExternalSecret
  - path: integration/console-name-patch.yaml
  - path: image-controller/quaytoken-path-patch.yaml
    target:
      name: quaytoken
      namespace: image-controller
      group: external-secrets.io
      version: v1
      kind: ExternalSecret
  - path: image-controller/image-pruner-token-path-patch.yaml
    target:
      name: image-pruner-token
      namespace: image-controller
      group: external-secrets.io
      version: v1
      kind: ExternalSecret
  - path: konflux-info/info-patch.yaml
  - path: konflux-ui/ui-patch.yaml
