apiVersion: konflux.konflux-ci.dev/v1alpha1
kind: Konflux
metadata:
  name: konflux
spec:
  info:
    spec:
      # Pre-migration Fedora had no konflux-info cluster-config ConfigMap and does
      # not deploy artifact-registry-proxy. Replace (do not merge) the ring-2
      # clusterConfig so later additive edits here cannot re-inherit base proxy
      # URLs. Operator emits cluster-config with empty data.
      clusterConfig:
        $patch: replace
        data: {}
      banner:
        items:
          - summary: "This cluster is being migrated to the Konflux Operator. Users are not expected to be affected."
            type: info
      publicInfo:
        visibility: public
        integrations:
          github:
            application_url: "https://github.com/apps/red-hat-konflux-kflux-fedora-01"
