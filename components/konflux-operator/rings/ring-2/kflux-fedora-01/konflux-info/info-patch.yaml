apiVersion: konflux.konflux-ci.dev/v1alpha1
kind: Konflux
metadata:
  name: konflux
spec:
  info:
    spec:
      # Pre-migration Fedora had no konflux-info cluster-config ConfigMap and does
      # not deploy artifact-registry-proxy. Replace (do not merge) the ring-2
      # clusterConfig so later additive edits here cannot re-inherit base proxy
      # URLs. Use explicit false flags — empty data: {} is rejected by SSA as
      # data: null, which the KonfluxInfo CRD does not allow.
      clusterConfig:
        $patch: replace
        data:
          allowCacheProxy: false
          allowPackageRegistryProxy: false
      banner:
        items:
          - summary: "**Konflux service recovery is in progress.** You may experience intermittent build, release, or workspace failures while we validate services. Please retry failed operations and [open a user support ticket](https://slack.com/shortcuts/Ft06PVJ0MA4C/faf6b3b07e3f985826663ff1fea965f0) in **#konflux-users** if the issue persists."
            type: warning
      publicInfo:
        visibility: public
        integrations:
          github:
            application_url: "https://github.com/apps/red-hat-konflux-kflux-fedora-01"
