apiVersion: konflux.konflux-ci.dev/v1alpha1
kind: Konflux
metadata:
  name: konflux
spec:
  info:
    spec:
      # kflux-fedora-01 does not deploy artifact-registry-proxy.
      clusterConfig:
        data:
          allowPackageRegistryProxy: false
          packageRegistryProxyBundlerUrl: null
          packageRegistryProxyCargoUrl: null
          packageRegistryProxyGomodUrl: null
          packageRegistryProxyNpmUrl: null
          packageRegistryProxyPipUrl: null
          packageRegistryProxyPnpmUrl: null
          packageRegistryProxyYarnUrl: null
      banner:
        items:
          - summary: "This cluster is being migrated to the Konflux Operator. Users are not expected to be affected."
            type: info
      publicInfo:
        visibility: public
        integrations:
          github:
            application_url: "https://github.com/apps/red-hat-konflux-kflux-fedora-01"
