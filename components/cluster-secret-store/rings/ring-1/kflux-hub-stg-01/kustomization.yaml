apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base

# Only the hub reads the MultiKueue spoke credentials from Vault.
patches:
  - target:
      group: external-secrets.io
      version: v1
      kind: ClusterSecretStore
      name: appsre-stonesoup-vault
    patch: |-
      - op: add
        path: /spec/conditions/0/namespaces/-
        value: openshift-kueue-operator
