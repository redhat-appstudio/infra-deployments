---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: appsre-stonesoup-vault
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  provider:
    vault:
      server: "https://vault.ci.ext.devshift.net"
      path: stonesoup
      version: v2
      auth:
        # VaultAppRole authenticates with Vault using the
        # App Role auth mechanism
        # https://www.vaultproject.io/docs/auth/approle
        appRole:
          # Path where the App Role authentication backend is mounted
          path: approle
          # RoleID configured in the App Role authentication backend
          roleId: d2d9c931-5fce-7b40-bf69-f4ee411ee891
          # Reference to a key in a K8 Secret that contains the App Role SecretId
          secretRef:
            name: appsre-vault
            key: secret-id
            namespace: appsre-vault

  # --- DO NOT MAKE EDITS TO THIS SECTION ---
  # The namespaces allowed to access this ClusterSecretStore are patched at the ring level.
  # This set of matchExpressions is used to deny access to all namespaces in the case that
  # no patches are applied at the ring level.
  conditions:
    - namespaceSelector:
        matchExpressions:
          - key: appstudio.redhat.com/select-none
            operator: Exists
          - key: appstudio.redhat.com/select-none
            operator: DoesNotExist
