apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  - target:
      group: external-secrets.io
      version: v1
      kind: ClusterSecretStore
      name: appsre-vault
    patch: |-
      - op: add
        path: /spec/conditions/0/namespaces/-
        value: cost-mgmt-dev-tenant
