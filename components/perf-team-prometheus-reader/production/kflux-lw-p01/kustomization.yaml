apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../base
patches:
  - path: sa-token-creator-rolebinding-patch.yaml
    target:
      name: perf-team-sa-token-creator
      group: rbac.authorization.k8s.io
      version: v1
      kind: RoleBinding
  - path: maintainers-rolebinding-patch.yaml
    target:
      name: perf-team-prometheus-reader-maintainers
      group: rbac.authorization.k8s.io
      version: v1
      kind: RoleBinding
  - path: serviceaccounttoken-manager-rolebinding-patch.yaml
    target:
      name: serviceaccounttoken-manager:konflux-perfscale
      namespace: managed-konflux-perfscale-tenant
      group: rbac.authorization.k8s.io
      version: v1
      kind: RoleBinding
