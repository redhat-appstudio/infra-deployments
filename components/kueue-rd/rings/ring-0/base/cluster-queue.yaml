---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "10"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  name: "default-flavor"
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: cluster-pipeline-queue
  annotations:
    argocd.argoproj.io/sync-wave: "10"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
    flavorFungibility:
      whenCanBorrow: MayStopSearch
      whenCanPreempt: TryNextFlavor
    namespaceSelector: {}
    preemption:
      borrowWithinCohort:
        policy: Never
      reclaimWithinCohort: Never
      withinClusterQueue: Never
    queueingStrategy: BestEffortFIFO
    resourceGroups:
    - coveredResources:
      - tekton.dev/pipelineruns
      - konflux-ci-dev-token
      - cpu
      - memory
      - linux-arm64
      - linux-amd64
      - linux-s390x
      - linux-ppc64le
      - aws-ip
      - mintmaker
      - konflux-release
      flavors:
      - name: default-flavor
        resources:
        - name: tekton.dev/pipelineruns
          nominalQuota: "600"
        - name: konflux-ci-dev-token
          nominalQuota: "500"
        - name: linux-arm64
          nominalQuota: "10"
        - name: linux-amd64
          nominalQuota: "10"
        - name: linux-s390x
          nominalQuota: "10"
        - name: linux-ppc64le
          nominalQuota: "10"
        - name: aws-ip
          nominalQuota: "250"
        - name: mintmaker
          nominalQuota: "150"
        - name: konflux-release
          nominalQuota: '100'
        # When a Workload doesn't have cpu or memory requests, if there is a limit range
        # in the namespace, Kueue will assign the requests from it to the Workload.
        # We don't care about the cpu/memory for PipelineRuns, thus setting a high value for both.
        - name: "cpu"
          nominalQuota: 1k
        - name: "memory"
          nominalQuota: 500Ti
