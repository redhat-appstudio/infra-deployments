apiVersion: v1
kind: ConfigMap
metadata:
  name: application-cleaner-configmap
data:
  RETENTION_DAYS: "30"
  NAMESPACE_LABEL_SELECTOR: "konflux-ci.dev/enable-application-cleaner=true"
  application-cleaner.sh: |
    #!/bin/bash
    set -euo pipefail

    retention_days="${RETENTION_DAYS:-30}"
    namespace_label_selector="${NAMESPACE_LABEL_SELECTOR:-}"
    dry_run="${DRY_RUN:-false}"
    slack_webhook_url="${SLACK_WEBHOOK_URL:-}"
    namespace="${POD_NAMESPACE:-application-cleaner}"
    pod_name="${POD_NAME:-${HOSTNAME:-unknown}}"

    # Posts variables expected by a Slack Workflow "Webhook" trigger.
    # Workflow variables: status, emoji, summary, job_link, namespace, pod_name
    send_slack_notification() {
      local status="$1"
      local summary="$2"

      if [[ -z "${slack_webhook_url}" ]]; then
        echo "SLACK_WEBHOOK_URL is not set; skipping Slack notification"
        return 0
      fi

      local emoji
      if [[ "${status}" == "success" ]]; then
        emoji=":white_check_mark:"
      else
        emoji=":x:"
      fi

      local console_url=""
      console_url="$(kubectl get configmap console-public -n openshift-config-managed \
        -o jsonpath='{.data.consoleURL}' 2>/dev/null || true)"

      local job_link="Pod: ${namespace}/${pod_name}"
      if [[ -n "${console_url}" ]]; then
        job_link="${console_url}/k8s/ns/${namespace}/pods/${pod_name}"
      fi

      local payload
      payload="$(cat <<EOF
{
  "status": "$(printf '%s' "${status}" | sed 's/\\/\\\\/g; s/"/\\"/g')",
  "emoji": "$(printf '%s' "${emoji}" | sed 's/\\/\\\\/g; s/"/\\"/g')",
  "summary": "$(printf '%s' "${summary}" | sed 's/\\/\\\\/g; s/"/\\"/g')",
  "job_link": "$(printf '%s' "${job_link}" | sed 's/\\/\\\\/g; s/"/\\"/g')",
  "namespace": "$(printf '%s' "${namespace}" | sed 's/\\/\\\\/g; s/"/\\"/g')",
  "pod_name": "$(printf '%s' "${pod_name}" | sed 's/\\/\\\\/g; s/"/\\"/g')"
}
EOF
)"

      echo "Sending Slack Workflow notification (${status})..."
      if ! response="$(curl -sS --max-time 10 -X POST "${slack_webhook_url}" \
        -H 'Content-Type: application/json; charset=utf-8' \
        -d "${payload}")"; then
        echo "Failed to send Slack notification (curl error)"
        return 0
      fi
      echo "Slack webhook response: ${response}"
    }

    if [[ -z "${namespace_label_selector}" ]]; then
      echo "NAMESPACE_LABEL_SELECTOR is not set; skipping cleanup"
      send_slack_notification "success" "Skipped: NAMESPACE_LABEL_SELECTOR is not set"
      exit 0
    fi

    retention_seconds=$((retention_days * 24 * 60 * 60))
    now_epoch="$(date +%s)"
    cutoff_epoch=$((now_epoch - retention_seconds))

    mapfile -t namespaces < <(
      kubectl get namespaces -l "${namespace_label_selector}" \
        -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}'
    )

    if [[ "${#namespaces[@]}" -eq 0 ]]; then
      echo "No namespaces found with label selector ${namespace_label_selector}"
      send_slack_notification "success" "No namespaces matched label selector \`${namespace_label_selector}\`"
      exit 0
    fi

    removed=0
    skipped=0
    failed=0

    for ns in "${namespaces[@]}"; do
      [[ -z "${ns}" ]] && continue
      echo "Processing namespace: ${ns}"

      mapfile -t applications < <(
        kubectl get applications.appstudio.redhat.com -n "${ns}" \
          -o jsonpath='{range .items[*]}{.metadata.name}{" "}{.metadata.creationTimestamp}{"\n"}{end}' \
          2>/dev/null || true
      )

      for application_line in "${applications[@]}"; do
        [[ -z "${application_line}" ]] && continue
        application_name="${application_line%% *}"
        created_at="${application_line#* }"

        if ! created_epoch="$(date -d "${created_at}" +%s 2>/dev/null)"; then
          echo "Skipping ${application_name}: invalid creation timestamp ${created_at}"
          skipped=$((skipped + 1))
          continue
        fi

        if [[ "${created_epoch}" -lt "${cutoff_epoch}" ]]; then
          if [[ "${dry_run}" == "true" ]]; then
            echo "[DRY RUN] Would delete application ${application_name} in ${ns} (created ${created_at})"
            removed=$((removed + 1))
          else
            echo -n "Deleting application ${application_name} in ${ns} (created ${created_at})... "
            if kubectl delete applications.appstudio.redhat.com "${application_name}" -n "${ns}" --ignore-not-found=true; then
              echo "DELETED"
              removed=$((removed + 1))
            else
              echo "FAILED"
              failed=$((failed + 1))
            fi
          fi
        else
          skipped=$((skipped + 1))
        fi
      done
    done

    summary="Removed: ${removed}, Skipped: ${skipped}, Failed: ${failed}"
    echo "${summary}"

    if [[ "${failed}" -gt 0 ]]; then
      send_slack_notification "failure" "${summary}"
      exit 1
    fi

    send_slack_notification "success" "${summary}"
