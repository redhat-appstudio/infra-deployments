apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# unsetOnly keeps Role/RoleBinding in openshift-config-managed while
# assigning application-cleaner to resources without a namespace set.
transformers:
  - |-
    apiVersion: builtin
    kind: NamespaceTransformer
    metadata:
      name: set-application-cleaner-ns
      namespace: application-cleaner
    unsetOnly: true
resources:
  - serviceaccount.yaml
  - clusterrole-namespace-reader.yaml
  - clusterrolebinding-namespace-reader.yaml
  - role-console-public-reader.yaml
  - rolebinding-console-public-reader.yaml
  - clusterrolebinding.yaml
  - external-secret-slack-webhook.yaml
  - configmap.yaml
  - cronjob.yaml
