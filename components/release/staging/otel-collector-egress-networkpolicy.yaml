apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: release-service-egress-otel-collector
  namespace: release-service
spec:
  podSelector:
    matchLabels:
      control-plane: controller-manager
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: konflux-otel
      ports:
        - protocol: TCP
          port: 4317
