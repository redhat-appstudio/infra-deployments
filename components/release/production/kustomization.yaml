apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
  - ../base/monitor/production
  - external-secrets/release-service-github-token.yaml
  - https://github.com/konflux-ci/release-service/config/default?ref=3f78e9ca61075d10298f9edcb3902a50e92628c2
  - release_service_config.yaml
  - signing_configs.yaml

components:
  - ../k-components/manager-resources-patch

images:
  - name: quay.io/konflux-ci/release-service
    newName: quay.io/konflux-ci/release-service
    newTag: 3f78e9ca61075d10298f9edcb3902a50e92628c2

namespace: release-service

patches:
  - target:
      group: rbac.authorization.k8s.io
      version: v1
      kind: ClusterRole
      name: release-pipeline-resource-role
    path: ibm-public-key-patch.yaml
