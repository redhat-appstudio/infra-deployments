apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Ring 1 production rollout patches
# Add patches here when deploying to ring 1 clusters
# Clear this file (leave only these comments) after promoting to all rings

resources:
  - ../../base

patches:
  - target:
      kind: TektonConfig
      name: config
    patch: |-
      - op: add
        path: /spec/pipeline/options/configMaps/bundleresolver-config
        value:
          data:
            fetch-timeout: "2m"
            backoff-duration: "15s"
            backoff-factor: "2.0"
            backoff-steps: "10"
            backoff-cap: "15m"
      - op: add
        path: /spec/pipeline/options/configMaps/git-resolver-config
        value:
          data:
            fetch-timeout: "2m"
