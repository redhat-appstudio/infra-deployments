apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Ring 3 production rollout patches
# Add patches here when deploying to ring 3 clusters
# Clear this file (leave only these comments) after promoting to all rings

resources:
  - ../../base

patches:
  # Hold back termination message compression until Ring 3 promotion
  - target:
      kind: TektonConfig
      name: config
    patch: |-
      - op: remove
        path: /spec/pipeline/options/configMaps/feature-flags
