# Dev-only storage: MinIO (S3) for Tekton Results. MinIO runs with reduced resources.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  name: openshift-minio-apply-tenants
rules:
- apiGroups:
  - minio.min.io
  resources:
  - tenants
  verbs:
  - get
  - create
  - update
  - patch
  - delete
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - '*'
- apiGroups:
  - ""
  resources:
  - serviceaccounts
  - services
  verbs:
  - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  name: openshift-minio-apply-tenants
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: openshift-minio-apply-tenants
subjects:
- kind: ServiceAccount
  name: openshift-gitops-argocd-application-controller
  namespace: openshift-gitops
---
apiVersion: v1
kind: Secret
metadata:
  name: minio-storage-configuration
  namespace: openshift-pipelines
type: Opaque
stringData:
  config.env: |
    export MINIO_ROOT_USER=minioadmin # gitleaks:allow
    export MINIO_ROOT_PASSWORD=minioadmin # gitleaks:allow
---
apiVersion: v1
kind: Secret
metadata:
  name: tekton-results-s3
  namespace: openshift-pipelines
type: Opaque
stringData:
  aws_access_key_id: minioadmin # gitleaks:allow
  aws_secret_access_key: minioadmin # gitleaks:allow
  aws_region: us-east-1
  bucket: tekton-results
  endpoint: https://minio.openshift-pipelines.svc.cluster.local
---
apiVersion: minio.min.io/v2
kind: Tenant
metadata:
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "0"
    prometheus.io/path: /minio/v2/metrics/cluster
    prometheus.io/port: "9000"
    prometheus.io/scrape: "true"
  labels:
    app: minio
  name: storage
  namespace: openshift-pipelines
spec:
  certConfig: {}
  configuration:
    name: minio-storage-configuration
  env: []
  exposeServices:
    minio: false
  externalCaCertSecret: []
  externalCertSecret: []
  externalClientCertSecrets: []
  features:
    bucketDNS: false
    domains: {}
  image: quay.io/minio/minio:RELEASE.2024-08-26T15-33-07Z
  imagePullSecret: {}
  mountPath: /export
  podManagementPolicy: Parallel
  pools:
  - affinity:
      nodeAffinity: {}
      podAffinity: {}
      podAntiAffinity: {}
    containerSecurityContext: {}
    name: pool-0
    nodeSelector: {}
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    securityContext: {}
    servers: 1
    tolerations: []
    volumeClaimTemplate:
      apiVersion: v1
      kind: persistentvolumeclaims
      metadata: {}
      spec:
        accessModes:
        - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
      status: {}
    volumesPerServer: 2
  priorityClassName: ""
  requestAutoCert: true
  serviceMetadata:
    consoleServiceAnnotations: {}
    consoleServiceLabels: {}
    minioServiceAnnotations: {}
    minioServiceLabels: {}
  subPath: ""
---
apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
  name: create-minio-bucket
  namespace: openshift-pipelines
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: mc
        image: quay.io/minio/mc:RELEASE.2023-01-28T20-29-38Z
        command:
        - /bin/sh
        - -c
        - |
          set -e
          echo "Waiting for MinIO to become ready..."
          for i in $(seq 1 30); do
            if mc --insecure --config-dir /tmp config host add minio "$S3_ENDPOINT" "$S3_ACCESS_KEY_ID" "$S3_SECRET_ACCESS_KEY" >/dev/null 2>&1; then
              echo "MinIO is ready."
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "MinIO did not become ready in time." >&2
              exit 1
            fi
            echo "MinIO not ready yet (attempt $i/30), retrying in 10s..."
            sleep 10
          done
          if mc --insecure --config-dir /tmp ls minio | grep -q "$S3_BUCKET_NAME"; then
            echo "Bucket $S3_BUCKET_NAME already exists."
          else
            mc --insecure --config-dir /tmp mb --with-lock --region "$S3_REGION" minio/"$S3_BUCKET_NAME"
            echo "Bucket $S3_BUCKET_NAME created."
          fi
        env:
        - name: S3_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              key: aws_access_key_id
              name: tekton-results-s3
        - name: S3_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              key: aws_secret_access_key
              name: tekton-results-s3
        - name: S3_REGION
          valueFrom:
            secretKeyRef:
              key: aws_region
              name: tekton-results-s3
        - name: S3_BUCKET_NAME
          valueFrom:
            secretKeyRef:
              key: bucket
              name: tekton-results-s3
        - name: S3_ENDPOINT
          valueFrom:
            secretKeyRef:
              key: endpoint
              name: tekton-results-s3
        resources:
          limits:
            cpu: 100m
            memory: 128Mi
          requests:
            cpu: 5m
            memory: 32Mi
        securityContext:
          readOnlyRootFilesystem: true
          runAsNonRoot: true
        volumeMounts:
        - mountPath: /tmp
          name: tmp-mc-volume
      volumes:
      - emptyDir: {}
        name: tmp-mc-volume
