apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Skip applying the Tekton/PaC operands while the Tekton/PaC operator is being installed.
# See more information about this option, here:
# https://argo-cd.readthedocs.io/en/stable/user-guide/sync-options/#skip-dry-run-for-new-custom-resources-types
commonAnnotations:
  argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true

resources:
  - github.com/minio/operator?ref=v5.0.15  # when updating the tag, update also the patches below
  - main-pipeline-service-configuration.yaml
  - dev-only-pipeline-service-storage-configuration.yaml
  - ../base/rbac/cluster-role
  - ../base/rbac/openshift-pipelines
  - ../base/rbac/tekton-logging
  - ../base/rbac/tekton-results

patches:
  - target:
      kind: Service
      name: operator
      namespace: minio-operator
    patch: |
      - op: add
        path: /metadata/annotations/ignore-check.kube-linter.io~1dangling-service
        value: This service is not dangling. The minio operator assigns the missing labels at runtime.
  - target:
      kind: Deployment
      name: minio-operator
      namespace: minio-operator
    patch: |
      - op: add
        path: /metadata/annotations/ignore-check.kube-linter.io~1no-read-only-root-fs
        value: The operator needs to be able to write to /tmp
      - op: add
        path: /spec/template/spec/containers/0/resources/requests
        value:
          cpu: 50m
          memory: 128Mi
      - op: add
        path: /spec/template/spec/containers/0/resources/limits
        value:
          cpu: 200m
          memory: 256Mi
      - op: remove
        path: /spec/template/spec/containers/0/securityContext/runAsUser
      - op: remove
        path: /spec/template/spec/containers/0/securityContext/runAsGroup
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: "quay.io/minio/operator:v5.0.15"
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: console
      namespace: minio-operator
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
      - op: remove
        path: /spec/template/spec/containers/0/securityContext/runAsUser
      - op: remove
        path: /spec/template/spec/containers/0/securityContext/runAsGroup
      - op: add
        path: /spec/template/spec/containers/0/securityContext/readOnlyRootFilesystem
        value: true
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: "quay.io/minio/operator:v5.0.15"
  - target:
      kind: RoleBinding
      name: pipeline-service-sre-ns-edit
      namespace: tekton-results
    patch: |
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: pipeline-service-sre-ns-edit
        namespace: tekton-results
  - target:
      kind: Role
      name: pipeline-service-sre-exec-pprof-data
      namespace: tekton-results
    patch: |
      - op: replace
        path: /metadata/namespace
        value: openshift-pipelines
      - op: replace
        path: /rules/0/resources/0
        value: pods/exec
  - target:
      kind: RoleBinding
      name: pipeline-service-sre-exec-pprof-data
      namespace: tekton-results
    patch: |
      - op: replace
        path: /metadata/namespace
        value: openshift-pipelines
