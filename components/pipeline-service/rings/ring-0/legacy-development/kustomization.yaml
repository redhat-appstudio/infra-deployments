apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Legacy Development variant: inherits the full ring-0 base but adds the
# `appstudio-pipelines-scc` SecurityContextConstraints because the operator
# (which owns the SCC) is not deployed in the 'development' overlay.
resources:
  - ../base
  - appstudio-pipelines-scc.yaml
