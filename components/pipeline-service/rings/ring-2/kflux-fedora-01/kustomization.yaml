apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../base
  - global-repository.yaml
  - global-repository-secret.yaml
  - tekton-pipelines-controller-scc-crb.yaml

patches:
  # ExternalSecret patches
  - target:
      kind: ExternalSecret
      name: pipelines-as-code-secret
      namespace: openshift-pipelines
    path: patches/pipelines-as-code-es-key-patch.yaml
  - target:
      kind: ExternalSecret
      name: tekton-chains-public-key
      namespace: openshift-pipelines
    path: patches/tekton-chains-public-key-es-key-patch.yaml
  - target:
      kind: ExternalSecret
      name: tekton-chains-signing-secret
      namespace: openshift-pipelines
    path: patches/tekton-chains-signing-es-key-patch.yaml
  - target:
      kind: ExternalSecret
      name: tekton-results-s3
      namespace: tekton-logging
    path: patches/tekton-results-s3-es-key-patch.yaml
  - target:
      kind: ExternalSecret
      name: tekton-results-database
      namespace: tekton-results
    path: patches/tekton-results-db-es-key-patch.yaml
  - target:
      kind: ExternalSecret
      name: tekton-results-s3
      namespace: tekton-results
    path: patches/tekton-results-s3-es-key-patch.yaml
  # TektonConfig patches
  - target:
      kind: TektonConfig
      name: config
    path: patches/update-tekton-cfg-settings-patch.yaml
  # HOTFIX KFLUXSPRT-9575/-9589: PaC v0.52.0 override (#2922 404 + #3013 gitauth-secret)
  # RH multi-arch build (upstream v0.52.0). TODO: swap for GA backport build, then remove.
  - target:
      kind: Subscription
      name: openshift-pipelines-operator
    patch: |-
      - op: add
        path: /spec/config/env/-
        value:
          name: IMAGE_PAC_PAC_CONTROLLER
          value: "quay.io/openshift-pipeline/pipelines-pipelines-as-code-controller-rhel9@sha256:0565c3de5f0010a43cadb1e6e8da206e716389de0e9b77d9372b4806a13c176f"
      - op: add
        path: /spec/config/env/-
        value:
          name: IMAGE_PAC_PAC_WEBHOOK
          value: "quay.io/openshift-pipeline/pipelines-pipelines-as-code-webhook-rhel9@sha256:95e88b7d936d0f4c3bd8091c12d23aa6ece1d0de53933ff91e438be7dcb1b166"
      - op: add
        path: /spec/config/env/-
        value:
          name: IMAGE_PAC_PAC_WATCHER
          value: "quay.io/openshift-pipeline/pipelines-pipelines-as-code-watcher-rhel9@sha256:ab46d9c3bd7475496640b2b4261ffcdaea7490639b8949490e6b8e95cf1755fd"
      - op: add
        path: /spec/config/env/-
        value:
          name: IMAGE_PAC_PAC_CLI
          value: "quay.io/openshift-pipeline/pipelines-pipelines-as-code-cli-rhel9@sha256:a6cc9229f17f39acf2ec77fdefcad5ae453beface09138c3c20e97c41c6d1a28"
