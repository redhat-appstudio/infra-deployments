# Requires PR #15775's compatible release to be promoted into ring-1 first.
- op: add
  path: /spec/kueue
  value:
    disabled: false
    multi-cluster-disabled: false
    fleet-manager: manual
    options:
      deployments:
        tekton-kueue-controller-manager:
          spec:
            replicas: 2
            strategy:
              type: RollingUpdate
              rollingUpdate:
                maxSurge: 25%
                maxUnavailable: 0
            template:
              spec:
                topologySpreadConstraints:
                - maxSkew: 1
                  topologyKey: topology.kubernetes.io/zone
                  whenUnsatisfiable: ScheduleAnyway
                  labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: tekton-kueue
                containers:
                - name: manager
                  args:
                  - --leader-elect-lease-duration=137s
                  - --leader-elect-renew-deadline=107s
                  - --leader-elect-retry-period=26s
                  resources:
                    requests:
                      cpu: 500m
                      memory: 1Gi
                    limits:
                      cpu: 500m
                      memory: 1Gi
        tekton-kueue-webhook:
          spec:
            replicas: 3
            strategy:
              type: RollingUpdate
              rollingUpdate:
                maxSurge: 25%
                maxUnavailable: 0
            template:
              spec:
                topologySpreadConstraints:
                - maxSkew: 1
                  topologyKey: topology.kubernetes.io/zone
                  whenUnsatisfiable: ScheduleAnyway
                  labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: tekton-kueue-webhook
                containers:
                - name: webhook
                  args:
                  - --zap-log-level=5
                  resources:
                    requests:
                      cpu: 200m
                      memory: 256Mi
                    limits:
                      cpu: 200m
                      memory: 256Mi
