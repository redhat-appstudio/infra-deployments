apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base

patches:
  - path: resources/tekton-chains-public-key-path.yaml
    target:
      name: tekton-chains-public-key
      group: external-secrets.io
      version: v1
      kind: ExternalSecret
  - path: resources/tekton-chains-signing-secret-path.yaml
    target:
      name: tekton-chains-signing-secret
      group: external-secrets.io
      version: v1
      kind: ExternalSecret
  - path: resources/tekton-results-database-secret-path.yaml
    target:
      name: tekton-results-database
      group: external-secrets.io
      version: v1
      kind: ExternalSecret
  - path: resources/tekton-results-s3-secret-path.yaml
    target:
      name: tekton-results-s3
      group: external-secrets.io
      version: v1
      kind: ExternalSecret
  - path: resources/pipelines-as-code-secret-path.yaml
    target:
      name: pipelines-as-code-secret
      group: external-secrets.io
      version: v1
      kind: ExternalSecret
  - path: resources/update-tekton-config-pac.yaml
    target:
      kind: TektonConfig
      name: config
