# Mount the trust-manager-managed trusted-ca ConfigMap into Pipelines as Code.
# On ROKS HCP, Proxy CR trustedCA cannot be set, so the OpenShift Pipelines
# operator does not distribute the RH internal CA via tekton-custom-certs.
# Surgical adds: ring-1 base already defines pac-controller/watcher options.
# See components/cert-manager-trusted-ca/staging/kflux-hub-stg-01/ (and kflux-lw-p01).
---
- op: add
  path: /spec/platforms/openshift/pipelinesAsCode/options/deployments/pipelines-as-code-controller/spec/template/spec/containers/0/volumeMounts
  value:
  - name: trusted-ca
    mountPath: /etc/ssl/certs/ca-custom-bundle.crt
    readOnly: true
    subPath: ca-bundle.crt
- op: add
  path: /spec/platforms/openshift/pipelinesAsCode/options/deployments/pipelines-as-code-controller/spec/template/spec/volumes
  value:
  - name: trusted-ca
    configMap:
      name: trusted-ca
      items:
      - key: ca-bundle.crt
        path: ca-bundle.crt
      defaultMode: 420
      optional: false
- op: add
  path: /spec/platforms/openshift/pipelinesAsCode/options/deployments/pipelines-as-code-watcher/spec/template/spec/containers/0/volumeMounts
  value:
  - name: trusted-ca
    mountPath: /etc/ssl/certs/ca-custom-bundle.crt
    readOnly: true
    subPath: ca-bundle.crt
- op: add
  path: /spec/platforms/openshift/pipelinesAsCode/options/deployments/pipelines-as-code-watcher/spec/template/spec/volumes
  value:
  - name: trusted-ca
    configMap:
      name: trusted-ca
      items:
      - key: ca-bundle.crt
        path: ca-bundle.crt
      defaultMode: 420
      optional: false
