apiVersion: operator.tekton.dev/v1alpha1
kind: TektonConfig
metadata:
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "0"
  name: config
spec:
  chain:
    artifacts.oci.storage: oci
    artifacts.pipelinerun.enable-deep-inspection: "true"
    artifacts.pipelinerun.format: slsa/v2alpha3
    artifacts.pipelinerun.storage: oci
    artifacts.taskrun.format: in-toto
    artifacts.taskrun.storage: ""
    builddefinition.buildtype: https://tekton.dev/chains/v2/slsa-tekton
    options:
      deployments:
        tekton-chains-controller:
          spec:
            template:
              spec:
                containers:
                  - args:
                      - --threads-per-controller=32
                      - --kube-api-qps=50
                      - --kube-api-burst=50
                    name: tekton-chains-controller
    transparency.enabled: "false"
  params:
    - name: createRbacResource
      value: "false"
    - name: createCABundleConfigMaps
      value: "false"
  pipeline:
    default-service-account: default
    enable-api-fields: alpha
    enable-bundles-resolver: true
    enable-cluster-resolver: true
    enable-git-resolver: true
    enable-hub-resolver: true
    enable-param-enum: true
    enable-step-actions: true
    metrics.pipelinerun.level: pipeline
    metrics.taskrun.level: task
    options:
      configMaps:
        config-logging:
          data:
            loglevel.controller: info
            loglevel.webhook: info
            zap-logger-config: |
              {
                "level": "info",
                "development": false,
                "sampling": {
                  "initial": 100,
                  "thereafter": 100
                },
                "outputPaths": ["stdout"],
                "errorOutputPaths": ["stderr"],
                "encoding": "json",
                "encoderConfig": {
                  "timeKey": "ts",
                  "levelKey": "level",
                  "nameKey": "logger",
                  "callerKey": "caller",
                  "messageKey": "msg",
                  "stacktraceKey": "stacktrace",
                  "lineEnding": "",
                  "levelEncoder": "",
                  "timeEncoder": "iso8601",
                  "durationEncoder": "string",
                  "callerEncoder": ""
                }
              }
        config-defaults:
          data:
            default-container-resource-requirements: |
              default:
                requests:
                  memory: "256Mi"
                  cpu: "100m"
            default-pod-template: |
              nodeSelector:
                konflux-ci.dev/workload: konflux-tenants
              tolerations:
                - key: konflux-ci.dev/workload
                  operator: "Equal"
                  value: "konflux-tenants"
                  effect: "NoSchedule"
            default-timeout-minutes: "120"
            default-imagepullbackoff-timeout: "15m"
        config-leader-election-resolvers:
          data:
            buckets: "8"
        bundleresolver-config:
          data:
            fetch-timeout: "2m"
            backoff-duration: "15s"
            backoff-factor: "2.0"
            backoff-steps: "10"
            backoff-cap: "15m"
        git-resolver-config:
          data:
            fetch-timeout: "2m"
      deployments:
        tekton-operator-proxy-webhook:
          spec:
            replicas: 2
            template:
              spec:
                containers:
                  - name: proxy
                    resources:
                      limits:
                        cpu: 500m
                        memory: 500Mi
                      requests:
                        cpu: 100m
                        memory: 100Mi
        tekton-pipelines-webhook:
          spec:
            template:
              spec:
                containers:
                  - name: webhook
                    resources:
                      limits:
                        cpu: "1"
                        memory: 1Gi
                      requests:
                        cpu: 400m
                        memory: 1Gi
        pipelines-as-code-controller:
          spec:
            template:
              spec:
                containers:
                  - name: pac-controller
                    env:
                      - name: OTEL_EXPORTER_OTLP_ENDPOINT
                        value: "http://open-telemetry-opentelemetry-collector.konflux-otel.svc.cluster.local:4317"
                      - name: OTEL_TRACES_SAMPLER
                        value: "parentbased_always_on"
                    resources:
                      limits:
                        cpu: 500m
                        memory: 2560Mi
                      requests:
                        cpu: 500m
                        memory: 2560Mi
        pipelines-as-code-watcher:
          spec:
            template:
              spec:
                containers:
                  - name: pac-watcher
                    env:
                      - name: OTEL_EXPORTER_OTLP_ENDPOINT
                        value: "http://open-telemetry-opentelemetry-collector.konflux-otel.svc.cluster.local:4317"
                      - name: OTEL_TRACES_SAMPLER
                        value: "parentbased_always_on"
                    resources:
                      limits:
                        cpu: 250m
                        memory: 1Gi
                      requests:
                        cpu: 250m
                        memory: 1Gi
        pipelines-as-code-webhook:
          spec:
            template:
              spec:
                containers:
                  - name: pac-webhook
                    resources:
                      limits:
                        cpu: 400m
                        memory: 100Mi
                      requests:
                        cpu: 400m
                        memory: 100Mi
        pipelines-console-plugin:
          spec:
            template:
              spec:
                containers:
                  - name: pipelines-console-plugin
                    resources:
                      limits:
                        cpu: 200m
                        memory: 8Mi
                      requests:
                        cpu: 200m
                        memory: 8Mi
        tekton-chains-controller:
          spec:
            template:
              spec:
                containers:
                  - name: tekton-chains-controller
                    resources:
                      limits:
                        cpu: 1500m
                        memory: 8Gi
                      requests:
                        cpu: 1500m
                        memory: 8Gi
        tekton-events-controller:
          spec:
            replicas: 0
        tekton-triggers-controller:
          spec:
            template:
              spec:
                containers:
                  - name: tekton-triggers-controller
                    resources:
                      limits:
                        cpu: 400m
                        memory: 64Mi
                      requests:
                        cpu: 400m
                        memory: 64Mi
        tekton-triggers-webhook:
          spec:
            template:
              spec:
                containers:
                  - name: webhook
                    resources:
                      limits:
                        cpu: 250m
                        memory: 50Mi
                      requests:
                        cpu: 250m
                        memory: 50Mi
        tekton-triggers-core-interceptors:
          spec:
            template:
              spec:
                containers:
                  - name: tekton-triggers-core-interceptors
                    resources:
                      limits:
                        cpu: 500m
                        memory: 1Gi
                      requests:
                        cpu: 500m
                        memory: 1Gi
        tkn-cli-serve:
          spec:
            replicas: 0
            template:
              spec:
                containers:
                  - name: tkn-cli-serve
                    resources:
                      limits:
                        cpu: 250m
                        memory: 64Mi
                      requests:
                        cpu: 250m
                        memory: 64Mi
      statefulSets:
        tekton-pipelines-remote-resolvers:
          spec:
            replicas: 4
            template:
              spec:
                containers:
                  - name: controller
                    env:
                      - name: GIT_SSL_CAINFO
                        value: /tekton-custom-certs/ca-bundle.crt
                    resources:
                      limits:
                        memory: 10Gi
                      requests:
                        cpu: "500m"
                        memory: 10Gi
        tekton-pipelines-controller:
          spec:
            template:
              spec:
                containers:
                  - name: tekton-pipelines-controller
                    resources:
                      requests:
                        memory: 16Gi
                        cpu: "1"
                      limits:
                        memory: 16Gi
                topologySpreadConstraints:
                  - maxSkew: 1
                    topologyKey: topology.kubernetes.io/zone
                    whenUnsatisfiable: DoNotSchedule
                    labelSelector:
                      matchLabels:
                        app: tekton-pipelines-controller
      disabled: false
      horizontalPodAutoscalers:
        tekton-operator-proxy-webhook:
          spec:
            maxReplicas: 6
            metrics:
              - resource:
                  name: cpu
                  target:
                    averageUtilization: 100
                    type: Utilization
                type: Resource
              - resource:
                  name: memory
                  target:
                    averageUtilization: 100
                    type: Utilization
                type: Resource
            minReplicas: 2
        tekton-pipelines-webhook:
          spec:
            maxReplicas: 6
            metrics:
              - resource:
                  name: cpu
                  target:
                    averageUtilization: 100
                    type: Utilization
                type: Resource
              - resource:
                  name: memory
                  target:
                    averageUtilization: 100
                    type: Utilization
                type: Resource
            minReplicas: 6
    performance:
      buckets: 4
      disable-ha: false
      kube-api-burst: 50
      kube-api-qps: 50
      replicas: 4
      threads-per-controller: 32
      statefulset-ordinals: true
  platforms:
    openshift:
      pipelinesAsCode:
        enable: true
        options:
          deployments:
            pipelines-as-code-watcher:
              spec:
                replicas: 2
            pipelines-as-code-webhook:
              spec:
                replicas: 2
        settings:
          application-name: Konflux Staging
          custom-console-name: Konflux Staging
          custom-console-url: https://konflux-ui.apps.stone-stg-rh01.l2vh.p1.openshiftapps.com/
          custom-console-url-namespace: https://konflux-ui.apps.stone-stg-rh01.l2vh.p1.openshiftapps.com/ns/{{ namespace }}
          custom-console-url-pr-details: https://konflux-ui.apps.stone-stg-rh01.l2vh.p1.openshiftapps.com/ns/{{
            namespace }}/pipelinerun/{{ pr }}
          custom-console-url-pr-tasklog: https://konflux-ui.apps.stone-stg-rh01.l2vh.p1.openshiftapps.com/ns/{{
            namespace }}/pipelinerun/{{ pr }}/logs/{{ task }}
          remember-ok-to-test: "false"
          secret-github-app-token-scoped: "false"
          enable-cancel-in-progress-on-pull-requests: "true"
          tracing-label-action: pipelines.appstudio.openshift.io/type
          tracing-label-application: appstudio.openshift.io/application
          tracing-label-component: appstudio.openshift.io/component
  profile: all
  pruner:
    disabled: true
  result:
    disabled: false
    is_external_db: true
    db_secret_name: tekton-results-database
    db_secret_user_key: db.user
    db_secret_password_key: db.password
    db_port: 5432
    db_sslmode: verify-full
    db_sslrootcert: /etc/tls/db/tekton-results-db-ca.pem
    db_enable_auto_migration: true
    options:
      deployments:
        tekton-results-api:
          spec:
            template:
              spec:
                volumes:
                  - name: db-tls-ca
                    configMap:
                      name: rds-root-crt
                containers:
                  - name: api
                    env:
                      - name: LOGS_API
                        value: "true"
                      - name: LOGS_TYPE
                        value: blob
                      - name: S3_HOSTNAME_IMMUTABLE
                        value: "true"
                      - name: AWS_ACCESS_KEY_ID
                        valueFrom:
                          secretKeyRef:
                            name: tekton-results-s3
                            key: aws_access_key_id
                      - name: AWS_SECRET_ACCESS_KEY
                        valueFrom:
                          secretKeyRef:
                            name: tekton-results-s3
                            key: aws_secret_access_key
                      - name: AWS_REGION
                        valueFrom:
                          secretKeyRef:
                            name: tekton-results-s3
                            key: aws_region
                      - name: S3_BUCKET_NAME
                        valueFrom:
                          secretKeyRef:
                            name: tekton-results-s3
                            key: bucket
                      - name: AWS_ENDPOINT_URL
                        valueFrom:
                          secretKeyRef:
                            name: tekton-results-s3
                            key: endpoint
                      - name: LOGGING_PLUGIN_API_URL
                        valueFrom:
                          secretKeyRef:
                            name: tekton-results-s3
                            key: s3_url
                      - name: DB_HOST
                        valueFrom:
                          secretKeyRef:
                            name: tekton-results-database
                            key: db.host
                      - name: DB_NAME
                        valueFrom:
                          secretKeyRef:
                            name: tekton-results-database
                            key: db.name
                    volumeMounts:
                      - mountPath: /etc/tls/db
                        name: db-tls-ca
                        readOnly: true
                    resources:
                      limits:
                        cpu: 3000m
                        memory: 1Gi
                      requests:
                        cpu: 1000m
                        memory: 500Mi
        tekton-results-watcher:
          spec:
            template:
              spec:
                containers:
                  - name: watcher
                    args:
                      - -check_owner=false
                      - -completed_run_grace_period=5m
                      - -requeue_interval=2m
                      - -store_deadline=30m
                      - -forward_buffer=1m
                      - -qps=50
                      - -burst=50
                      - -threadiness=32
                      - -logs_api=true
                      - -disable_storing_incomplete_runs=true
                    resources:
                      limits:
                        cpu: 3000m
                        memory: 8Gi
                      requests:
                        cpu: 1000m
                        memory: 8Gi
        tekton-results-retention-policy-agent:
          spec:
            replicas: 0
  targetNamespace: openshift-pipelines
  tektonpruner:
    disabled: true
  trigger:
    options:
      configMaps:
        config-logging-triggers:
          data:
            loglevel.controller: info
            loglevel.eventlistener: info
            loglevel.webhook: info
            zap-logger-config: |
              {
                "level": "info",
                "development": false,
                "sampling": {
                  "initial": 100,
                  "thereafter": 100
                },
                "outputPaths": ["stdout"],
                "errorOutputPaths": ["stderr"],
                "encoding": "json",
                "encoderConfig": {
                  "timeKey": "ts",
                  "levelKey": "level",
                  "nameKey": "logger",
                  "callerKey": "caller",
                  "messageKey": "msg",
                  "stacktraceKey": "stacktrace",
                  "lineEnding": "",
                  "levelEncoder": "",
                  "timeEncoder": "iso8601",
                  "durationEncoder": "string",
                  "callerEncoder": ""
                }
              }
