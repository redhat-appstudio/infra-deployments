apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - path: tekton-chains-public-key-path.yaml
    target:
      name: tekton-chains-public-key
      group: external-secrets.io
      version: v1
      kind: ExternalSecret
  - path: tekton-chains-signing-secret-path.yaml
    target:
      name: tekton-chains-signing-secret
      group: external-secrets.io
      version: v1
      kind: ExternalSecret
  - path: pipelines-as-code-secret-path.yaml
    target:
      name: pipelines-as-code-secret
      group: external-secrets.io
      version: v1
      kind: ExternalSecret
  - path: update-tekton-config-pac.yaml
    target:
      kind: TektonConfig
      name: config
  - path: update-pipeline-metrics-exporter-resources.yaml
    target:
      kind: Deployment
      name: pipeline-metrics-exporter
  # tekton-results is not deployed on this cluster — delete all its resources
  - path: delete-tekton-results-namespace.yaml
    target:
      name: tekton-results
      kind: Namespace
  - path: delete-tekton-results-namespaced.yaml
    target:
      namespace: tekton-results
  - path: delete-tekton-results-cluster-rbac.yaml
    target:
      name: "(tekton-results|prometheus-tekton-results).*"
      kind: "Cluster(Role|RoleBinding)"
  - path: delete-tekton-results-test-resources.yaml
    target:
      namespace: plnsvc-tests
      name: "(tekton-results-tests|pipeline-service-admin)"
  - path: delete-tekton-results-external-secrets.yaml
    target:
      name: "tekton-results-.*"
      group: external-secrets.io
      kind: ExternalSecret
