apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base/multikueue
  - cluster-queue.yaml
  - multikueue
  - multikueue-spokes-admission-check.yaml
  - kueue-tekton-permissions-cr.yaml
  - kueue-tekton-permissions-binding-crb.yaml

patches:
  - path: patches/cluster-spoke-pipeline-queue-patch.yaml
    target:
      kind: ClusterQueue
      name: cluster-spoke-pipeline-queue
