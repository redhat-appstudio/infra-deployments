# The spoke kubeconfig uses the Terraform-managed multikueue-sa. The syncer
# updates existing PaC Git secrets on a spoke.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: multikueue-syncer-service-secret-update
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: multikueue-syncer-service-secret-update
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: multikueue-syncer-service-secret-update
subjects:
- kind: ServiceAccount
  name: multikueue-sa
  namespace: konflux-multikueue-access
