apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../catalog-source
- ../base-snapshot
- cluster-spoke-pipeline-queue.yaml

# Pipelines Operator deploys Tekton Kueue in openshift-pipelines. Keep the
# snapshot's monitoring and RBAC, but point them at that namespace.
patches:
- target:
    kind: Kueue
    name: cluster
    namespace: openshift-kueue-operator
  patch: |-
    - op: add
      path: /spec/config/multiKueue
      value:
        externalFrameworks:
          - group: tekton.dev
            version: v1
            resource: pipelineruns
- target:
    namespace: tekton-kueue
  patch: |-
    - op: replace
      path: /metadata/namespace
      value: openshift-pipelines
- target:
    kind: ClusterRoleBinding
    name: prometheus-tekton-kueue-metrics-reader
  patch: |-
    - op: replace
      path: /subjects/0/namespace
      value: openshift-pipelines
- target:
    kind: ServiceMonitor
    name: tekton-kueue-controller
  patch: |-
    - op: replace
      path: /spec/endpoints/0/tlsConfig/serverName
      value: tekton-kueue-controller-manager-metrics-service.openshift-pipelines.svc.cluster.local
- target:
    kind: ServiceMonitor
    name: tekton-kueue-webhook
  patch: |-
    - op: replace
      path: /spec/endpoints/0/tlsConfig/serverName
      value: tekton-kueue-webhook-service.openshift-pipelines.svc.cluster.local
- target:
    kind: PrometheusRule
    name: kueue-alerts
  path: patches/prometheus-rule-patch.yaml
