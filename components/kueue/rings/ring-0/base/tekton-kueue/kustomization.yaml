apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- https://github.com/openshift-pipelines/tekton-kueue/upstream/config/default?ref=aac7bde9d3eb519b61ee48adfacf022b66f8000c97cff1a7b89178a5da67ed0e
namespace: tekton-kueue
# ensure that installation starts after the installation of kueue complete
commonAnnotations:
  argocd.argoproj.io/sync-wave: "10"
  argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
images:
- name: ghcr.io/tektoncd/tekton-kueue
  newName: quay.io/openshift-pipeline/pipelines-scheduler-rhel9
  newTag: aac7bde9d3eb519b61ee48adfacf022b66f8000c97cff1a7b89178a5da67ed0e
configMapGenerator:
- name: tekton-kueue-config
  namespace: tekton-kueue
  behavior: replace
  files:
  - config.yaml
generatorOptions:
  disableNameSuffixHash: true
patches:
- target:
    kind: Deployment
    name: tekton-kueue-controller-manager
    group: apps
  patch: |
    - op: replace
      path: /spec/replicas
      value: 1
- target:
    kind: Deployment
    name: tekton-kueue-webhook
    group: apps
  patch: |
    - op: replace
      path: /spec/replicas
      value: 1
- target:
    kind: Namespace
    name: tekton-kueue
  patch: |-
    - op: add
      path: /metadata/labels/openshift.io~1cluster-monitoring
      value: "true"
