apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kanary-cronjob-runner
rules:
  - apiGroups: ["tekton.dev"]
    resources: ["pipelineruns"]
    verbs: ["create", "get", "list", "watch"]
  - apiGroups: ["tekton.dev"]
    resources: ["pipelines"]
    verbs: ["get"]
  - apiGroups: ["tekton.dev"]
    resources: ["taskruns"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kanary-cronjob-runner
subjects:
  - kind: ServiceAccount
    name: kanary-cronjob
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kanary-cronjob-runner
