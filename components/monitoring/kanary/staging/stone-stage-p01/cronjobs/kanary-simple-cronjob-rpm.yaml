apiVersion: batch/v1
kind: CronJob
metadata:
  name: kanary-simple-trigger-rpm
spec:
  schedule: "5,35 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 1800
      template:
        spec:
          serviceAccountName: kanary-cronjob
          restartPolicy: Never
          containers:
            - name: trigger
              image: quay.io/openshift-pipeline/openshift-pipelines-cli-tkn:1.15
              securityContext:
                readOnlyRootFilesystem: true
                runAsNonRoot: true
              resources:
                requests:
                  cpu: 100m
                  memory: 10Mi
                limits:
                  cpu: 100m
                  memory: 100Mi
              command:
                - /bin/bash
                - -c
                - |
                  tkn pipeline start kanary-run-simple --use-param-defaults --workspace name=artifacts,volumeClaimTemplateFile=/etc/kanary/vct.yaml \
                    --param tested-cluster=stone-stage-p01 \
                    --param test-type=rpm \
                    --param member-cluster=https://api.stone-stage-p01.hpmt.p1.openshiftapps.com:6443 \
                    --param tenant-namespace=konflux-perfscale-3-tenant \
                    --param application-name=myapp \
                    --param component-name=mycomp \
                    --param integration-test-scenario=myits \
                    --param gitlab-api-url=https://gitlab.cee.redhat.com/api/v4 \
                    --param s3-bucket=konflux-perfscale-artifacts \
                    --prefix-name kanary-simple-stone-stage-p01-rpm- \
                    --showlog
              volumeMounts:
                - name: workspace-vct
                  mountPath: /etc/kanary
                  readOnly: true
          volumes:
            - name: workspace-vct
              configMap:
                name: kanary-workspace-vct
