apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tempo-restricted-traffic
  labels:
    app.kubernetes.io/name: tempo
    app.kubernetes.io/part-of: tempo
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Gossip ring, inter-component gRPC, memcached and MinIO all stay in-namespace.
    - from:
        - podSelector: {}
    # The gateway Service maps port 80 to this container port.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: appstudio-grafana
      ports:
        - protocol: TCP
          port: 8080
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: konflux-otel
      ports:
        - protocol: TCP
          port: 4317
  egress:
    - to:
        - podSelector: {}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 5353
        - protocol: TCP
          port: 5353
