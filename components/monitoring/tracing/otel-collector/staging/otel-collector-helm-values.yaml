config:
  exporters:
    otlphttp/splunk:
      traces_endpoint: "https://ingest.us1.signalfx.com/v2/trace/otlp"
      headers:
        "X-SF-Token": "${env:SIGNALFX_API_TOKEN}"
    signalfx:
      endpoint: "https://api.signalfx.com/v2/traces"
      realm: "us1"
      api_url: "https://api.us1.signalfx.com"
      access_token: ${env:SIGNALFX_API_TOKEN}
    prometheus:
      endpoint: 0.0.0.0:8889
      metric_expiration: 45m
  extensions:
    # The health_check extension is mandatory for this chart.
    # Without the health_check extension the collector will fail the readiness and liveliness probes.
    # The health_check extension can be modified, but should never be removed.
    health_check: {}
  processors:
    attributes/stage:
      actions:
        - key: deployment.environment
          value: stage
          action: insert
    batch: {}
    # If set to null, will be overridden with values based on k8s resource limits
    memory_limiter:
      check_interval: 2s
      limit_mib: 512
      limit_percentage: 95
      spike_limit_percentage: 90
    attributes/collector-info:
      actions:
        - key: collector.hostname
          action: insert
          value: ${env:HOSTNAME}
        - key: collector.clustername
          action: insert
          value: staging
    filter/mttb:
      error_mode: ignore
      traces:
        span:
          - resource.attributes["service.name"] == nil
          - not(IsMatch(resource.attributes["service.name"], "^(pipelines-as-code|integration-service|release-service)$"))
  connectors:
    spanmetrics/mttb:
      metrics_expiration: 1h
      histogram:
        unit: s
        explicit:
          buckets: [30s, 1m, 2m, 5m, 10m, 20m, 40m, 1h, 2h, 4h, 8h]
      dimensions:
        - name: namespace
        - name: cicd.pipeline.action.name
        - name: cicd.pipeline.result
        - name: delivery.tekton.dev.application
          default: unknown
      exemplars:
        enabled: true
      metrics_flush_interval: 30s
      resource_metrics_key_attributes:
        - service.name
  receivers:
    jaeger: null
    prometheus: null
    zipkin: null
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
          max_recv_msg_size_mib: 999999999
        http:
          endpoint: 0.0.0.0:4318
  service:
    extensions:
      - health_check
    pipelines:
      traces:
        exporters:
          - debug
          - otlphttp/splunk
          - signalfx
        processors:
          - memory_limiter
          - attributes/collector-info
          - batch
          - attributes/stage
        receivers:
          - otlp
      traces/stage-mttb:
        receivers:
          - otlp
        processors:
          - memory_limiter
          - filter/mttb
          - batch
        exporters:
          - spanmetrics/mttb
      metrics:
        receivers:
        - otlp
        - spanmetrics/mttb
        processors:
        - memory_limiter
        - batch
        exporters:
        - prometheus
        - signalfx
    telemetry:
      metrics:
        address: null
        level: basic
        readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888

# Configuration for ports
ports:
  otlp:
    enabled: true
    containerPort: 4317
    servicePort: 4317
    hostPort: 4317
    protocol: TCP
  otlp-http:
    enabled: true
    containerPort: 4318
    servicePort: 4318
    hostPort: 4318
    protocol: TCP
  prometheus:
    enabled: true
    containerPort: 8889
    servicePort: 8889
    protocol: TCP
  jaeger-compact:
    enabled: false
  jaeger-thrift:
    enabled: false
  jaeger-grpc:
    enabled: false
  zipkin:
    enabled: false
extraEnvs:
  - name: SIGNALFX_API_TOKEN
    valueFrom:
      secretKeyRef:
        name: "signalfx-api-key"
        key: konflux-tracing-stage
image:
  repository: quay.io/konflux-ci/opentelemetry-collector-k8s
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: "0.156.0"
# OpenTelemetry Collector executable
command:
  # The operator prepends '/' to the command name...no idea why.
  name: usr/local/bin/otel-collector-sp
  extraArgs: []
