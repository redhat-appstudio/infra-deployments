apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
  - openshift-logging-ns.yaml
  - minio.yaml

patches:
  - path: ./patches/subscription-dev-channel-patch.yaml
    target:
      group: operators.coreos.com
      version: v1alpha1
      kind: Subscription
      name: loki-operator

  - path: ./patches/lokistack-dev-patch.yaml
    target:
      group: loki.grafana.com
      version: v1
      kind: LokiStack
      name: logging-loki
