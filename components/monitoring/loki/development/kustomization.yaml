apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
  - cluster-logging-operator.yaml
  - log-collector-rbac.yaml
  - cluster-log-forwarder.yaml
patches:
  - path: ./patches/lokistack-dev-patch.yaml
    target:
      group: loki.grafana.com
      version: v1
      kind: LokiStack
      name: logging-loki
