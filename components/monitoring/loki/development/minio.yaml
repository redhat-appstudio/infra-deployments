---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: openshift-logging
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  selector:
    app: minio
  ports:
    - name: api
      port: 9000
      targetPort: api
    - name: console
      port: 9001
      targetPort: console
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: openshift-logging
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app: minio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: minio
          image: quay.io/kubearchive/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
          args:
            - server
            - /data
            - --console-address
            - ":9001"
          ports:
            - name: api
              containerPort: 9000
            - name: console
              containerPort: 9001
          env:
            # MinIO looks for ${HOME}/.minio at startup; the root filesystem is
            # read-only, so point HOME at the writable tmp volume.
            - name: HOME
              value: /tmp
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: logging-loki-s3
                  key: access_key_id
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: logging-loki-s3
                  key: access_key_secret
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: api
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: api
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
      volumes:
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-create-bucket
  namespace: openshift-logging
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  backoffLimit: 5
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app: minio-create-bucket
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: create-bucket
          image: quay.io/kubearchive/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
          command:
            - /bin/sh
            - -c
            - |
              set -e
              MC="mc --config-dir /tmp"
              echo "Waiting for MinIO to become ready..."
              for i in $(seq 1 30); do
                if $MC alias set local "$S3_ENDPOINT" "$S3_ACCESS_KEY_ID" "$S3_SECRET" >/dev/null 2>&1; then
                  echo "MinIO is ready."
                  break
                fi
                if [ "$i" -eq 30 ]; then
                  echo "MinIO did not become ready in time." >&2
                  exit 1
                fi
                echo "MinIO not ready yet (attempt $i/30), retrying in 5s..."
                sleep 5
              done
              $MC mb --ignore-existing "local/$S3_BUCKET"
              echo "Bucket $S3_BUCKET ready."
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          env:
            - name: S3_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: logging-loki-s3
                  key: endpoint
            - name: S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: logging-loki-s3
                  key: bucketnames
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: logging-loki-s3
                  key: access_key_id
            - name: S3_SECRET
              valueFrom:
                secretKeyRef:
                  name: logging-loki-s3
                  key: access_key_secret
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
      volumes:
        - name: tmp
          emptyDir: {}
