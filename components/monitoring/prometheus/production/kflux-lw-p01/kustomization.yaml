apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../base
- ../tekton-ms
- cluster-monitoring-config.yaml
- o11y-admins-group.yaml
patches:
  - path: cluster-id-label.yaml
    target:
      name: appstudio-federate-ms
      kind: MonitoringStack
      group: monitoring.rhobs
      version: v1alpha1
  - path: writeRelabelConfigs.yaml
    target:
      name: appstudio-federate-ms
      kind: MonitoringStack
      group: monitoring.rhobs
      version: v1alpha1
  - path: cluster-id-label.yaml
    target:
      name: appstudio-tekton-ms
      kind: MonitoringStack
      group: monitoring.rhobs
      version: v1alpha1
  # ROKS uses IBM Cloud block storage; the shared tekton-ms overlay defaults
  # to AWS gp3, which does not exist on this cluster (PVO11Y-5538).
  - path: storage-class-patch.yaml
    target:
      name: appstudio-tekton-ms
      kind: MonitoringStack
      group: monitoring.rhobs
      version: v1alpha1
  - path: ibm-o11y-admins-subject-patch.yaml
    target:
      name: all-access-appstudio-monitoring
      kind: RoleBinding
      group: rbac.authorization.k8s.io
      version: v1
  - path: ibm-o11y-admins-subject-patch.yaml
    target:
      name: o11y-admins-openshift-monitoring-debug
      kind: RoleBinding
      group: rbac.authorization.k8s.io
      version: v1
  - path: ibm-o11y-admins-subject-patch.yaml
    target:
      name: o11y-debug-access-user-workload-monitoring
      kind: RoleBinding
      group: rbac.authorization.k8s.io
      version: v1
  - path: ibm-o11y-admins-subject-patch.yaml
    target:
      name: o11y-admins-cluster-view
      kind: ClusterRoleBinding
      group: rbac.authorization.k8s.io
      version: v1
