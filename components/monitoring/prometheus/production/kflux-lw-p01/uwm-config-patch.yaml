apiVersion: v1
kind: ConfigMap
metadata:
  name: user-workload-monitoring-config
  namespace: openshift-user-workload-monitoring
data:
  config.yaml: |
    prometheus:
      retention: 7d
      retentionSize: 110GiB
      volumeClaimTemplate:
        spec:
          storageClassName: ibmc-vpc-block-metro-retain-10iops-tier
          resources:
            requests:
              storage: 120Gi
      resources:
        requests:
          cpu: 100m
          memory: 1Gi
