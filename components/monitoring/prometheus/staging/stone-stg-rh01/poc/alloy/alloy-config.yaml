apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-poc-config
  labels:
    app.kubernetes.io/name: alloy
    app.kubernetes.io/part-of: alloy-poc
data:
  config.alloy: |
    prometheus.remote_write "mimir" {
      endpoint {
        name    = "mimir-poc"
        url     = "http://mimir-poc-distributor.appstudio-mimir-poc.svc:8080/api/v1/push"
        headers = { "X-Scope-OrgID" = "konflux-poc" }

        queue_config {
          retry_on_http_429 = true
        }
      }

      wal {
        truncate_frequency = "5m"
        min_keepalive_time = "5m"
        max_keepalive_time = "15m"
      }
    }

    prometheus.relabel "vmalert_recording_allow" {
      forward_to = [prometheus.remote_write.mimir.receiver]

      rule {
        source_labels = ["__name__", "recording_engine"]
        regex         = "konflux_poc:cluster_pod_cpu_usage_cores:sum_rate5m;vmalert-poc"
        action        = "keep"
      }
    }

    prometheus.receive_http "vmalert" {
      http {
        listen_address = "0.0.0.0"
        listen_port    = 9999
      }

      forward_to = [prometheus.relabel.vmalert_recording_allow.receiver]
    }

    prometheus.relabel "platform_normalize" {
      forward_to = [prometheus.remote_write.mimir.receiver]

      rule {
        regex  = "prometheus|prometheus_replica"
        action = "labeldrop"
      }

      rule {
        target_label = "source_cluster"
        replacement  = "stone-stg-rh01-mimir-poc"
        action       = "replace"
      }

      rule {
        target_label = "source_environment"
        replacement  = "staging-poc"
        action       = "replace"
      }

      rule {
        target_label = "source_pipeline"
        replacement  = "alloy-mimir-poc"
        action       = "replace"
      }

      rule {
        target_label = "source_prometheus"
        replacement  = "platform"
        action       = "replace"
      }
    }

    prometheus.relabel "user_workload_normalize" {
      forward_to = [prometheus.remote_write.mimir.receiver]

      rule {
        regex  = "prometheus|prometheus_replica"
        action = "labeldrop"
      }

      rule {
        target_label = "source_cluster"
        replacement  = "stone-stg-rh01-mimir-poc"
        action       = "replace"
      }

      rule {
        target_label = "source_environment"
        replacement  = "staging-poc"
        action       = "replace"
      }

      rule {
        target_label = "source_pipeline"
        replacement  = "alloy-mimir-poc"
        action       = "replace"
      }

      rule {
        target_label = "source_prometheus"
        replacement  = "user-workload"
        action       = "replace"
      }
    }

    prometheus.relabel "tekton_normalize" {
      forward_to = [prometheus.remote_write.mimir.receiver]

      rule {
        regex  = "prometheus|prometheus_replica"
        action = "labeldrop"
      }

      rule {
        target_label = "source_cluster"
        replacement  = "stone-stg-rh01-mimir-poc"
        action       = "replace"
      }

      rule {
        target_label = "source_environment"
        replacement  = "staging-poc"
        action       = "replace"
      }

      rule {
        target_label = "source_pipeline"
        replacement  = "alloy-mimir-poc"
        action       = "replace"
      }

      rule {
        target_label = "source_prometheus"
        replacement  = "tekton"
        action       = "replace"
      }
    }

    prometheus.scrape "platform" {
      targets = [{
        "__address__" = "prometheus-k8s.openshift-monitoring.svc:9091",
      }]
      metrics_path      = "/federate"
      scheme            = "https"
      params            = { "match[]" = ["{__name__=~\".+\"}"] }
      bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
      honor_labels      = true
      honor_timestamps  = false
      scrape_interval   = "60s"
      scrape_timeout    = "55s"
      forward_to        = [prometheus.relabel.platform_normalize.receiver]

      tls_config {
        ca_file     = "/etc/pki/service-ca/service-ca.crt"
        server_name = "prometheus-k8s.openshift-monitoring.svc"
      }

      clustering {
        enabled = true
      }
    }

    prometheus.scrape "user_workload" {
      targets = [{
        "__address__" = "prometheus-user-workload.openshift-user-workload-monitoring.svc:9092",
      }]
      metrics_path      = "/federate"
      scheme            = "https"
      params            = { "match[]" = ["{__name__=~\".+\"}"] }
      bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
      honor_labels      = true
      honor_timestamps  = false
      scrape_interval   = "60s"
      scrape_timeout    = "55s"
      forward_to        = [prometheus.relabel.user_workload_normalize.receiver]

      tls_config {
        ca_file     = "/etc/pki/service-ca/service-ca.crt"
        server_name = "prometheus-user-workload.openshift-user-workload-monitoring.svc"
      }

      clustering {
        enabled = true
      }
    }

    prometheus.scrape "tekton" {
      targets = [{
        "__address__" = "tekton-ms-kube-rbac-proxy.appstudio-tekton.svc:9091",
      }]
      metrics_path      = "/federate"
      scheme            = "https"
      params            = { "match[]" = ["{__name__=~\".+\"}"] }
      bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
      honor_labels      = true
      honor_timestamps  = false
      scrape_interval   = "60s"
      scrape_timeout    = "55s"
      forward_to        = [prometheus.relabel.tekton_normalize.receiver]

      tls_config {
        ca_file     = "/etc/pki/service-ca/service-ca.crt"
        server_name = "tekton-ms-kube-rbac-proxy.appstudio-tekton.svc"
      }

      clustering {
        enabled = true
      }
    }
