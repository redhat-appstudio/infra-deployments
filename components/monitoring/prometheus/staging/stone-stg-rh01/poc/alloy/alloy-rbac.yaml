apiVersion: v1
kind: ServiceAccount
metadata:
  name: alloy-poc
  labels:
    app.kubernetes.io/name: alloy
    app.kubernetes.io/part-of: alloy-poc
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: alloy-poc-cluster-monitoring-view
  labels:
    app.kubernetes.io/name: alloy
    app.kubernetes.io/part-of: alloy-poc
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-monitoring-view
subjects:
- kind: ServiceAccount
  name: alloy-poc
  namespace: appstudio-alloy-poc
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: alloy-poc-maintainers
subjects:
- apiGroup: rbac.authorization.k8s.io
  kind: Group
  name: konflux-o11y
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: component-maintainer
