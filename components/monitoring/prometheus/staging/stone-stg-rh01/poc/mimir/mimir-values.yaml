fullnameOverride: mimir-poc

configStorageType: ConfigMap

image:
  tag: 3.2.0

rbac:
  create: false
  type: scc
  podSecurityContext:
    fsGroup: null
    runAsGroup: null
    runAsUser: null

kafka:
  enabled: false

minio:
  enabled: false

rollout_operator:
  enabled: false
  podSecurityContext:
    fsGroup: null
    runAsGroup: null
    runAsUser: null

gateway:
  enabled: false

alertmanager:
  enabled: false

chunks-cache:
  enabled: false

index-cache:
  enabled: false

metadata-cache:
  enabled: false

results-cache:
  enabled: false

metaMonitoring:
  serviceMonitor:
    enabled: false
  prometheusRule:
    enabled: false
  grafanaAgent:
    enabled: false

mimir:
  structuredConfig:
    usage_stats:
      enabled: false
    multitenancy_enabled: true
    common:
      storage:
        backend: s3
        s3:
          endpoint: mimir-poc-seaweedfs:8333
          region: us-east-1
          insecure: true
    ingest_storage:
      enabled: false
    ingester:
      push_grpc_method_enabled: true
      ring:
        replication_factor: 1
        zone_awareness_enabled: false
    blocks_storage:
      backend: s3
      s3:
        bucket_name: mimir-tsdb
      tsdb:
        retention_period: 13h
        ship_interval: 1m
    compactor:
      block_ranges:
      - 2h
      - 12h
      - 24h
    limits:
      compactor_blocks_retention_period: 168h
      ingestion_rate: 120000
      ingestion_burst_size: 6000000
      max_global_series_per_user: 7500000
      ruler_alerting_rules_evaluation_enabled: false
    memberlist:
      rejoin_interval: 1m
    store_gateway:
      sharding_ring:
        replication_factor: 1
        zone_awareness_enabled: false

ingester:
  replicas: 3
  zoneAwareReplication:
    enabled: false
  resources:
    requests:
      cpu: "3"
      memory: 8Gi
    limits:
      memory: 16Gi
  persistentVolume:
    enabled: true
    storageClass: gp3
    size: 25Gi
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          topologyKey: kubernetes.io/hostname
          labelSelector:
            matchExpressions:
            - key: app.kubernetes.io/component
              operator: In
              values:
              - ingester

distributor:
  replicas: 2
  annotations:
    ignore-check.kube-linter.io/no-anti-affinity: Using topologySpreadConstraints.
  resources:
    requests:
      cpu: "1"
      memory: 1Gi
    limits:
      memory: 2Gi

querier:
  replicas: 2
  annotations:
    ignore-check.kube-linter.io/no-anti-affinity: Using topologySpreadConstraints.
  resources:
    requests:
      cpu: "1"
      memory: 2Gi
    limits:
      memory: 4Gi

query_frontend:
  replicas: 2
  annotations:
    ignore-check.kube-linter.io/no-anti-affinity: Using topologySpreadConstraints.
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 1Gi

query_scheduler:
  replicas: 2
  annotations:
    ignore-check.kube-linter.io/no-anti-affinity: Using topologySpreadConstraints.
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 1Gi

ruler:
  enabled: false

compactor:
  resources:
    requests:
      cpu: "1"
      memory: 4Gi
    limits:
      memory: 8Gi
  persistentVolume:
    enabled: true
    storageClass: gp3
    size: 50Gi

store_gateway:
  replicas: 1
  zoneAwareReplication:
    enabled: false
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      memory: 4Gi
  persistentVolume:
    enabled: false
    emptyDir:
      sizeLimit: 10Gi

overrides_exporter:
  enabled: false
