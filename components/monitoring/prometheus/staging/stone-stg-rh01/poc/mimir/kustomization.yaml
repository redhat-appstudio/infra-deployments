apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: appstudio-mimir-poc

resources:
- namespace.yaml
- mimir-rbac.yaml
- vmalert.yaml
- vmalert-rules.yaml
- mimir-networkpolicy.yaml
- seaweedfs.yaml

generators:
- mimir-helm-generator.yaml

patches:
- target:
    labelSelector: release=mimir-poc
  patch: |-
    - op: add
      path: /metadata/namespace
      value: appstudio-mimir-poc
- target:
    kind: PodDisruptionBudget
  patch: |-
    - op: add
      path: /spec/unhealthyPodEvictionPolicy
      value: AlwaysAllow
