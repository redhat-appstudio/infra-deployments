apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: mimir-poc-s3-password
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  length: 48
  digits: 12
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mimir-poc-s3
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshPolicy: CreatedOnce
  target:
    name: mimir-poc-s3
    # Keep the credential stable across ExternalSecret recreation and resyncs.
    creationPolicy: Orphan
    immutable: true
    template:
      engineVersion: v2
      type: Opaque
      data:
        AWS_ACCESS_KEY_ID: mimir-poc
        AWS_SECRET_ACCESS_KEY: '{{ .password }}'
  dataFrom:
  - sourceRef:
      generatorRef:
        apiVersion: generators.external-secrets.io/v1alpha1
        kind: Password
        name: mimir-poc-s3-password
