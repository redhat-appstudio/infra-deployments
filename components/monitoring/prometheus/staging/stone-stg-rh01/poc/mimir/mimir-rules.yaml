apiVersion: v1
kind: ConfigMap
metadata:
  name: mimir-poc-rules
  labels:
    app.kubernetes.io/name: mimir
    app.kubernetes.io/part-of: mimir-poc
data:
  pod-cpu.yaml: |
    groups:
    - name: mimir-poc-recording-rules
      interval: 1m
      rules:
      - record: cluster:pod_cpu_usage_cores:sum_rate5m
        expr: sum by (source_cluster, source_environment) (rate(container_cpu_usage_seconds_total{source_prometheus="platform",container!="",pod!=""}[5m]))
