# The CMO client certificate and kubelet CA live in openshift-monitoring.
# Only this sync service account may read and mirror them into the PoC namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vm-poc-scrape-credential-sync
  namespace: appstudio-vm-poc
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vm-poc-scrape-credential-source
  namespace: openshift-monitoring
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [metrics-client-certs]
    verbs: [get]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [kubelet-serving-ca-bundle]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vm-poc-scrape-credential-source
  namespace: openshift-monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: vm-poc-scrape-credential-source
subjects:
  - kind: ServiceAccount
    name: vm-poc-scrape-credential-sync
    namespace: appstudio-vm-poc
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vm-poc-scrape-credential-target
  namespace: appstudio-vm-poc
rules:
  - apiGroups: [""]
    resources: [secrets, configmaps]
    verbs: [create]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [vm-poc-metrics-client-certs]
    verbs: [get, patch]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [vm-poc-kubelet-serving-ca-bundle]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vm-poc-scrape-credential-target
  namespace: appstudio-vm-poc
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: vm-poc-scrape-credential-target
subjects:
  - kind: ServiceAccount
    name: vm-poc-scrape-credential-sync
    namespace: appstudio-vm-poc
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: vm-poc-scrape-credential-sync
  namespace: appstudio-vm-poc
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  schedule: "* * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 50
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: vm-poc-scrape-credential-sync
        spec:
          serviceAccountName: vm-poc-scrape-credential-sync
          restartPolicy: Never
          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: 16Mi
          containers:
            - name: sync
              image: quay.io/openshift/origin-cli:4.21
              imagePullPolicy: IfNotPresent
              securityContext:
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 25m
                  memory: 64Mi
                limits:
                  cpu: 250m
                  memory: 256Mi
              command:
                - /bin/sh
                - -ec
                - |
                  umask 077
                  tmp="$(mktemp -d)"
                  trap 'rm -rf "$tmp"' EXIT
                  source_pair="$(oc --cache-dir="$tmp/cache" get secret metrics-client-certs -n openshift-monitoring -o jsonpath='{.data.tls\.crt}{" "}{.data.tls\.key}')"
                  cert="${source_pair%% *}"
                  key="${source_pair#* }"
                  ca="$(oc --cache-dir="$tmp/cache" get configmap kubelet-serving-ca-bundle -n openshift-monitoring -o jsonpath='{.data.ca-bundle\.crt}' | base64 | tr -d '\n')"
                  test -n "$cert" && test -n "$key" && test -n "$ca"
                  printf '{"apiVersion":"v1","kind":"Secret","metadata":{"name":"vm-poc-metrics-client-certs","namespace":"appstudio-vm-poc"},"type":"Opaque","data":{"tls.crt":"%s","tls.key":"%s"}}' "$cert" "$key" > "$tmp/secret.json"
                  printf '{"apiVersion":"v1","kind":"ConfigMap","metadata":{"name":"vm-poc-kubelet-serving-ca-bundle","namespace":"appstudio-vm-poc"},"binaryData":{"ca-bundle.crt":"%s"}}' "$ca" > "$tmp/ca.json"
                  current_pair="$(oc --cache-dir="$tmp/cache" get secret vm-poc-metrics-client-certs -n appstudio-vm-poc -o jsonpath='{.data.tls\.crt}{" "}{.data.tls\.key}' 2>/dev/null || true)"
                  if [ -z "$current_pair" ]; then
                    oc --cache-dir="$tmp/cache" create -f "$tmp/secret.json"
                  elif [ "$current_pair" != "$source_pair" ]; then
                    oc --cache-dir="$tmp/cache" patch secret vm-poc-metrics-client-certs -n appstudio-vm-poc --type merge --patch-file "$tmp/secret.json"
                  fi
                  current_ca="$(oc --cache-dir="$tmp/cache" get configmap vm-poc-kubelet-serving-ca-bundle -n appstudio-vm-poc -o jsonpath='{.binaryData.ca-bundle\.crt}' 2>/dev/null || true)"
                  if [ -z "$current_ca" ]; then
                    oc --cache-dir="$tmp/cache" create -f "$tmp/ca.json"
                  elif [ "$current_ca" != "$ca" ]; then
                    oc --cache-dir="$tmp/cache" patch configmap vm-poc-kubelet-serving-ca-bundle -n appstudio-vm-poc --type merge --patch-file "$tmp/ca.json"
                  fi
