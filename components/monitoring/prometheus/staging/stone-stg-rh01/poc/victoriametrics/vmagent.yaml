apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAgent
metadata:
  name: vm-poc
  namespace: appstudio-vm-poc
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/part-of: stone-stg-rh01-vm-poc
spec:
  image:
    repository: docker.io/victoriametrics/vmagent
    tag: v1.153.0
    pullPolicy: IfNotPresent
  serviceAccountName: vmagent-poc
  shardCount: 3
  replicaCount: 2
  statefulMode: true
  statefulStorage:
    volumeClaimTemplate:
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: gp3
        resources:
          requests:
            storage: 10Gi
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              shard-num: "%SHARD_NUM%"
          topologyKey: kubernetes.io/hostname
  # The converter retains OpenShift Prometheus file paths in copied monitors.
  # The sync CronJob mirrors the CMO certificate and kubelet CA into this namespace.
  volumes:
    - name: platform-service-ca
      configMap:
        name: openshift-service-ca.crt
        items:
          - key: service-ca.crt
            path: service-ca.crt
    - name: kubelet-serving-ca
      configMap:
        name: vm-poc-kubelet-serving-ca-bundle
        items:
          - key: ca-bundle.crt
            path: ca-bundle.crt
    - name: metrics-client-certs
      secret:
        secretName: vm-poc-metrics-client-certs
        items:
          - key: tls.crt
            path: tls.crt
          - key: tls.key
            path: tls.key
  volumeMounts:
    - name: platform-service-ca
      mountPath: /etc/prometheus/configmaps/serving-certs-ca-bundle
      readOnly: true
    - name: kubelet-serving-ca
      mountPath: /etc/prometheus/configmaps/kubelet-serving-ca-bundle
      readOnly: true
    - name: metrics-client-certs
      mountPath: /etc/prometheus/secrets/metrics-client-certs
      readOnly: true
  # Include converted Prometheus monitors and the native Tekton scrapes.
  selectAllByDefault: true
  # Keep longer source intervals, including kaexporter's 300s scrape.
  minScrapeInterval: 30s
  scrapeInterval: 30s
  scrapeTimeout: 10s
  externalLabels:
    cluster: stone-stg-rh01
    collector: vmagent-poc
    source_environment: staging-poc
  externalLabelName: ""
  remoteWrite:
    - url: http://vminsert-vm-poc.appstudio-vm-poc.svc:8480/insert/0/prometheus/api/v1/write
