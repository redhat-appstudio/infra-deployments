apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vm-poc-private-ingress
  namespace: appstudio-vm-poc
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vm-poc-grafana-vmselect
  namespace: appstudio-vm-poc
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vmselect
      app.kubernetes.io/instance: vm-poc
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: appstudio-grafana
          podSelector:
            matchLabels:
              app: grafana-oauth
      ports:
        - protocol: TCP
          port: 8481
---
# These are stone-stg-rh01's current Kubernetes and DNS service IPs.
# Include API backends and DNS pods so policy works across service NAT stages.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vm-poc-credential-sync-egress
  namespace: appstudio-vm-poc
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vm-poc-scrape-credential-sync
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: 172.30.0.1/32
      ports:
        - protocol: TCP
          port: 443
    - to:
        - ipBlock:
            cidr: 10.202.25.206/32
        - ipBlock:
            cidr: 10.202.27.132/32
        - ipBlock:
            cidr: 10.202.28.137/32
      ports:
        - protocol: TCP
          port: 6443
    - to:
        - ipBlock:
            cidr: 172.30.0.10/32
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-dns
          podSelector:
            matchLabels:
              dns.operator.openshift.io/daemonset-dns: default
      ports:
        - protocol: UDP
          port: 5353
        - protocol: TCP
          port: 5353
