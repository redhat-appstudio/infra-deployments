apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vm-poc-private-ingress
  namespace: appstudio-vm-poc
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vm-poc-grafana-vmselect
  namespace: appstudio-vm-poc
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vmselect
      app.kubernetes.io/instance: vm-poc
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: appstudio-grafana
          podSelector:
            matchLabels:
              app: grafana-oauth
      ports:
        - protocol: TCP
          port: 8481
