apiVersion: v1
kind: ServiceAccount
metadata:
  name: vmagent-poc
  namespace: appstudio-vm-poc
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vmagent-poc-discovery
rules:
  - apiGroups: [""]
    resources: [nodes, pods, services, endpoints, namespaces]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [nodes/proxy, nodes/metrics]
    verbs: [get]
  - nonResourceURLs: [/metrics, /metrics/slis]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vmagent-poc-discovery
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vmagent-poc-discovery
subjects:
  - kind: ServiceAccount
    name: vmagent-poc
    namespace: appstudio-vm-poc
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vm-poc-maintainers
  namespace: appstudio-vm-poc
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: konflux-o11y
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: component-maintainer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vm-poc-argocd
  namespace: appstudio-vm-poc
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
rules:
  - apiGroups: [operator.victoriametrics.com]
    resources:
      - vmagents
      - vmclusters
      - vmalerts
      - vmrules
      - vmservicescrapes
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vm-poc-argocd
  namespace: appstudio-vm-poc
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: vm-poc-argocd
subjects:
  - kind: ServiceAccount
    name: remote-argocd
    namespace: remote-argocd
