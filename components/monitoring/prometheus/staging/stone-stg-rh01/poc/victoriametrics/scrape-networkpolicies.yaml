# Allow the PoC agent to reach target namespaces that restrict metrics ingress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vm-poc-external-secrets-scrape
  namespace: external-secrets-operator
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: external-secrets-operator
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: appstudio-vm-poc
          podSelector:
            matchLabels:
              app.kubernetes.io/name: vmagent
              app.kubernetes.io/instance: vm-poc
      ports:
        - protocol: TCP
          port: 8080
---
