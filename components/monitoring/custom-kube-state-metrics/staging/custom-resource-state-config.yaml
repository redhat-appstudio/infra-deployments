apiVersion: v1
kind: ConfigMap
metadata:
  name: custom-kube-state-metrics-config
  namespace: appstudio-monitoring
data:
  custom-resource-state.yaml: |
    spec:
      resources:
        ###############################################################################
        # Add your custom resources below this line
        ###############################################################################
        # Template:
        # - groupVersionKind:
        #     group: "<api-group>"
        #     version: "<version>"
        #     kind: "<Kind>"
        #   labelsFromPath:
        #     name: [metadata, name]
        #     namespace: [metadata, namespace]  # omit for cluster-scoped
        #   metrics:
        #     - name: "<metric_name>"
        #       help: "<description>"
        #       each:
        #         type: Gauge  # or StateSet, Info
        #         gauge:
        #           path: [status, someField]
        #           nilIsZero: true

        ###############################################################################
        # Velero Schedules
        ###############################################################################
        - groupVersionKind:
            group: "velero.io"
            version: "v1"
            kind: "Schedule"
          labelsFromPath:
            schedule: [metadata, name]
            namespace: [metadata, namespace]
          metrics:
            - name: "velero_schedule_paused"
              help: "Whether the Velero schedule is paused (1 = paused, 0 = active)"
              each:
                type: Gauge
                gauge:
                  path: [spec, paused]
                  nilIsZero: true
            - name: "velero_schedule_last_backup"
              help: "status.lastBackup as Unix seconds; 0 if unset (UI n/a)."
              each:
                type: Gauge
                gauge:
                  path: [status, lastBackup]
                  nilIsZero: true

        ###############################################################################
        # PipelineRuns — hanging-PR detection plus application/component info.
        # Resource-level labels are shared; pipelinerun name and finalizers stay on
        # the hanging-PR metric only so the info gauge keys by app/component, not
        # unique PipelineRun names.
        ###############################################################################
        - groupVersionKind:
            group: "tekton.dev"
            version: "v1"
            kind: "PipelineRun"
          labelsFromPath:
            namespace: [metadata, namespace]
          metrics:
            - name: "konflux_pipelinerun_deletion_timestamp_seconds"
              help: "Unix timestamp when deletion was requested (0 = not deleted). Use > 0 to find stuck PipelineRuns."
              labelsFromPath:
                pipelinerun: [metadata, name]
                pipeline: [metadata, labels, tekton.dev/pipeline]
                finalizers: [metadata, finalizers]
              each:
                type: Gauge
                gauge:
                  path: [metadata, deletionTimestamp]
                  nilIsZero: true
            - name: "konflux_pipelinerun_info"
              help: "Info-style gauge (~1) per live Konflux PipelineRun grouped by application/component/type. Duplicate label sets collapse to distinct components."
              labelsFromPath:
                application: [metadata, labels, appstudio.openshift.io/application]
                component: [metadata, labels, appstudio.openshift.io/component]
                pipeline_type: [metadata, labels, pipelines.appstudio.openshift.io/type]
                event_type: [metadata, labels, pipelinesascode.tekton.dev/event-type]
                pac_test_event_type: [metadata, labels, pac.test.appstudio.openshift.io/event-type]
              each:
                type: Gauge
                gauge:
                  path: [metadata, generation]
                  nilIsZero: true

