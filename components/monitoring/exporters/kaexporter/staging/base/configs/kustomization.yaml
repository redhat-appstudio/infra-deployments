apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

configMapGenerator:
  - name: kaexporter-config
    namespace: konflux-o11y-exporters
    files:
      - kaexporter-config.yaml
  - name: kaexporter-slo-tiers
    namespace: konflux-o11y-exporters
    files:
      - slo-tiers.yaml
  - name: kaexporter-endpoint
    namespace: konflux-o11y-exporters
    literals:
      # Required: each cluster overlay supplies its own endpoint.
      - ka-host=
