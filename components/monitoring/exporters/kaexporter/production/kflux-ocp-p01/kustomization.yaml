resources:
  - ../base

configMapGenerator:
  - name: kaexporter-slo-tiers
    namespace: konflux-o11y-exporters
    behavior: replace
    files:
      - slo-tiers.yaml=configs/slo-tiers.yaml

patches:
  - target:
      kind: ExternalSecret
      name: ka-kubearchive-credentials
    patch: |
      - op: replace
        path: /spec/dataFrom/0/extract/key
        value: stonesoup/production/monitoring/exporters/kaexporter/kflux-ocp-p01
