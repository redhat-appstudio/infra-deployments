kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: build-admin
  namespace: build-templates-e2e
rules:
  - apiGroups:
      - ''
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch
      - update
      - patch
      - delete

  - apiGroups:
      - ''
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
      - delete
