apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/name: mintmaker
    app.kubernetes.io/managed-by: kustomize
  name: blackbox-config
data:
  blackbox.yml: |
    modules:
      http_2xx:
        prober: http
        timeout: 5s
        http:
          valid_http_versions: ["HTTP/1.1", "HTTP/2"]
          method: GET
          no_follow_redirects: false
          fail_if_ssl: false
          fail_if_not_ssl: false
      icmp:
        prober: icmp
        timeout: 5s
