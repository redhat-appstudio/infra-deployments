apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mintmaker-schedule-calculator-manager-role
rules:
  - apiGroups:
      - ''
    resourceNames:
      - renovate-config
    resources:
      - configmaps
    verbs:
      - get
      - watch
  - apiGroups:
      - ''
    resources:
      - configmaps
    verbs:
      - create
  - apiGroups:
      - ''
    resourceNames:
      - mintmaker-schedule-calculator-results
    resources:
      - configmaps
    verbs:
      - update
      - delete
  - apiGroups:
      - batch
    resourceNames:
      - create-dependencyupdatecheck
    resources:
      - cronjobs
    verbs:
      - get
      - watch
