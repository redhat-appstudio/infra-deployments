kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: mintmaker-admin
  namespace: mintmaker
rules:
  - apiGroups:
      - ''
    resources:
      - pods
      - pods/attach
      - pods/exec
      - pods/log
      - secrets
      - configmaps
    verbs:
      - '*'
  - apiGroups:
      - 'batch'
    resources:
      - cronjobs
      - jobs
    verbs:
      - '*'
  - apiGroups:
      - appstudio.redhat.com
    resources:
      - dependencyupdatechecks
    verbs:
      - '*'
