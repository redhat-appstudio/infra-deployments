---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubearchive-operator
  namespace: kubearchive
spec:
  template:
    spec:
      securityContext:
        runAsUser: null
      containers:
        - name: manager
          args: [--health-probe-bind-address=:8081]
          env:
          - name: KUBEARCHIVE_OTEL_MODE
            value: enabled
          - name: OTEL_EXPORTER_OTLP_ENDPOINT
            value: http://otel-collector:4318
          - name: KUBEARCHIVE_ENABLE_PPROF
            value: "true"
          - name: LOG_LEVEL
            value: INFO
          - name: KLOG_LEVEL
            value: "0"
          - name: KUBEARCHIVE_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: KUBEARCHIVE_OTLP_SEND_LOGS
            value: "false"
          - name: OTEL_GO_X_DEPRECATED_RUNTIME_METRICS
            value: "false"
          - name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          - name: GOMEMLIMIT
            valueFrom:
              resourceFieldRef:
                resource: requests.memory
          ports:
            - containerPort: 8081
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 10m
              memory: 256Mi
