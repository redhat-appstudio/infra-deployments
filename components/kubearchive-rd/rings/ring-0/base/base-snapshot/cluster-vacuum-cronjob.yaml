---
apiVersion: batch/v1
kind: CronJob
metadata:
  labels:
    app.kubernetes.io/component: operator
    app.kubernetes.io/name: kubearchive-vacuum
    app.kubernetes.io/part-of: kubearchive
    app.kubernetes.io/version: v1.23.0
  name: cluster-vacuum
  namespace: kubearchive
spec:
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - args:
                - --type
                - cluster
                - --config
                - cluster-vacuum
              command:
                - /ko-app/vacuum
              env:
                - name: KUBEARCHIVE_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
              image: quay.io/kubearchive/vacuum:v1.23.0@sha256:8d206418525c6a1b36824ef54921fed337210b3ad78e72977af2bf4bdcc19748
              name: vacuum
          restartPolicy: Never
          serviceAccount: kubearchive-cluster-vacuum
  schedule: '* */3 * * *'
  suspend: true
