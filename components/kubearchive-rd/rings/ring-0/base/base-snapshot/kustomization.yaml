---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - rbac
  - monitoring

# ROSA does not support namespaces starting with `kube`
namespace: product-kubearchive

configMapGenerator:
  - name: otel-collector-conf
    namespace: product-kubearchive
    files:
      - monitoring/otel/otel-collector-config.yaml
