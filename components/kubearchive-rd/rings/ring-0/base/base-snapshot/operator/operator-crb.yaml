---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubearchive-operator
rules:
  - apiGroups:
      - ""
    resources:
      - namespaces
    verbs:
      - get
      - list
      - update
      - watch
  - apiGroups:
      - ""
    resources:
      - serviceaccounts
    verbs:
      - create
      - delete
      - get
      - list
      - update
      - watch
  - apiGroups:
      - kubearchive.org
    resources:
      - clusterkubearchiveconfigs
      - clustervacuums
      - kubearchiveconfigs
      - namespacevacuums
      - sinkfilters
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - kubearchive.org
    resources:
      - clusterkubearchiveconfigs/finalizers
      - kubearchiveconfigs/finalizers
      - sinkfilters/finalizers
    verbs:
      - update
  - apiGroups:
      - kubearchive.org
    resources:
      - clusterkubearchiveconfigs/status
      - kubearchiveconfigs/status
      - sinkfilters/status
    verbs:
      - get
      - patch
      - update
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - clusterrolebindings
      - clusterroles
    verbs:
      - bind
      - create
      - delete
      - escalate
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - rolebindings
      - roles
    verbs:
      - bind
      - create
      - delete
      - escalate
      - get
      - list
      - update
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    app.kubernetes.io/component: operator
    app.kubernetes.io/name: kubearchive-operator
    app.kubernetes.io/part-of: kubearchive
    app.kubernetes.io/version: v1.23.0
  name: kubearchive-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubearchive-operator
subjects:
  - kind: ServiceAccount
    name: kubearchive-operator
    namespace: kubearchive
