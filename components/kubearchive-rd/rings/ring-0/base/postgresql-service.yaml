---
apiVersion: v1
kind: Service
metadata:
  name: postgresql
  labels:
    app: postgresql
  annotations:
    # Ensure database is ready before schema-migration job runs
    argocd.argoproj.io/sync-wave: "-2"
    service.beta.openshift.io/serving-cert-secret-name: postgresql-tls
spec:
  type: ClusterIP
  ports:
    - port: 5432
  selector:
    app: postgresql
