apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  annotations:
    cert-manager.io/inject-ca-from: kubearchive/kubearchive-operator-certificate
    service.beta.openshift.io/inject-cabundle: "true"
  labels:
    app.kubernetes.io/component: operator
    app.kubernetes.io/name: kubearchive-validating-webhook-configuration
    app.kubernetes.io/part-of: kubearchive
    app.kubernetes.io/version: v1.23.0
  name: kubearchive-validating-webhook-configuration
webhooks:
  - admissionReviewVersions:
      - v1
    clientConfig:
      service:
        name: kubearchive-operator-webhooks
        namespace: kubearchive
        path: /validate-kubearchive-org-v1-kubearchiveconfig
    failurePolicy: Fail
    name: vkubearchiveconfig.kb.io
    rules:
      - apiGroups:
          - kubearchive.org
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - kubearchiveconfigs
    sideEffects: None
  - admissionReviewVersions:
      - v1
    clientConfig:
      service:
        name: kubearchive-operator-webhooks
        namespace: kubearchive
        path: /validate-kubearchive-org-v1-clusterkubearchiveconfig
    failurePolicy: Fail
    name: vclusterkubearchiveconfig.kb.io
    rules:
      - apiGroups:
          - kubearchive.org
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - clusterkubearchiveconfigs
    sideEffects: None
  - admissionReviewVersions:
      - v1
    clientConfig:
      service:
        name: kubearchive-operator-webhooks
        namespace: kubearchive
        path: /validate-kubearchive-org-v1-sinkfilter
    failurePolicy: Fail
    name: vsinkfilter.kb.io
    rules:
      - apiGroups:
          - kubearchive.org
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - sinkfilters
    sideEffects: None
  - admissionReviewVersions:
      - v1
    clientConfig:
      service:
        name: kubearchive-operator-webhooks
        namespace: kubearchive
        path: /validate-kubearchive-org-v1-namespacevacuumconfig
    failurePolicy: Fail
    name: vnamespacevacuumconfig.kb.io
    rules:
      - apiGroups:
          - kubearchive.org
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - namespacevacuumconfigs
    sideEffects: None
  - admissionReviewVersions:
      - v1
    clientConfig:
      service:
        name: kubearchive-operator-webhooks
        namespace: kubearchive
        path: /validate-kubearchive-org-v1-clustervacuumconfig
    failurePolicy: Fail
    name: vclustervacuumconfig.kb.io
    rules:
      - apiGroups:
          - kubearchive.org
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - clustervacuumconfigs
    sideEffects: None

