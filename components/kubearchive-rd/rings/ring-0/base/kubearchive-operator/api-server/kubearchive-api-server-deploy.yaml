apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: api-server
    app.kubernetes.io/name: kubearchive-api-server
    app.kubernetes.io/part-of: kubearchive
    app.kubernetes.io/version: v1.23.0
  name: kubearchive-api-server
  namespace: kubearchive
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubearchive-api-server
  template:
    metadata:
      labels:
        app: kubearchive-api-server
    spec:
      containers:
        - env:
            - name: KUBEARCHIVE_ENABLE_PPROF
              value: "true"
            - name: LOG_LEVEL
              value: INFO
            - name: KLOG_LEVEL
              value: "0"
            - name: GIN_MODE
              value: release
            - name: KUBEARCHIVE_OTEL_MODE
              value: disabled
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: ""
            - name: KUBEARCHIVE_OTLP_SEND_LOGS
              value: "false"
            - name: OTEL_GO_X_DEPRECATED_RUNTIME_METRICS
              value: "false"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: GOMEMLIMIT
              valueFrom:
                resourceFieldRef:
                  resource: requests.memory
            - name: GOMAXPROCS
              valueFrom:
                resourceFieldRef:
                  resource: limits.cpu
            - name: CACHE_EXPIRATION_AUTHORIZED
              value: 10m
            - name: CACHE_EXPIRATION_UNAUTHORIZED
              value: 1m
            - name: KUBEARCHIVE_LOGGING_DIR
              value: /data/logging
            - name: AUTH_IMPERSONATE
              value: "false"
            - name: DATABASE_MAX_OPEN_CONNS
              value: "25"
            - name: DATABASE_MAX_IDLE_CONNS
              value: "10"
            - name: DATABASE_CONN_MAX_LIFETIME
              value: "10m"
            - name: DATABASE_CONN_MAX_IDLE_TIME
              value: "3m"
            - name: KUBEARCHIVE_QUERY_TIMEOUT
              value: "5m"
            - name: API_RATE_LIMIT_OVERALL_RPS
              value: "200"
            - name: API_RATE_LIMIT_LOG_RPS
              value: "20"
            - name: API_RATE_LIMIT_OVERALL_BURST
              value: "600"
            - name: API_RATE_LIMIT_LOG_BURST
              value: "60"
          envFrom:
            - secretRef:
                name: kubearchive-database-credentials
          image: quay.io/kubearchive/api:v1.23.0@sha256:e2b69c81967cd9fb0b7e6b75de19a5c1271554e4991c945f718e3f6af09d82af
          livenessProbe:
            httpGet:
              path: /livez
              port: 8081
              scheme: HTTPS
          name: kubearchive-api-server
          ports:
            - containerPort: 8081
              name: server
              protocol: TCP
            - containerPort: 8888
              name: pprof
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
              scheme: HTTPS
          resources:
            limits:
              cpu: 700m
              memory: 256Mi
            requests:
              cpu: 200m
              memory: 230Mi
          volumeMounts:
            - mountPath: /etc/kubearchive/ssl/
              name: tls-secret
              readOnly: true
            - mountPath: /data/logging
              name: logging-config
      serviceAccountName: kubearchive-api-server
      volumes:
        - name: tls-secret
          secret:
            secretName: kubearchive-api-server-tls
        - name: logging-config
          projected:
            sources:
              - configMap:
                  name: kubearchive-logging-reader
              - secret:
                  name: kubearchive-logging
