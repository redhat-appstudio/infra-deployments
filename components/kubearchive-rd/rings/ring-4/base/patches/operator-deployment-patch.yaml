---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubearchive-operator
  namespace: kubearchive
spec:
  template:
    spec:
      securityContext:
        runAsUser: null
      containers:
        - name: manager
          args: [--health-probe-bind-address=:8081]
          env:
          - name: GOMEMLIMIT
            value: 10GiB
            valueFrom: null # required because valueFrom comes from the original
          - name: KUBEARCHIVE_OTEL_MODE
            value: enabled
          - name: OTEL_EXPORTER_OTLP_ENDPOINT
            value: http://otel-collector:4318
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          ports:
            - containerPort: 8081
          resources:
            limits:
              cpu: "1"
              memory: 15Gi
            requests:
              cpu: "1"
              memory: 15Gi
