---
- op: replace
  path: /spec/secretStoreRef/name
  value: appsre-stonesoup-vault
- op: replace
  path: /spec/target/template/data/DATABASE_PORT
  value: '{{ index . "db.port" }}'
- op: add
  path: /spec/target/template/data/DATABASE_CA_CERT
  value: '{{ index . "db.ca_cert" | b64dec }}'
- op: add
  path: /spec/target/template/data/PGSSLMODE
  value: verify-full
- op: add
  path: /spec/target/template/data/PGSSLROOTCERT
  value: /etc/ssl/certs/db-ca.crt
