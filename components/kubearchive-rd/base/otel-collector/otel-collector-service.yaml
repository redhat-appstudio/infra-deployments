---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: product-kubearchive
  labels:
    app: otel-collector
spec:
  ports:
    - name: otlp-http
      port: 4318
    - name: metrics
      port: 8888
    - name: https
      port: 8443
    - name: zipkin
      port: 9411
  selector:
    app: otel-collector
