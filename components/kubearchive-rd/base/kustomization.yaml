---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - api-server
  - crds
  - operator
  - otel-collector
  - rbac
  - secrets-and-certs
  - sink
  - cluster-vacuum-cronjob.yaml
  - kubearchive-mutating-webhook-config.yaml
  - kubearchive-ns.yaml
  - kubearchive-schema-migration-job.yaml
  - kubearchive-servicemonitor.yaml
  - kubearchive-validating-webhook-config.yaml
  - releases-cluster-vacuum-config.yaml

 # We don't need this CronJob as it is suspended; we can enable it later
patches:
  - patch: |-
      $patch: delete
      apiVersion: batch/v1
      kind: CronJob
      metadata:
        name: cluster-vacuum
        namespace: kubearchive