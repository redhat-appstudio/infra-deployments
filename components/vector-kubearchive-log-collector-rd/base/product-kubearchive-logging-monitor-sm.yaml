apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: product-kubearchive-logging-monitor
  namespace: product-kubearchive-logging
spec:
  endpoints:
  - path: /metrics
    port: https
    scheme: https
    bearerTokenSecret:
      name: "metrics-reader"
      key: token
    tlsConfig:
      insecureSkipVerify: true
  selector:
    matchLabels:
      app.kubernetes.io/name: "loki"
