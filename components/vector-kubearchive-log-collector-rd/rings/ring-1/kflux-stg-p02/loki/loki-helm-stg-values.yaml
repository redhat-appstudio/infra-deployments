---
global:
  extraArgs:
    - "-log.level=debug"

gateway:
  service:
    type: ClusterIP
  basicAuth:
    enabled: true
    existingSecret: kubearchive-loki
  serviceAccount:
    create: false
    name: loki-gateway
  securityContext:
    allowPrivilegeEscalation: false
    runAsUser: 0
    capabilities:
      drop:
        - CHOWN
        - DAC_OVERRIDE
        - FOWNER
        - FSETID
        - KILL
        - NET_BIND_SERVICE
        - SETGID
        - SETPCAP
        - SETUID
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi
  metrics:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 128Mi

# Basic Loki configuration with S3-compatible COS storage
loki:
  commonConfig:
    replication_factor: 3
  memberlist:
    join_members: []
    dead_node_reclaim_time: 5m
    gossip_interval: 2s
    push_pull_interval: 10s
    gossip_nodes: 3
    gossip_to_dead_nodes_time: 15s
    left_ingesters_timeout: 90s
  storage:
    type: s3
    s3:
      region: us-east
  storage_config:
    aws:
      region: us-east
      s3forcepathstyle: true
  limits_config:
    shard_streams:
      enabled: false
    retention_period: 744h  # 31 days retention
    ingestion_rate_mb: 100
    ingestion_burst_size_mb: 300
    ingestion_rate_strategy: "local"
    max_streams_per_user: 0
    max_line_size: 2097152
    per_stream_rate_limit: 100M
    per_stream_rate_limit_burst: 400M
    reject_old_samples: false
    reject_old_samples_max_age: 168h
    discover_service_name: []
    discover_log_levels: false
    volume_enabled: true
    max_global_streams_per_user: 75000
    max_entries_limit_per_query: 100000
    increment_duplicate_timestamp: true
    allow_structured_metadata: true
    tsdb_max_query_parallelism: 16
    split_queries_by_interval: 1h
    query_timeout: 5m
  runtimeConfig:
    configs:
      kubearchive:
        log_push_request: true
        log_push_request_streams: true
        log_stream_creation: true
        log_duplicate_stream_info: true
  ingester:
    autoforget_unhealthy: true
    chunk_target_size: 8388608        # 8MB
    chunk_idle_period: 30m
    max_chunk_age: 1h
    chunk_encoding: snappy            # Compress data (reduces S3 transfer size)
    chunk_retain_period: 30m          # Keep chunks in memory after flush
    flush_op_timeout: 10m             # Add timeout for S3 operations
    lifecycler:
      ring:
        heartbeat_timeout: 10m
    wal:
      enabled: true
      dir: /var/loki/wal
      checkpoint_duration: 5m
      flush_on_shutdown: true
      replay_memory_ceiling: 9GB
  server:
    grpc_server_max_recv_msg_size: 15728640  # 15MB
    grpc_server_max_send_msg_size: 15728640
  ingester_client:
    grpc_client_config:
      max_recv_msg_size: 15728640  # 15MB
      max_send_msg_size: 15728640  # 15MB
  query_scheduler:
    grpc_client_config:
      max_recv_msg_size: 15728640  # 15MB
      max_send_msg_size: 15728640  # 15MB
  querier:
    max_concurrent: 8
  query_range:
    parallelise_shardable_queries: false

# Distributed components configuration
ingester:
  replicas: 3
  autoscaling:
    enabled: true
  zoneAwareReplication:
    enabled: true
  maxUnavailable: 1
  resources:
    requests:
      cpu: 500m
      memory: 8Gi
    limits:
      cpu: 2000m
      memory: 12Gi
  persistence:
    enabled: true
    size: 10Gi
  affinity: {}
  podAntiAffinity:
    soft: {}
    hard: {}
  terminationGracePeriodSeconds: 120
  lifecycle:
    preStop:
      exec:
        command:
          - /bin/sh
          - -c
          - sleep 10

querier:
  replicas: 3
  autoscaling:
    enabled: true
  maxUnavailable: 1
  resources:
    requests:
      cpu: 500m
      memory: 6Gi
    limits:
      memory: 10Gi
  affinity: {}

queryFrontend:
  replicas: 2
  maxUnavailable: 1
  resources:
    requests:
      cpu: 200m
      memory: 2Gi
    limits:
      memory: 4Gi

queryScheduler:
  replicas: 2
  maxUnavailable: 1
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      memory: 512Mi

distributor:
  replicas: 5
  autoscaling:
    enabled: true
    minReplicas: 5
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  maxUnavailable: 1
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 2Gi
  affinity: {}

compactor:
  replicas: 1
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 150
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      memory: 1Gi

indexGateway:
  replicas: 3
  maxUnavailable: 1
  resources:
    requests:
      cpu: 300m
      memory: 512Mi
    limits:
      memory: 1Gi
  affinity: {}

chunksCache:
  enabled: true
  replicas: 1
  batchSize: 256
  parallelism: 10
  maxItemMemory: 30
  defaultValidity: 12h
  serviceAccount:
    create: false
    name: loki-memcached

resultsCache:
  enabled: true
  replicas: 1
  maxItemMemory: 100
  defaultValidity: 12h
  serviceAccount:
    create: false
    name: loki-memcached

memcached:
  enabled: true
  maxItemMemory: 30
  serviceAccount:
    create: false
    name: loki-memcached

memcachedResults:
  enabled: true
  maxItemMemory: 100
  serviceAccount:
    create: false
    name: loki-memcached

memcachedChunks:
  enabled: true
  maxItemMemory: 30
  serviceAccount:
    create: false
    name: loki-memcached

memcachedFrontend:
  enabled: true
  maxItemMemory: 100
  serviceAccount:
    create: false
    name: loki-memcached

memcachedIndexQueries:
  enabled: true
  maxItemMemory: 50
  serviceAccount:
    create: false
    name: loki-memcached

memcachedIndexWrites:
  enabled: true
  maxItemMemory: 30
  serviceAccount:
    create: false
    name: loki-memcached

# Disable Minio
minio:
  enabled: false

# Resources for memcached exporter to satisfy linter
memcachedExporter:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi
