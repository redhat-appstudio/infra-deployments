apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../base
- external-secrets

patches:
- path: patches/manager-resources-patch.yaml

helmGlobals:
  chartHome: ../base

helmCharts:
- name: host-config-chart-public
  releaseName: host-config
  namespace: multi-platform-controller
  valuesFile: host-values.yaml
