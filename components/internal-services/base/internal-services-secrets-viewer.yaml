---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: internal-services-secrets-viewer
  namespace: internal-services
rules:
  - apiGroups:
      - ''
    resources:
      - secrets
    verbs:
      - get
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: internal-services-secrets-viewer
  namespace: internal-services
subjects:
  - kind: Group
    apiGroup: rbac.authorization.k8s.io
    name: konflux-release-team
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: internal-services-secrets-viewer
