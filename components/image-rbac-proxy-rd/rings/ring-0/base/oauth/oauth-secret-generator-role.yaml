apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: oauth-secret-generator
  namespace: image-rbac-proxy
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  resourceNames:
  - image-proxy-client-secret
  verbs:
  - get
  - patch
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - create
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - get
  - patch
