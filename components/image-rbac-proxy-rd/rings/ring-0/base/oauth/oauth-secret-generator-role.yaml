apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: oauth-secret-generator
  namespace: image-rbac-proxy
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - list
  - create
  - get
  - update
  - patch
  - delete
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - get
  - patch
