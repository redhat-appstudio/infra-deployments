apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: image-rbac-proxy-ca
  namespace: image-rbac-proxy
spec:
  isCA: true
  commonName: image-rbac-proxy-ca
  duration: 2160h
  renewBefore: 720h
  secretName: image-rbac-proxy-ca
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    kind: Issuer
    name: selfsigned-issuer
