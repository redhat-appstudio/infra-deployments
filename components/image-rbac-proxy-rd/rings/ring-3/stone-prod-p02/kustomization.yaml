apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: image-rbac-proxy
resources:
- ../base
# Enable this to create/preserve OAuth Secret.
- ../base/oauth

configMapGenerator:
  - name: dex
    files:
      - dex-config.yaml

patches:
- path: patches/configmap-patch.yaml
- path: patches/route-patch.yaml
  target:
    kind: Route
    group: route.openshift.io
    version: v1
- path: patches/sa-patch.yaml
  target:
    kind: ServiceAccount
    name: dex-client
    version: v1
