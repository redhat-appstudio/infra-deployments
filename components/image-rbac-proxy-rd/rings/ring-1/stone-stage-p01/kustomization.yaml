apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: image-rbac-proxy
resources:
- ../base
- cert-manager

configMapGenerator:
  - name: dex
    files:
      - dex-config.yaml

patches:
- path: patches/configmap-patch.yaml
- path: patches/service-tls-patch.yaml
  target:
    kind: Service
    name: image-rbac-proxy|dex
- path: patches/route-patch.yaml
  target:
    kind: Route
    group: route.openshift.io
    version: v1
- path: patches/sa-patch.yaml
  target:
    kind: ServiceAccount
    name: dex-client
    version: v1
