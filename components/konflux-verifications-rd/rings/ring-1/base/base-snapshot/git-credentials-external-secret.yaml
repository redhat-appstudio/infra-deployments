# ExternalSecret that pulls the GitHub PAT from Vault and creates a
# basic-auth secret for Tekton's git resolver. Without this, integration
# test PipelineRuns cannot fetch pipeline definitions from private repos.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: git-credentials
  namespace: konflux-conformance-tests
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: appsre-stonesoup-vault
  data:
    - secretKey: password
      remoteRef:
        key: production/devprod/konflux-conformance-tests-credentials
        property: github_pat
  target:
    name: git-credentials
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      type: kubernetes.io/basic-auth
      metadata:
        annotations:
          tekton.dev/git-0: https://github.com
      data:
        username: git
        password: "{{ .password }}"
