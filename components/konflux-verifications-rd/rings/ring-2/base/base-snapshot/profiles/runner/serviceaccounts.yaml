# Tokens for the remote launcher are issued through TokenRequest, not static Secrets.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: konflux-bot-0
  namespace: verification-runner
automountServiceAccountToken: false
---
# Test workloads use the mounted ServiceAccount token to access the Kubernetes API.
# Keep the default automount behavior for this execution identity.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: verification-runner
  namespace: verification-runner
