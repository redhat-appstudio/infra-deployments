# Replace these read-only example permissions with the suite's reviewed requirements.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: verification-tests
  namespace: verification-example-smoke-tenant
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: verification-tests
  namespace: verification-example-smoke-tenant
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: verification-tests
subjects:
  - kind: ServiceAccount
    name: verification-runner
    namespace: verification-example-smoke-runner
