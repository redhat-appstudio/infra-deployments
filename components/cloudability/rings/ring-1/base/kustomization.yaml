apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ibm-finops-agent

resources:
  - base-snapshot
  - trusted-ca-bundle-configmap.yaml

generators:
  - finops-agent-helm-generator.yaml

patches:
  - path: ibm-finops-agent-secret-patch.yaml
    target:
      kind: ExternalSecret
      name: ibm-finops-agent-secrets
  - path: deployment-ca-bundle-patch.yaml
    target:
      kind: Deployment
      name: ibm-finops-agent
