apiVersion: apps/v1
kind: Deployment
metadata:
  name: ibm-finops-agent
spec:
  template:
    spec:
      containers:
        - name: finops-agent
          env:
            - name: CLUSTER_ID
              value: "kflux-hub-stg-01"
            - name: CLOUDABILITY_CLUSTER_NAME
              value: "kflux-hub-stg-01"
