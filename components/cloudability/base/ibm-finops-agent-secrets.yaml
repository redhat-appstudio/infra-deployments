apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ibm-finops-agent-secrets
  namespace: ibm-finops-agent
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: appsre-stonesoup-vault
  target:
    name: ibm-finops-agent-secrets
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      engineVersion: v2
      data:
        # Cloudability credentials
        CLOUDABILITY_KEY_ACCESS: "{{ .access_key }}"
        CLOUDABILITY_KEY_SECRET: "{{ .secret_key }}"
        CLOUDABILITY_ENV_ID: "{{ .env_id }}"
        # CSP Pricing API key (shared across all clusters)
        CSP_PRICING_API_KEY: "{{ .csp_pricing_api_key }}"
  dataFrom:
    - extract:
        key: "" # To be set in overlay
