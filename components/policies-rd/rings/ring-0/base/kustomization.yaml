apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: konflux-policies
resources:
- base-snapshot
- taskruns-cluster-policy.yaml
- restrict-docker-io/
- konflux-rbac/
- kueue/

# One $patch: delete document per file. Argo CD's bundled kustomize panics on
# multi-document strategic-merge patch files (kubernetes/kubernetes#131939).
patches:
- path: delete-kyverno-admission-propagate-cost-management-labels.yaml
- path: delete-propagate-cost-management-labels.yaml
- path: delete-global-context-entry-namespaces.yaml
- path: delete-namespace-lister-deny-virtual-domain.yaml
