# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: restrict-notifications-url
spec:
  description: |
    Tests that the staging restrict-notifications-url ValidatingAdmissionPolicy only allows ImageRepository notification callback urls
    that point to the Red Hat Bombino pre-production instance (https://bombino.preprod.api.redhat.com) and denies any other url.
    Also verifies the policy applies to both the current (konflux-ci.dev) and the deprecated (appstudio.redhat.com) API groups.
  # The ImageRepository CRDs are not part of the chainsaw kind cluster, so both the current and the deprecated group CRDs are installed before the policy.
  # Tests run serially to keep webhook behaviour deterministic.
  concurrent: false
  steps:
  - name: given-crds-and-validating-admission-policy-are-ready
    try:
    - apply:
        file: resources/imagerepository-crd.yaml
    - apply:
        file: resources/imagerepository-crd-deprecated.yaml
    - apply:
        file: ../restrict-notifications-url-validationadmissionpolicy.yaml
    - apply:
        file: ../restrict-notifications-url-validationadmissionpolicybinding.yaml
    - assert:
        file: chainsaw-assert-validatingadmissionpolicy.yaml
  - name: then-preprod-bombino-url-is-allowed
    try:
    - create:
        file: resources/imagerepository-good-bombino.yaml
  - name: then-image-repository-without-notifications-is-allowed
    try:
    - create:
        file: resources/imagerepository-good-no-notifications.yaml
  - name: then-non-bombino-url-is-denied
    try:
    - create:
        file: resources/imagerepository-bad-url.yaml
        expect:
        - check:
            ($error != null): true
  - name: then-production-bombino-url-is-denied-on-staging
    try:
    - create:
        file: resources/imagerepository-bad-prod-url.yaml
        expect:
        - check:
            ($error != null): true
  - name: then-lookalike-bombino-host-is-denied
    try:
    - create:
        file: resources/imagerepository-bad-lookalike-url.yaml
        expect:
        - check:
            ($error != null): true
  - name: then-mixed-notifications-with-one-bad-url-is-denied
    try:
    - create:
        file: resources/imagerepository-bad-mixed.yaml
        expect:
        - check:
            ($error != null): true
  - name: then-deprecated-api-group-is-still-enforced
    try:
    - create:
        file: resources/imagerepository-bad-deprecated-group.yaml
        expect:
        - check:
            ($error != null): true
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: allow-update-existing-invalid-url-if-unchanged
spec:
  description: |
    Tests that an existing ImageRepository with an invalid notification URL can still be updated
    as long as the notification URL itself is not changed. This allows controllers to update
    metadata without being blocked by pre-existing invalid URLs.
  concurrent: false
  steps:
  - name: given-crds-exist
    try:
    - apply:
        file: resources/imagerepository-crd.yaml
    - assert:
        file: chainsaw-assert-imagerepository-crd.yaml
  - name: given-imagerepository-with-invalid-url-exists-before-policy
    try:
    - create:
        file: resources/imagerepository-existing-bad-url.yaml
  - name: given-validating-admission-policy-is-applied
    try:
    - apply:
        file: ../restrict-notifications-url-validationadmissionpolicy.yaml
    - apply:
        file: ../restrict-notifications-url-validationadmissionpolicybinding.yaml
    - assert:
        file: chainsaw-assert-validatingadmissionpolicy.yaml
  - name: then-update-metadata-without-changing-notifications-succeeds
    try:
    - patch:
        resource:
          apiVersion: konflux-ci.dev/v1alpha1
          kind: ImageRepository
          metadata:
            name: test-existing-bad-url
            labels:
              updated-by: controller
  - name: then-apply-full-object-with-same-notifications-succeeds
    try:
    - apply:
        file: resources/imagerepository-existing-bad-url-updated-metadata.yaml
  - name: then-changing-invalid-url-to-another-invalid-url-fails
    try:
    - apply:
        file: resources/imagerepository-existing-bad-url-changed-url.yaml
        expect:
        - check:
            ($error != null): true
  - name: then-changing-invalid-url-to-valid-url-succeeds
    try:
    - apply:
        file: resources/imagerepository-existing-bad-url-fixed.yaml
