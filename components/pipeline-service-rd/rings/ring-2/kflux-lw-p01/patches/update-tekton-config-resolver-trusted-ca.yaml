# Point git in the remote resolvers at the trust-manager trusted-ca bundle.
# git reads GIT_SSL_CAINFO and does not scan /etc/ssl/certs. On ROKS HCP the
# operator bundle at /tekton-custom-certs/ca-bundle.crt lacks the RH internal CA.
# trusted-ca includes the default public CAs plus that CA, so it can replace
# GIT_SSL_CAINFO. See components/cert-manager-trusted-ca/production/kflux-lw-p01/.
---
- op: replace
  path: /spec/pipeline/options/statefulSets/tekton-pipelines-remote-resolvers/spec/template/spec/containers/0/env/0/value
  value: /etc/ssl/certs/ca-custom-bundle.crt
- op: add
  path: /spec/pipeline/options/statefulSets/tekton-pipelines-remote-resolvers/spec/template/spec/volumes
  value:
  - name: trusted-ca
    configMap:
      name: trusted-ca
      items:
      - key: ca-bundle.crt
        path: ca-bundle.crt
      defaultMode: 420
      optional: false
- op: add
  path: /spec/pipeline/options/statefulSets/tekton-pipelines-remote-resolvers/spec/template/spec/containers/0/volumeMounts
  value:
  - name: trusted-ca
    mountPath: /etc/ssl/certs/ca-custom-bundle.crt
    readOnly: true
    subPath: ca-bundle.crt
