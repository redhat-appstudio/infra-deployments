apiVersion: operator.tekton.dev/v1alpha1
kind: TektonConfig
metadata:
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "0"
  name: config
spec:
  chain:
    artifacts.oci.storage: oci
    artifacts.pipelinerun.enable-deep-inspection: "true"
    artifacts.pipelinerun.format: in-toto
    artifacts.pipelinerun.storage: oci
    artifacts.taskrun.format: in-toto
    artifacts.taskrun.storage: ""
    options:
      deployments:
        tekton-chains-controller:
          spec:
            template:
              spec:
                containers:
                  - args:
                      - --threads-per-controller=32
                      - --kube-api-qps=50
                      - --kube-api-burst=50
                    name: tekton-chains-controller
    transparency.enabled: "false"
  params:
  - name: createRbacResource
    value: "false"
  - name: createCABundleConfigMaps
    value: "false"
  pipeline:
    default-service-account: default
    enable-api-fields: alpha
    enable-bundles-resolver: true
    enable-cluster-resolver: true
    enable-git-resolver: true
    enable-hub-resolver: true
    enable-param-enum: true
    enable-step-actions: true
    metrics.pipelinerun.level: namespace
    metrics.taskrun.level: namespace
    options:
      configMaps:
        feature-flags:
          data:
            enable-termination-message-compression: 'true'
        config-logging:
          data:
            loglevel.controller: info
            loglevel.webhook: info
            zap-logger-config: |
              {
                "level": "info",
                "development": false,
                "sampling": {
                  "initial": 100,
                  "thereafter": 100
                },
                "outputPaths": ["stdout"],
                "errorOutputPaths": ["stderr"],
                "encoding": "json",
                "encoderConfig": {
                  "timeKey": "ts",
                  "levelKey": "level",
                  "nameKey": "logger",
                  "callerKey": "caller",
                  "messageKey": "msg",
                  "stacktraceKey": "stacktrace",
                  "lineEnding": "",
                  "levelEncoder": "",
                  "timeEncoder": "iso8601",
                  "durationEncoder": "string",
                  "callerEncoder": ""
                }
              }
        config-defaults:
          data:
            default-container-resource-requirements: |
              default:
                requests:
                  memory: "256Mi"
                  cpu: "100m"
            default-pod-template: |
              nodeSelector:
                konflux-ci.dev/workload: konflux-tenants
              tolerations:
                - key: konflux-ci.dev/workload
                  operator: "Equal"
                  value: "konflux-tenants"
                  effect: "NoSchedule"
            default-timeout-minutes: "120"
            default-imagepullbackoff-timeout: "15m"
        config-leader-election-resolvers:
          data:
            buckets: "4"
        bundleresolver-config:
          data:
            backoff-cap: "15m"
            backoff-duration: "15s"
            backoff-factor: "2.0"
            backoff-steps: "10"
            fetch-timeout: "2m"
        git-resolver-config:
          data:
            fetch-timeout: 2m
      deployments:
        tekton-operator-proxy-webhook:
          spec:
            replicas: 2
            template:
              spec:
                containers:
                  - name: proxy
                    resources:
                      limits:
                        cpu: 500m
                        memory: 500Mi
                      requests:
                        cpu: 100m
                        memory: 100Mi
        tekton-pipelines-webhook:
          spec:
            template:
              spec:
                containers:
                  - name: webhook
                    resources:
                      limits:
                        cpu: "1"
                        memory: 1Gi
                      requests:
                        cpu: 400m
                        memory: 1Gi
        pipelines-console-plugin:
          spec:
            template:
              spec:
                containers:
                  - name: pipelines-console-plugin
                    resources:
                      limits:
                        cpu: 200m
                        memory: 8Mi
                      requests:
                        cpu: 200m
                        memory: 8Mi
        tekton-chains-controller:
          spec:
            template:
              spec:
                containers:
                  - name: tekton-chains-controller
                    resources:
                      limits:
                        cpu: 1500m
                        memory: 8Gi
                      requests:
                        cpu: 1500m
                        memory: 8Gi
        # The events controller is unused by Konflux but requires not-insignificant resources
        # since it watches all PipelineRuns and TaskRuns in the cluster
        # Disabling it saves resources. If Konflux requires CloudEvents for Tekton *Run lifecycle
        # events in the future, the controller can be re-enabled
        tekton-events-controller:
          spec:
            replicas: 0
        tekton-triggers-controller:
          spec:
            template:
              spec:
                containers:
                  - name: tekton-triggers-controller
                    resources:
                      limits:
                        cpu: 400m
                        memory: 64Mi
                      requests:
                        cpu: 400m
                        memory: 64Mi
        tekton-triggers-webhook:
          spec:
            template:
              spec:
                containers:
                  - name: webhook
                    resources:
                      limits:
                        cpu: 250m
                        memory: 50Mi
                      requests:
                        cpu: 250m
                        memory: 50Mi
        tekton-triggers-core-interceptors:
          spec:
            template:
              spec:
                containers:
                  - name: tekton-triggers-core-interceptors
                    resources:
                      limits:
                        cpu: 500m
                        memory: 1Gi
                      requests:
                        cpu: 500m
                        memory: 1Gi
        tkn-cli-serve:
          spec:
            replicas: 0
            template:
              spec:
                containers:
                  - name: tkn-cli-serve
                    resources:
                      limits:
                        cpu: 250m
                        memory: 64Mi
                      requests:
                        cpu: 250m
                        memory: 64Mi
      statefulSets:
        tekton-pipelines-remote-resolvers:
          spec:
            replicas: 4
            template:
              spec:
                containers:
                  - name: controller
                    env:
                      - name: GIT_SSL_CAINFO
                        value: /tekton-custom-certs/ca-bundle.crt
                    resources:
                      limits:
                        memory: 10Gi
                      requests:
                        cpu: "500m"
                        memory: 10Gi
        tekton-pipelines-controller:
          spec:
            template:
              spec:
                containers:
                  - name: tekton-pipelines-controller
                    resources:
                      requests:
                        memory: 16Gi
                        cpu: "1"
                      limits:
                        memory: 16Gi
                topologySpreadConstraints:
                  - maxSkew: 1
                    topologyKey: topology.kubernetes.io/zone
                    whenUnsatisfiable: DoNotSchedule
                    labelSelector:
                      matchLabels:
                        app: tekton-pipelines-controller
      disabled: false
      horizontalPodAutoscalers:
        tekton-operator-proxy-webhook:
          spec:
            maxReplicas: 6
            metrics:
            - resource:
                name: cpu
                target:
                  averageUtilization: 100
                  type: Utilization
              type: Resource
            - resource:
                name: memory
                target:
                  averageUtilization: 100
                  type: Utilization
              type: Resource
            minReplicas: 2
        tekton-pipelines-webhook:
          spec:
            maxReplicas: 6
            metrics:
            - resource:
                name: cpu
                target:
                  averageUtilization: 100
                  type: Utilization
              type: Resource
            - resource:
                name: memory
                target:
                  averageUtilization: 100
                  type: Utilization
              type: Resource
            minReplicas: 6
    performance:
      buckets: 4
      disable-ha: false
      kube-api-burst: 50
      kube-api-qps: 50
      replicas: 4
      threads-per-controller: 32
      statefulset-ordinals: true
  platforms:
    openshift:
      pipelinesAsCode:
        enable: true
        settings:
          enable-cancel-in-progress-on-pull-requests: "true"
          remember-ok-to-test: "false"
          secret-github-app-token-scoped: "false"
          tracing-label-action: pipelines.appstudio.openshift.io/type
          tracing-label-application: appstudio.openshift.io/application
          tracing-label-component: appstudio.openshift.io/component
          # REPLACE THESE PER ENVIRONMENT
          application-name: "Konflux"
          custom-console-name: "Konflux"
          custom-console-url: "https://konflux-ci.dev"
          custom-console-url-namespace: "https://konflux-ci.dev"
          custom-console-url-pr-details: "https://konflux-ci.dev"
          custom-console-url-pr-tasklog: "https://konflux-ci.dev"
        options:
          deployments:
            pipelines-as-code-controller:
              spec:
                template:
                  spec:
                    containers:
                    - env:
                      - name: OTEL_EXPORTER_OTLP_ENDPOINT
                        value: "http://open-telemetry-opentelemetry-collector.konflux-otel.svc.cluster.local:4317"
                      - name: OTEL_TRACES_SAMPLER
                        value: "parentbased_always_on"
                      name: pac-controller
                      resources:
                        limits:
                          cpu: "1"
                          memory: 4Gi
                        requests:
                          cpu: "1"
                          memory: 4Gi
            pipelines-as-code-watcher:
              spec:
                replicas: 2
                template:
                  spec:
                    containers:
                    - env:
                      - name: OTEL_EXPORTER_OTLP_ENDPOINT
                        value: "http://open-telemetry-opentelemetry-collector.konflux-otel.svc.cluster.local:4317"
                      - name: OTEL_TRACES_SAMPLER
                        value: "parentbased_always_on"
                      name: pac-watcher
                      resources:
                        limits:
                          cpu: 250m
                          memory: 1Gi
                        requests:
                          cpu: 250m
                          memory: 1Gi
            pipelines-as-code-webhook:
              spec:
                replicas: 2
                template:
                  spec:
                    containers:
                    - name: pac-webhook
                      resources:
                        limits:
                          cpu: 400m
                          memory: 256Mi
                        requests:
                          cpu: 400m
                          memory: 256Mi
  profile: all
  pruner:
    disabled: false
    keep-since: 80
    resources:
      - pipelinerun
    schedule: '*/30 * * * *'
  result:
    disabled: false
    is_external_db: true
    db_enable_auto_migration: true
    db_port: 5432
    db_secret_name: tekton-results-database
    db_secret_password_key: db.password
    db_secret_user_key: db.user
    db_sslmode: verify-full
    db_sslrootcert: /etc/tls/db/tekton-results-db-ca.pem
    logs_api: true
    logs_type: blob
    options:
      deployments:
        tekton-results-api:
          spec:
            template:
              spec:
                containers:
                - name: api
                  resources:
                    limits:
                      cpu: '3'
                      memory: 1Gi
                    requests:
                      cpu: '1'
                      memory: 500Mi
                  volumeMounts:
                  - name: db-tls-ca
                    mountPath: /etc/tls/db
                    readOnly: true
                  env:
                  - name: LOGGING_PLUGIN_API_URL
                    valueFrom:
                      secretKeyRef:
                        name: tekton-results-s3
                        key: s3_url
                  - name: DB_HOST
                    valueFrom:
                      secretKeyRef:
                        name: tekton-results-database
                        key: db.host
                  - name: DB_NAME
                    valueFrom:
                      secretKeyRef:
                        name: tekton-results-database
                        key: db.name
                  - name: K8S_QPS
                    value: "50"
                  - name: K8S_BURST
                    value: "100"
                  - name: S3_HOSTNAME_IMMUTABLE
                    value: "true"
                  - name: AWS_ACCESS_KEY_ID
                    valueFrom:
                      secretKeyRef:
                        name: tekton-results-s3
                        key: aws_access_key_id
                  - name: AWS_SECRET_ACCESS_KEY
                    valueFrom:
                      secretKeyRef:
                        name: tekton-results-s3
                        key: aws_secret_access_key
                  - name: AWS_REGION
                    valueFrom:
                      secretKeyRef:
                        name: tekton-results-s3
                        key: aws_region
                  - name: S3_BUCKET_NAME
                    valueFrom:
                      secretKeyRef:
                        name: tekton-results-s3
                        key: bucket
                  - name: AWS_ENDPOINT_URL
                    valueFrom:
                      secretKeyRef:
                        name: tekton-results-s3
                        key: endpoint
                - name: kube-rbac-proxy
                  image: "registry.redhat.io/openshift4/ose-kube-rbac-proxy:v4.15"
                  args:
                  - "--secure-listen-address=0.0.0.0:9443"
                  - "--upstream=http://127.0.0.1:9090/"
                  - "--logtostderr=true"
                  - "--v=6"
                  ports:
                  - name: metrics
                    containerPort: 9443
                    protocol: TCP
                  resources:
                    limits:
                      cpu: 500m
                      memory: 128Mi
                    requests:
                      cpu: 5m
                      memory: 64Mi
                volumes:
                  - name: db-tls-ca
                    configMap:
                      name: rds-root-crt
        tekton-results-retention-policy-agent:
          spec:
            replicas: 0
        tekton-results-watcher:
          spec:
            template:
              spec:
                containers:
                - name: watcher
                  args:
                  - "-completed_run_grace_period=5m"
                  - "-requeue_interval=2m"
                  - "-store_deadline=30m"
                  - "-check_owner=false"
                  - "-forward_buffer=1m"
                  - "-threadiness=32"
                  - "-qps=50"
                  - "-burst=50"
                  - "-logs_api=true"
                  - "-disable_storing_incomplete_runs=true"
                  resources:
                    limits:
                      cpu: '3'
                      memory: 8Gi
                    requests:
                      cpu: '1'
                      memory: 8Gi
                - name: kube-rbac-proxy
                  image: "registry.redhat.io/openshift4/ose-kube-rbac-proxy:v4.15"
                  args:
                  - "--secure-listen-address=0.0.0.0:8443"
                  - "--upstream=http://127.0.0.1:9090/"
                  - "--logtostderr=true"
                  - "--v=6"
                  ports:
                  - name: watchermetrics
                    containerPort: 8443
                    protocol: TCP
                  resources:
                    limits:
                      cpu: 500m
                      memory: 128Mi
                    requests:
                      cpu: 5m
                      memory: 64Mi
  targetNamespace: openshift-pipelines
  tektonpruner:
    disabled: true
  trigger:
    options:
      configMaps:
        config-logging-triggers:
          data:
            loglevel.controller: info
            loglevel.eventlistener: info
            loglevel.webhook: info
            zap-logger-config: |
              {
                "level": "info",
                "development": false,
                "sampling": {
                  "initial": 100,
                  "thereafter": 100
                },
                "outputPaths": ["stdout"],
                "errorOutputPaths": ["stderr"],
                "encoding": "json",
                "encoderConfig": {
                  "timeKey": "ts",
                  "levelKey": "level",
                  "nameKey": "logger",
                  "callerKey": "caller",
                  "messageKey": "msg",
                  "stacktraceKey": "stacktrace",
                  "lineEnding": "",
                  "levelEncoder": "",
                  "timeEncoder": "iso8601",
                  "durationEncoder": "string",
                  "callerEncoder": ""
                }
              }
