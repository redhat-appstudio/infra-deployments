apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - base-snapshot
  - pipelines-as-code-es.yaml

patches:
  # TektonConfig updates
  - path: patches/tektonconfig-disable-pruner.yaml
    target:
      kind: TektonConfig
      name: config
  - path: patches/chains-slsa-artifact-format.yaml
    target:
      kind: TektonConfig
      name: config

  # Pipelines Metrics Exporter Deployment
  - target:
      kind: Deployment
      name: pipeline-metrics-exporter
      namespace: openshift-pipelines
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 2Gi
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 1Gi
