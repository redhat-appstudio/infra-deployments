# Removes tekton-results ExternalSecrets:
# tekton-results-database and tekton-results-s3.
#
# Target in kustomization.yaml:
#   name: "tekton-results-.*"
#   group: external-secrets.io
#   kind: ExternalSecret
#
# Note: $patch:delete targets are controlled by the target selector
# in kustomization.yaml, not by the apiVersion/kind/name below.
# Those fields are required by kustomize but unused for matching.
$patch: delete
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: unused
