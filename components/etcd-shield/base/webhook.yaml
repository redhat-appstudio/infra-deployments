apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  annotations:
    cert-manager.io/inject-ca-from: etcd-shield/serving-cert
  name: etcd-shield-validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: etcd-shield
      namespace: etcd-shield
      path: /validate-resource
  failurePolicy: Fail
  name: vpipelineruns.konflux-ci.dev
  rules:
  - apiGroups:
    - tekton.dev
    apiVersions:
    - v1
    operations:
    - CREATE
    resources:
    - pipelineruns
  sideEffects: None
