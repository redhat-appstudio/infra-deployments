destName: etcd-shield-state
destNamespace: etcd-shield
prometheus:
  address: https://prometheus-k8s.openshift-monitoring.svc:9091
  alertName: EtcdShieldDenyAdmission
  config:
    authorization:
      type: Bearer
      credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    tls_config:
      # FIXME: if/when prometheus moves away from service-ca, we'll need to update this as well
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/service-ca.crt
waitTime: 15s
