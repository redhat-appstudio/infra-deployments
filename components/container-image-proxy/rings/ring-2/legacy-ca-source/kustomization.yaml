apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
- target:
    group: trust.cert-manager.io
    version: v1alpha1
    kind: Bundle
    name: caching-ca-bundle
  patch: |-
    - op: add
      path: /spec/sources/-
      value:
        secret:
          name: caching-root-ca-secret
          key: ca.crt
