apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubearchive-operator
rules:
  - apiGroups:
      - ""
    resources:
      - namespaces
    verbs:
      - get
      - list
      - update
      - watch
  - apiGroups:
      - ""
    resources:
      - serviceaccounts
    verbs:
      - create
      - delete
      - get
      - list
      - update
      - watch
  - apiGroups:
      - kubearchive.org
    resources:
      - clusterkubearchiveconfigs
      - clustervacuums
      - kubearchiveconfigs
      - namespacevacuums
      - sinkfilters
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - kubearchive.org
    resources:
      - clusterkubearchiveconfigs/finalizers
      - kubearchiveconfigs/finalizers
      - sinkfilters/finalizers
    verbs:
      - update
  - apiGroups:
      - kubearchive.org
    resources:
      - clusterkubearchiveconfigs/status
      - kubearchiveconfigs/status
      - sinkfilters/status
    verbs:
      - get
      - patch
      - update
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - clusterrolebindings
      - clusterroles
    verbs:
      - bind
      - create
      - delete
      - escalate
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - rolebindings
      - roles
    verbs:
      - bind
      - create
      - delete
      - escalate
      - get
      - list
      - update
      - watch
