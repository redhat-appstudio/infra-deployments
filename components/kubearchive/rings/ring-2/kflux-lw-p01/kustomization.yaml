---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base

namespace: product-kubearchive

configMapGenerator:
  - name: kubearchive-api-url
    options:
      disableNameSuffixHash: true
    literals:
      - URL=https://kubearchive-api-server-product-kubearchive.kflux-lw-p01-23c2640bcea594f87bc757d4116925b2-0000.us-east.containers.appdomain.cloud

patches:
  - path: patches/database-secret-key-patch.yaml
    target:
      kind: ExternalSecret
      name: database-secret
  - path: patches/database-secret-store-patch.yaml
    target:
      kind: ExternalSecret
      name: database-secret
  - path: patches/api-server-rate-limits-patch.yaml
  - path: patches/operator-monitor-all-namespaces-patch.yaml
