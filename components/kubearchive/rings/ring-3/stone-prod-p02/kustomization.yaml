---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base

namespace: product-kubearchive

configMapGenerator:
  - name: kubearchive-api-url
    options:
      disableNameSuffixHash: true
    literals:
      - URL=https://kubearchive-api-server-product-kubearchive.apps.stone-prod-p02.hjvn.p1.openshiftapps.com

patches:
  - path: patches/database-secret-key-patch.yaml
    target:
      kind: ExternalSecret
      name: database-secret
  - path: patches/api-server-rate-limits-patch.yaml
  - path: patches/api-server-service-cert-patch.yaml
  - path: patches/api-server-certificate-secretname-patch.yaml
    target:
      group: cert-manager.io
      version: v1
      kind: Certificate
      name: kubearchive-api-server-certificate
  - path: patches/operator-certificate-secretname-patch.yaml
    target:
      group: cert-manager.io
      version: v1
      kind: Certificate
      name: kubearchive-operator-certificate
  - path: patches/operator-webhooks-service-cert-patch.yaml
  - path: patches/mutating-webhook-inject-cabundle-patch.yaml
  - path: patches/validating-webhook-inject-cabundle-patch.yaml