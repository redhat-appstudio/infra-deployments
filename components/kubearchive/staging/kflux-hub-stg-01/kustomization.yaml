---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
  - database-secret.yaml
  - kubearchive-routes.yaml

namespace: product-kubearchive

configMapGenerator:
    - name: kubearchive-api-url
      options:
        disableNameSuffixHash: true
      literals:
        - URL=https://kubearchive-api-server-product-kubearchive.apps.kflux-hub-stg-01-ac9b3f84c360ccb9d8b9fc0809d652b1-0000.openshiftapps.com

patches:

  - patch: |-
      apiVersion: batch/v1
      kind: CronJob
      metadata:
        name: releases-vacuum
      spec:
        jobTemplate:
          spec:
            template:
              spec:
                containers:
                  - name: vacuum
                    image: quay.io/kubearchive/vacuum:v1.23.0

  - patch: |-
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: kubearchive-schema-migration
        namespace: kubearchive
        annotations:
          # Needed if just the command is changed, otherwise the job needs to be deleted manually
          argocd.argoproj.io/sync-options: Force=true,Replace=true
          argocd.argoproj.io/sync-wave: "-1"
          ignore-check.kube-linter.io/no-read-only-root-fs: >
            "This job needs to clone a repository to do its job, so it needs write access to the FS."
      spec:
        suspend: false
        template:
          spec:
            containers:
              - name: migration
                env:
                  - name: MIGRATION_VERSION
                    valueFrom:
                      configMapKeyRef:
                        name: kubearchive-schema-version
                        key: MIGRATION_VERSION
                  - name: BATCH_SIZE
                    value: "10000"
                securityContext:
                  runAsUser: null
  # Add version suffix to Job name so syncs with unchanged version are a no-op
  # (immutable Job, same name = nothing to do). On upgrade, new name = new Job
  # created, old completed one pruned. Update suffix when changing MIGRATION_VERSION.
  - target:
      kind: Job
      name: kubearchive-schema-migration
    patch: |-
      - op: replace
        path: /metadata/name
        value: kubearchive-schema-migration-v13-v1.23.0

  # We don't need the Secret as it will be created by the ExternalSecrets Operator
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Secret
      metadata:
        name: kubearchive-database-credentials
        namespace: kubearchive
  - patch: |-
      apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      metadata:
        name: database-secret
      spec:
        secretStoreRef:
          name: appsre-stonesoup-vault
        dataFrom:
          - extract:
              key: staging/platform/terraform/generated/kflux-hub-stg-01/kubearchive-database
  # Staging uses the external database provided through the generated secret.
  - patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: postgresql
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: postgresql
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: kubearchive-api-server
        namespace: kubearchive
      spec:
        template:
          spec:
            volumes:
              - name: db-ca-cert
                secret:
                  secretName: kubearchive-database-credentials
                  items:
                    - key: DATABASE_CA_CERT
                      path: ca.crt
            containers:
              - name: kubearchive-api-server
                volumeMounts:
                  - name: db-ca-cert
                    mountPath: /etc/ssl/certs/db-ca.crt
                    subPath: ca.crt
                    readOnly: true
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: kubearchive-sink
        namespace: kubearchive
      spec:
        template:
          spec:
            volumes:
              - name: db-ca-cert
                secret:
                  secretName: kubearchive-database-credentials
                  items:
                    - key: DATABASE_CA_CERT
                      path: ca.crt
            containers:
              - name: kubearchive-sink
                volumeMounts:
                  - name: db-ca-cert
                    mountPath: /etc/ssl/certs/db-ca.crt
                    subPath: ca.crt
                    readOnly: true
  - patch: |-
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: kubearchive-schema-migration
        namespace: kubearchive
      spec:
        template:
          spec:
            volumes:
              - name: db-ca-cert
                secret:
                  secretName: kubearchive-database-credentials
                  items:
                    - key: DATABASE_CA_CERT
                      path: ca.crt
            containers:
              - name: migration
                volumeMounts:
                  - name: db-ca-cert
                    mountPath: /etc/ssl/certs/db-ca.crt
                    subPath: ca.crt
                    readOnly: true
  # These patches add an annotation so an OpenShift service
  # creates the TLS secrets instead of Cert Manager
  - patch: |-
      apiVersion: v1
      kind: Service
      metadata:
        name: kubearchive-api-server
        namespace: kubearchive
        annotations:
          service.beta.openshift.io/serving-cert-secret-name: kubearchive-api-server-tls
  - patch: |-
      apiVersion: v1
      kind: Service
      metadata:
        name: kubearchive-operator-webhooks
        namespace: kubearchive
        annotations:
          service.beta.openshift.io/serving-cert-secret-name: kubearchive-operator-tls
  - patch: |-
      apiVersion: admissionregistration.k8s.io/v1
      kind: MutatingWebhookConfiguration
      metadata:
        name: kubearchive-mutating-webhook-configuration
        annotations:
          service.beta.openshift.io/inject-cabundle: "true"
  - patch: |-
      apiVersion: admissionregistration.k8s.io/v1
      kind: ValidatingWebhookConfiguration
      metadata:
        name: kubearchive-validating-webhook-configuration
        annotations:
          service.beta.openshift.io/inject-cabundle: "true"
  # These patches solve Kube Linter problems
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: kubearchive-api-server
        namespace: kubearchive
      spec:
        replicas: 2
        template:
          spec:
            affinity:
              podAntiAffinity:
                preferredDuringSchedulingIgnoredDuringExecution:
                  - weight: 50
                    podAffinityTerm:
                      labelSelector:
                        matchLabels:
                          app: kubearchive-api-server
                      topologyKey: kubernetes.io/hostname
            containers:
              - name: kubearchive-api-server
                env:
                - name: KUBEARCHIVE_OTEL_MODE
                  value: enabled
                - name: OTEL_EXPORTER_OTLP_ENDPOINT
                  value: http://otel-collector:4318
                - name: AUTH_IMPERSONATE
                  value: "true"
                - name: MIGRATION_VERSION
                  valueFrom:
                    configMapKeyRef:
                      name: kubearchive-deployment-schema-version
                      key: MIGRATION_VERSION
                securityContext:
                  readOnlyRootFilesystem: true
                  runAsNonRoot: true
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: kubearchive-operator
        namespace: kubearchive
      spec:
        template:
          spec:
            securityContext:
              runAsUser: null
            containers:
              - name: manager
                args: [--health-probe-bind-address=:8081]
                env:
                - name: GOMEMLIMIT
                  value: 10GiB
                  valueFrom: null # required because valueFrom comes from the original
                - name: KUBEARCHIVE_MONITOR_ALL_NAMESPACES
                  value: "true"
                - name: KUBEARCHIVE_OTEL_MODE
                  value: enabled
                - name: OTEL_EXPORTER_OTLP_ENDPOINT
                  value: http://otel-collector:4318
                securityContext:
                  readOnlyRootFilesystem: true
                  runAsNonRoot: true
                ports:
                  - containerPort: 8081
                resources:
                  limits:
                    cpu: 1
                    memory: 15Gi
                  requests:
                    cpu: 1
                    memory: 15Gi

  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: kubearchive-sink
        namespace: kubearchive
      spec:
        template:
          spec:
            containers:
              - name: kubearchive-sink
                env:
                - name: KUBEARCHIVE_OTEL_MODE
                  value: enabled
                - name: OTEL_EXPORTER_OTLP_ENDPOINT
                  value: http://otel-collector:4318
                - name: MIGRATION_VERSION
                  valueFrom:
                    configMapKeyRef:
                      name: kubearchive-deployment-schema-version
                      key: MIGRATION_VERSION
                securityContext:
                  readOnlyRootFilesystem: true
                  runAsNonRoot: true
                resources:
                  limits:
                    cpu: 200m
                    memory: 128Mi
                  requests:
                    cpu: 200m
                    memory: 128Mi

  # These patches remove Certificates and Issuer from Cert-Manager
  - patch: |-
      $patch: delete
      apiVersion: cert-manager.io/v1
      kind: Certificate
      metadata:
        name: "kubearchive-api-server-certificate"
        namespace: kubearchive
  - patch: |-
      $patch: delete
      apiVersion: cert-manager.io/v1
      kind: Certificate
      metadata:
        name: "kubearchive-ca"
        namespace: kubearchive
  - patch: |-
      $patch: delete
      apiVersion: cert-manager.io/v1
      kind: Issuer
      metadata:
        name: "kubearchive-ca"
        namespace: kubearchive
  - patch: |-
      $patch: delete
      apiVersion: cert-manager.io/v1
      kind: Issuer
      metadata:
        name: "kubearchive"
        namespace: kubearchive
  - patch: |-
      $patch: delete
      apiVersion: cert-manager.io/v1
      kind: Certificate
      metadata:
        name: "kubearchive-operator-certificate"
        namespace: kubearchive
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: otel-collector
        labels:
          app: otel-collector
      spec:
        template:
          spec:
            containers:
              - name: otel-collector
                image: quay.io/kubearchive/opentelemetry-collector@sha256:30619e2a6e7ec84debb478a60ffecdcf493a68d8206120c4a4b01b83f31ea3e4
