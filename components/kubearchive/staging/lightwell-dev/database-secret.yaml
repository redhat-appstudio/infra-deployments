---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: database-secret
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "-2"
spec:
  dataFrom:
    - extract:
        key: staging/platform/terraform/generated/lightwell-dev/kubearchive-database
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: appsre-stonesoup-vault
  target:
    creationPolicy: Owner
    deletionPolicy: Delete
    name: kubearchive-database-credentials
    template:
      data:
        DATABASE_KIND: postgresql
        DATABASE_PORT: "5432"
        DATABASE_URL: '{{ index . "db.host" }}'
        DATABASE_PASSWORD: '{{ index . "db.password" }}'
        DATABASE_USER: '{{ index . "db.user" }}'
        DATABASE_DB: '{{ index . "db.name" }}'
        DATABASE_CA_CERT: '{{ index . "db.ca_cert" | b64dec }}'
        PGSSLMODE: verify-full
        PGSSLROOTCERT: /etc/ssl/certs/db-ca.crt
