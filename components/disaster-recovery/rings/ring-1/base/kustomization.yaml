apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: konflux-disaster-recovery
resources:
  - base-snapshot
  - cronjob.yaml
  - event_listener.yaml
  - localqueue.yaml
  - networkpolicy_allow_el_from_ns.yaml
  - rbac-pipeline.yaml
  - rbac-triggers.yaml
  - triggerbinding.yaml
  - triggertemplate.yaml

images:
  - name: quay.io/konflux-ci/tools
    newName: quay.io/konflux-ci/tools
    digest: sha256:b846eb68ab06f4c61c987bd1053e0e2dda13e18ecd5a75c945a18f7d78743bd8

patches:
  - path: patch_cronjob_suspend.yaml
    target:
      kind: CronJob
      name: run-disaster-recovery-pipelinerun
      group: batch
      version: v1
      namespace: konflux-disaster-recovery
