apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base

patches:
  - path: patches/database-secret-path-patch.yaml
    target:
      name: database-secret
      group: external-secrets.io
      version: v1
      kind: ExternalSecret
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Secret
      metadata:
        name: kite-database-credentials
        namespace: konflux-kite

configMapGenerator:
  - name: kite-config
    namespace: konflux-kite
    literals:
      - KITE_PROJECT_ENV=staging
      - KITE_DB_SSL_MODE=require
      - KITE_LOG_LEVEL=info
      - KITE_LOG_FORMAT=json
      - KITE_FEATURE_NAMESPACE_CHECKING=true
      - AUTH_IMPERSONATE=true
    behavior: merge
