apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - base-snapshot
  - cert-manager
  - external-secrets

namespace: konflux-kite

images:
  - name: quay.io/konflux-ci/kite-prod
    newTag: a2b99c1c998be3809ceab810849ac1860cc2bb45
  - name: quay.io/konflux-ci/kite-init
    newTag: a2b99c1c998be3809ceab810849ac1860cc2bb45

configMapGenerator:
  - name: kite-config
    namespace: konflux-kite
    literals:
      - KITE_PROJECT_ENV=staging
      - KITE_DB_SSL_MODE=require
      - KITE_LOG_LEVEL=info
      - KITE_LOG_FORMAT=json
      - KITE_FEATURE_NAMESPACE_CHECKING=true
      - AUTH_IMPERSONATE=true
    behavior: merge
