apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
- pairs:
    paas.redhat.com/appcode: MINT-001
resources:
  - ../base
  - plrs-resource-quota.yaml
  - https://github.com/konflux-ci/mintmaker/config/default?ref=cd2aa6f7586afd235602d9469aa2620e21212e1a
  - https://github.com/konflux-ci/mintmaker/config/renovate?ref=cd2aa6f7586afd235602d9469aa2620e21212e1a

images:
  - name: quay.io/konflux-ci/mintmaker
    newName: quay.io/konflux-ci/mintmaker
    newTag: cd2aa6f7586afd235602d9469aa2620e21212e1a
  - name: quay.io/konflux-ci/mintmaker-renovate-image
    newName: quay.io/konflux-ci/mintmaker-renovate-image
    newTag: latest
  - name: quay.io/konflux-ci/mintmaker-schedule-calculator
    newName: quay.io/konflux-ci/mintmaker-schedule-calculator
    newTag: dcda93c47b269d9b250ef62b0bd2e2e2f18aea6f

namespace: mintmaker

commonAnnotations:
  argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true

configurations:
- kustomizeconfig.yaml

components:
  - ../components/rh-certs
