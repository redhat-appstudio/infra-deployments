apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
- pairs:
    paas.redhat.com/appcode: MINT-001
resources:
- ../../base
- ../../base/external-secrets
- ../blackbox
- plrs-resource-quota.yaml
- https://github.com/konflux-ci/mintmaker/config/default?ref=d2f38f80cafd75523412a170445ae29fedef9747
- https://github.com/konflux-ci/mintmaker/config/renovate?ref=d2f38f80cafd75523412a170445ae29fedef9747

namespace: mintmaker

images:
- name: quay.io/konflux-ci/mintmaker
  newName: quay.io/konflux-ci/mintmaker
  newTag: d2f38f80cafd75523412a170445ae29fedef9747
- name: quay.io/konflux-ci/mintmaker-renovate-image
  newName: quay.io/konflux-ci/mintmaker-renovate-image
  newTag: b57276ca555be5f0057977c7d22de3e698eeddb1
- name: quay.io/konflux-ci/mintmaker-schedule-calculator
  newName: quay.io/konflux-ci/mintmaker-schedule-calculator
  newTag: dcda93c47b269d9b250ef62b0bd2e2e2f18aea6f

commonAnnotations:
  argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true

configMapGenerator:
  - name: controller-config
    files:
    - config.json

patches:
  - path: manager-mount-config-patch.yaml
  - path: manager-set-resources-patch.yaml
  - path: manager-enable-pprof-patch.yaml

configurations:
- kustomizeconfig.yaml

components:
  - ../../components/rh-certs
