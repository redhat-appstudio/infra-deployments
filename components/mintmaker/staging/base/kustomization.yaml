apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
- pairs:
    paas.redhat.com/appcode: MINT-001
resources:
- ../../base
- ../../base/external-secrets
- ../blackbox
- plrs-resource-quota.yaml
- https://github.com/konflux-ci/mintmaker/config/default?ref=14c4e409ef3faf8d0dc505e7636e4fe718d06109
- https://github.com/konflux-ci/mintmaker/config/renovate?ref=14c4e409ef3faf8d0dc505e7636e4fe718d06109

namespace: mintmaker

images:
- name: quay.io/konflux-ci/mintmaker
  newName: quay.io/konflux-ci/mintmaker
  newTag: 14c4e409ef3faf8d0dc505e7636e4fe718d06109
- name: quay.io/konflux-ci/mintmaker-renovate-image
  newName: quay.io/konflux-ci/mintmaker-renovate-image
  newTag: bab7f6da3c2178e3d8e3446b4cdd8ca8e5a9a3a1
- name: quay.io/konflux-ci/mintmaker-schedule-calculator
  newName: quay.io/konflux-ci/mintmaker-schedule-calculator
  newTag: dcda93c47b269d9b250ef62b0bd2e2e2f18aea6f

commonAnnotations:
  argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true

configMapGenerator:
  - name: controller-config
    files:
    - config.json

patches:
  - path: manager-mount-config-patch.yaml
  - path: manager-set-resources-patch.yaml
  - path: manager-enable-pprof-patch.yaml
  - path: patch_create-dependency-update-check_apiversion.yaml
  - path: patch_delete-dependency-update-checks_annotation.yaml

configurations:
- kustomizeconfig.yaml

components:
  - ../../components/rh-certs
