apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
- pairs:
    paas.redhat.com/appcode: MINT-001
resources:
- base-snapshot
- base-snapshot/external-secrets
- blackbox
- mintmaker-plrs-rq.yaml
- https://github.com/konflux-ci/mintmaker/config/default?ref=267f3d776735acd1b5add00eb936aa062023bce1
- https://github.com/konflux-ci/mintmaker/config/renovate?ref=267f3d776735acd1b5add00eb936aa062023bce1
namespace: mintmaker
images:
- name: quay.io/konflux-ci/mintmaker
  newName: quay.io/konflux-ci/mintmaker
  newTag: 267f3d776735acd1b5add00eb936aa062023bce1
- name: quay.io/konflux-ci/mintmaker-renovate-image
  newName: quay.io/konflux-ci/mintmaker-renovate-image
  newTag: 4a0e3373d14ff48ffd379b6be25ea419f4e89c7c
- name: quay.io/konflux-ci/mintmaker-schedule-calculator
  newName: quay.io/konflux-ci/mintmaker-schedule-calculator
  newTag: fae174000b799749e1a1725c08e1f5e6f6a805a1
- name: quay.io/openshift/origin-cli
  newName: quay.io/openshift/origin-cli
  newTag: 4.22.0
commonAnnotations:
  argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
configMapGenerator:
- name: controller-config
  files:
  - config.json
patches:
- path: patches/manager-mount-config-patch.yaml
- path: patches/manager-set-resources-patch.yaml
- path: patches/manager-enable-pprof-patch.yaml
configurations:
- kustomizeconfig.yaml
components:
- ../../../components/rh-certs
