apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
- pairs:
    paas.redhat.com/appcode: MINT-001
resources:
- base-snapshot
- base-snapshot/external-secrets
- blackbox
- mintmaker-plrs-rq.yaml
- https://github.com/konflux-ci/mintmaker/config/default?ref=dba2d93a6bee126b090e3acc452362f797a399f8
- https://github.com/konflux-ci/mintmaker/config/renovate?ref=dba2d93a6bee126b090e3acc452362f797a399f8
namespace: mintmaker
images:
- name: quay.io/konflux-ci/mintmaker
  newName: quay.io/konflux-ci/mintmaker
  newTag: dba2d93a6bee126b090e3acc452362f797a399f8
- name: quay.io/konflux-ci/mintmaker-renovate-image
  newName: quay.io/konflux-ci/mintmaker-renovate-image
  newTag: 5abafcc53cd357a7683cbfc58777e8997569bece
- name: quay.io/konflux-ci/mintmaker-schedule-calculator
  newName: quay.io/konflux-ci/mintmaker-schedule-calculator
  newTag: b8be72b576e018711bd3319e87ce518dffaf0671
- name: quay.io/openshift/origin-cli
  newName: quay.io/openshift/origin-cli
  newTag: 4.22.0
commonAnnotations:
  argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
configMapGenerator:
- name: controller-config
  files:
  - config.json
patches:
- path: patches/manager-mount-config-patch.yaml
- path: patches/manager-set-resources-patch.yaml
- path: patches/manager-enable-pprof-patch.yaml
configurations:
- kustomizeconfig.yaml
components:
- ../../../components/rh-certs
