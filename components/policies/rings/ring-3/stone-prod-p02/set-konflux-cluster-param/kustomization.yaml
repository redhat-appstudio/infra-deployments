apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../../base/repository/set-konflux-cluster-param

patches:
  - target:
      group: kyverno.io
      version: v1
      kind: ClusterPolicy
      name: set-konflux-cluster-param
    patch: |-
      - op: replace
        path: /spec/rules/0/mutate/patchStrategicMerge/spec/params/0/value
        value: stone-prod-p02
