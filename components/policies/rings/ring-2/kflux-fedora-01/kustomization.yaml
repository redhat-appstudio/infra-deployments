apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../base
- kueue

patches:
- path: delete-cost-management-policies.yaml
- patch: |-
    $patch: delete
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: deny-unallowed-annotations
      namespace: tekton-kueue
