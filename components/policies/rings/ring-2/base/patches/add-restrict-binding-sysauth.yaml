apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
  labels:
    rbac.kyverno.io/aggregate-to-admission-controller: "true"
  name: konflux-rbac-kyverno-admission:restrict-binding-sysauth
rules:
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - rolebindings
  verbs:
  - list
  - get
  - watch
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
    policies.kyverno.io/category: Security
    policies.kyverno.io/description: We don't want users to bind system:authenticated
      group with any role except for the konflux-viewer-user-actions ClusterRole.
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: RoleBinding, RBAC
    policies.kyverno.io/title: Restrict Binding System Groups
  name: konflux-rbac-validate-restrict-binding-sysauth
spec:
  rules:
  - exclude:
      any:
      - resources:
          namespaces:
          - rhtap-releng-tenant
    match:
      any:
      - resources:
          kinds:
          - RoleBinding
          namespaceSelector:
            matchLabels:
              konflux-ci.dev/type: tenant
          operations:
          - CREATE
          - UPDATE
    name: restrict-authenticated
    preconditions:
      all:
      - key: '{{ request.object.subjects[].name }}'
        operator: AnyIn
        value: system:authenticated
      - key: '{{ request.object.roleRef.kind }}'
        operator: Equals
        value: ClusterRole
      - key: '{{ request.object.roleRef.name }}'
        operator: NotEquals
        value: konflux-viewer-user-actions
    skipBackgroundRequests: true
    validate:
      allowExistingViolations: true
      deny: {}
      failureAction: Enforce
      message: Only ClusterRole konflux-viewer-user-actions can be bound to system:authenticated.
