apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: restrict-art-token-broker-bindings.konflux-ci.dev
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - rbac.authorization.k8s.io
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - rolebindings
      scope: Namespaced
  variables:
  - name: bindsArtTokenBrokerServiceAccount
    expression: |
      has(object.subjects) &&
      object.subjects.exists(subject,
        subject.kind == 'ServiceAccount' &&
        (!has(subject.apiGroup) || subject.apiGroup == '') &&
        has(subject.name) && subject.name == 'art-token-broker' &&
        has(subject.namespace) && subject.namespace == 'art-token-broker')
  - name: usesArtTokenBrokerClusterRole
    expression: |
      has(object.roleRef) &&
      object.roleRef.kind == 'ClusterRole' &&
      has(object.roleRef.name) &&
      object.roleRef.name == 'konflux-art-token-broker-actions'
  - name: bindsArtTokenBrokerIdentityAlias
    expression: |
      has(object.subjects) &&
      object.subjects.exists(subject,
        (subject.kind == 'ServiceAccount' &&
          (!has(subject.apiGroup) || subject.apiGroup == '') &&
          has(subject.name) && subject.name == 'art-token-broker' &&
          !has(subject.namespace) &&
          object.metadata.namespace == 'art-token-broker') ||
        (subject.kind == 'User' &&
          has(subject.name) &&
          subject.name == 'system:serviceaccount:art-token-broker:art-token-broker') ||
        (subject.kind == 'Group' && has(subject.name) &&
          subject.name == 'system:serviceaccounts:art-token-broker'))
  - name: isExactArtTokenBrokerBinding
    expression: |
      variables.bindsArtTokenBrokerServiceAccount &&
      variables.usesArtTokenBrokerClusterRole &&
      object.subjects.size() == 1
  - name: isApprovedArtNamespace
    expression: |
      object.metadata.namespace in [
        'art-acm-tenant',
        'art-coo-tenant',
        'art-installer-agent-tenant',
        'art-kueue-tenant',
        'art-logging-tenant',
        'art-mta-tenant',
        'art-mtc-tenant',
        'art-oadp-tenant',
        'art-oap-tenant',
        'art-pipelines-tenant',
        'art-quay-tenant',
        'art-rhosdt-tenant'
      ]
  validations:
  - expression: |
      !variables.bindsArtTokenBrokerServiceAccount ||
      variables.isExactArtTokenBrokerBinding
    reason: Invalid
    message: >-
      art-token-broker may only be bound to
      konflux-art-token-broker-actions as its sole RoleBinding subject.
  - expression: '!variables.bindsArtTokenBrokerIdentityAlias'
    reason: Invalid
    message: >-
      The ART token broker identity must be represented only as the explicit
      ServiceAccount subject in an approved RoleBinding.
  - expression: |
      !variables.usesArtTokenBrokerClusterRole ||
      variables.isExactArtTokenBrokerBinding
    reason: Invalid
    message: >-
      konflux-art-token-broker-actions may only be bound to
      ServiceAccount art-token-broker in namespace art-token-broker.
  - expression: |
      !variables.isExactArtTokenBrokerBinding ||
      variables.isApprovedArtNamespace
    reason: Invalid
    message: >-
      konflux-art-token-broker-actions may only be bound in approved ART
      namespaces.
