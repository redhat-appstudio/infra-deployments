# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: add-cluster-param-when-params-missing
  labels:
    test: add-cluster-param-when-params-missing
spec:
  concurrent: false
  description: |
    Creating a Repository without spec.params in the policy namespace adds
    konflux_cluster=stone-stg-rh01.
  steps:
    - name: given-crd-rbac-and-policy
      try:
        - apply:
            file: resources/repository-crd.yaml
        - apply:
            file: ../../clusterrole.yaml
        - apply:
            file: ../rolebinding.yaml
        - apply:
            file: ../inject-repository-cluster-param-nmp.yaml
        - assert:
            file: chainsaw-assert-namespacedmutatingpolicy.yaml
    - name: when-repository-without-params-is-created
      try:
        - create:
            file: resources/repository-no-params.yaml
        - assert:
            file: resources/expected-repository-no-params.yaml
---
