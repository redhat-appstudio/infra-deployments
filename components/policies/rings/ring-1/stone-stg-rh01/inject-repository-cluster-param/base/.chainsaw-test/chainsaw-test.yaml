apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: mutate-existing-repository
  labels:
    test: mutate-existing-repository
spec:
  concurrent: false
  description: |
    An existing Repository in the policy namespace without a konflux_cluster param is
    mutated after the NamespacedMutatingPolicy is applied.
  steps:
    - name: given-crd
      try:
        - apply:
            file: resources/repository-crd.yaml
        - assert:
            file: resources/repository-crd.yaml
    - name: given-repository-exists-without-cluster-param
      try:
        - create:
            file: resources/repository-no-params.yaml
    - name: when-rbac-and-policy-are-applied
      try:
        - apply:
            file: ../../clusterrole.yaml
        - apply:
            file: ../rolebinding.yaml
        - apply:
            file: ../inject-repository-cluster-param-nmp.yaml
        - assert:
            file: chainsaw-assert-namespacedmutatingpolicy.yaml
    - name: then-existing-repository-is-mutated
      try:
        - assert:
            file: resources/expected-repository-no-params.yaml
---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: noop-existing-outside-policy-namespace
  labels:
    test: noop-existing-outside-policy-namespace
spec:
  concurrent: false
  description: |
    An existing Repository outside the policy namespace is not changed after the
    NamespacedMutatingPolicy is applied.
  steps:
    - name: given-crd-and-other-namespace
      try:
        - apply:
            file: resources/repository-crd.yaml
        - apply:
            file: resources/namespace-other-tenant.yaml
    - name: given-repository-exists-in-other-namespace
      try:
        - create:
            file: resources/repository-other-namespace.yaml
    - name: when-rbac-and-policy-are-applied
      try:
        - apply:
            file: ../../clusterrole.yaml
        - apply:
            file: ../rolebinding.yaml
        - apply:
            file: ../inject-repository-cluster-param-nmp.yaml
        - assert:
            file: chainsaw-assert-namespacedmutatingpolicy.yaml
    - name: then-existing-repository-is-unchanged
      try:
        - assert:
            file: resources/expected-repository-other-namespace.yaml
        - sleep:
            duration: 5s
        - assert:
            file: resources/expected-repository-other-namespace.yaml
