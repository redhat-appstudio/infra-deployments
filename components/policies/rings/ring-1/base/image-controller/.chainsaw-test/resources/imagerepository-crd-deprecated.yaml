apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: imagerepositories.appstudio.redhat.com
spec:
  group: appstudio.redhat.com
  names:
    kind: ImageRepository
    listKind: ImageRepositoryList
    plural: imagerepositories
    singular: imagerepository
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              image:
                type: object
                properties:
                  name:
                    type: string
                  visibility:
                    type: string
              notifications:
                type: array
                items:
                  type: object
                  properties:
                    title:
                      type: string
                    event:
                      type: string
                    method:
                      type: string
                    config:
                      type: object
                      properties:
                        url:
                          type: string
