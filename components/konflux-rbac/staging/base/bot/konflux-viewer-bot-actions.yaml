apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: konflux-viewer-bot-actions
rules:
- apiGroups:
  - tekton.dev
  resources:
  - pipelineruns
  - taskruns
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - pods/log
  verbs:
  - get
- apiGroups:
  - appstudio.redhat.com
  resources:
  - applications
  - components
  - componentgroups
  - enterprisecontractpolicies
  - imagerepositories
  - integrationtestscenarios
  - releases
  - releaseplans
  - releaseplanadmissions
  - snapshots
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - konflux-ci.dev
  resources:
  - components
  - componentgroups
  - imagerepositories
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - pipelinesascode.tekton.dev
  resources:
  - repositories
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - results.tekton.dev
  resources:
  - logs
  - records
  - results
  # No watch: results.tekton.dev is a virtual API group served by the Tekton
  # Results API server, which only ever issues SubjectAccessReviews for
  # create/get/list/delete/update. A watch verb here is never evaluated, but it
  # does break RoleBinding creation for namespace admins, whose role does not
  # hold it. Keep this set a subset of konflux-admin-user-actions.
  verbs:
  - get
  - list
