apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: konflux-managed-releaser-bot-actions
rules:
- apiGroups:
  - appstudio.redhat.com
  resources:
  - imagerepositories
  - releaseplanadmissions
  - enterprisecontractpolicies
  verbs:
  - get
  - create
  - patch
- apiGroups:
  - konflux-ci.dev
  resources:
  - imagerepositories
  verbs:
  - get
  - create
  - patch
