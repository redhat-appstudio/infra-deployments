  - list
  - watch
- apiGroups:
  - konflux-ci.dev
  resources:
  - components
  - componentgroups
  - imagerepositories
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - pipelinesascode.tekton.dev
  resources:
  - repositories
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - results.tekton.dev
