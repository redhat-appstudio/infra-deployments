apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: pulpaccessrequests.pulp.konflux-ci.dev
spec:
  group: pulp.konflux-ci.dev
  scope: Namespaced
  names:
    plural: pulpaccessrequests
    singular: pulpaccessrequest
    kind: PulpAccessRequest
    shortNames:
      - par
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                credentialsSecretName:
                  type: string
                  description: |
                    Name of the secret containing authentication credentials.
                    Required when create_service_account is false. Supports certificate-based
                    (mTLS) or Basic Auth credentials.
                create_service_account:
                  type: boolean
                  description: |
                    Create a TBR service account via the container-registry-authorizer API.
                    Defaults to true when credentialsSecretName is omitted.
                group_name:
                  type: string
                  description: Optional Pulp group name to associate with the created domain
                use_quay_backend:
                  type: boolean
                  description: "Whether to configure Quay as the OCI backend storage for the domain (optional, defaults to false)"
            status:
              type: object
              properties:
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                secretName:
                  type: string
                  description: "Name of the generated secret"
                domain:
                  type: string
                  description: "The Pulp domain name (konflux-<namespace>[-<suffix>], assigned once and never changed)"
                domainCreated:
                  type: boolean
                  description: "Whether the Pulp domain was created"
                imageRepositoryCreated:
                  type: boolean
                  description: "Whether the ImageRepository was created"
                quayBackendConfigured:
                  type: boolean
                  description: "Whether Quay backend storage was configured"
                serviceAccountCreated:
                  type: boolean
                  description: "Whether the TBR service account was created"
                serviceAccountName:
                  type: string
                  description: "The TBR service account name (matches the Pulp domain name)"
