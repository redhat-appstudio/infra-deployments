apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: multi-platform-controller-metrics-monitor
spec:
  endpoints:
  - path: /metrics
    interval: 15s
    port: https
    scheme: https
    bearerTokenSecret:
      name: "metrics-reader"
      key: token
    tlsConfig:
      insecureSkipVerify: true
  selector:
    matchLabels:
      control-plane: controller-manager
