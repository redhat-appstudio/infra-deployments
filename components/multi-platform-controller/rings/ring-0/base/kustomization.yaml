apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: multi-platform-controller
resources:
- base-snapshot
- https://github.com/konflux-ci/multi-platform-controller/deploy/operator?ref=eaf491f4d47556a10b2f2600909415cdd80450cd
- https://github.com/konflux-ci/multi-platform-controller/deploy/otp?ref=eaf491f4d47556a10b2f2600909415cdd80450cd
- host-config-cm.yaml
images:
- name: multi-platform-controller
  newName: quay.io/konflux-ci/multi-platform-controller
  newTag: eaf491f4d47556a10b2f2600909415cdd80450cd
- name: multi-platform-otp-server
  newName: quay.io/konflux-ci/multi-platform-controller-otp-service
  newTag: eaf491f4d47556a10b2f2600909415cdd80450cd
patches:
- path: patches/logs-in-console-format-cmd-arg-patch.yaml
  target:
    group: apps
    version: v1
    kind: Deployment
    name: multi-platform-controller
