apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: multi-platform-controller
resources:
- base-snapshot
- https://github.com/konflux-ci/multi-platform-controller/deploy/operator?ref=b4a33e4b20fccd660fe62535f846756018beebaa
- https://github.com/konflux-ci/multi-platform-controller/deploy/otp?ref=b4a33e4b20fccd660fe62535f846756018beebaa
- host-config-cm.yaml
images:
- name: multi-platform-controller
  newName: quay.io/konflux-ci/multi-platform-controller
  newTag: b4a33e4b20fccd660fe62535f846756018beebaa
- name: multi-platform-otp-server
  newName: quay.io/konflux-ci/multi-platform-controller-otp-service
  newTag: b4a33e4b20fccd660fe62535f846756018beebaa
patches:
- path: patches/logs-in-console-format-cmd-arg-patch.yaml
  target:
    group: apps
    version: v1
    kind: Deployment
    name: multi-platform-controller
