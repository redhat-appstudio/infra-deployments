apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: multi-platform-controller
resources:
- base-snapshot
- https://github.com/konflux-ci/multi-platform-controller/deploy/operator?ref=113f847b4adafa92d30d61c088c39c53dd8188a2
- https://github.com/konflux-ci/multi-platform-controller/deploy/otp?ref=113f847b4adafa92d30d61c088c39c53dd8188a2
- host-config-cm.yaml
images:
- name: multi-platform-controller
  newName: quay.io/konflux-ci/multi-platform-controller
  newTag: 113f847b4adafa92d30d61c088c39c53dd8188a2
- name: multi-platform-otp-server
  newName: quay.io/konflux-ci/multi-platform-controller-otp-service
  newTag: 113f847b4adafa92d30d61c088c39c53dd8188a2
patches:
- path: patches/logs-in-console-format-cmd-arg-patch.yaml
  target:
    group: apps
    version: v1
    kind: Deployment
    name: multi-platform-controller
