apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: multi-platform-controller
resources:
- base-snapshot
- https://github.com/konflux-ci/multi-platform-controller/deploy/operator?ref=dc9c6dff0a89cb4870f634022d3cd328f3885b9b
- https://github.com/konflux-ci/multi-platform-controller/deploy/otp?ref=dc9c6dff0a89cb4870f634022d3cd328f3885b9b
- host-config-cm.yaml
images:
- name: multi-platform-controller
  newName: quay.io/konflux-ci/multi-platform-controller
  newTag: dc9c6dff0a89cb4870f634022d3cd328f3885b9b
- name: multi-platform-otp-server
  newName: quay.io/konflux-ci/multi-platform-controller-otp-service
  newTag: dc9c6dff0a89cb4870f634022d3cd328f3885b9b
patches:
- path: patches/logs-in-console-format-cmd-arg-patch.yaml
  target:
    group: apps
    version: v1
    kind: Deployment
    name: multi-platform-controller
