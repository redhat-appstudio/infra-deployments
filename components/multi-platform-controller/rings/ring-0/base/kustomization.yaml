apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: multi-platform-controller
resources:
- base-snapshot
- https://github.com/konflux-ci/multi-platform-controller/deploy/operator?ref=1be2d9874eef8811a3b51bdcafab59bad1b97068
- https://github.com/konflux-ci/multi-platform-controller/deploy/otp?ref=1be2d9874eef8811a3b51bdcafab59bad1b97068
- host-config-cm.yaml
images:
- name: multi-platform-controller
  newName: quay.io/konflux-ci/multi-platform-controller
  newTag: 1be2d9874eef8811a3b51bdcafab59bad1b97068
- name: multi-platform-otp-server
  newName: quay.io/konflux-ci/multi-platform-controller-otp-service
  newTag: 1be2d9874eef8811a3b51bdcafab59bad1b97068
patches:
- path: patches/logs-in-console-format-cmd-arg-patch.yaml
  target:
    group: apps
    version: v1
    kind: Deployment
    name: multi-platform-controller
