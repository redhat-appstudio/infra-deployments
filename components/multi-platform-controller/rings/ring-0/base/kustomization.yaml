apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: multi-platform-controller
resources:
- base-snapshot
- https://github.com/konflux-ci/multi-platform-controller/deploy/operator?ref=8370ca6c28a023951594cb5a5a51e3aa8f9aa7b0
- https://github.com/konflux-ci/multi-platform-controller/deploy/otp?ref=8370ca6c28a023951594cb5a5a51e3aa8f9aa7b0
- host-config-cm.yaml
images:
- name: multi-platform-controller
  newName: quay.io/konflux-ci/multi-platform-controller
  newTag: 8370ca6c28a023951594cb5a5a51e3aa8f9aa7b0
- name: multi-platform-otp-server
  newName: quay.io/konflux-ci/multi-platform-controller-otp-service
  newTag: 8370ca6c28a023951594cb5a5a51e3aa8f9aa7b0
patches:
- path: patches/logs-in-console-format-cmd-arg-patch.yaml
  target:
    group: apps
    version: v1
    kind: Deployment
    name: multi-platform-controller
