apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: multi-platform-controller
resources:
- base-snapshot
- https://github.com/konflux-ci/multi-platform-controller/deploy/operator?ref=847104d7315beb482db01ff8d5182ba7c8fbb340
- https://github.com/konflux-ci/multi-platform-controller/deploy/otp?ref=847104d7315beb482db01ff8d5182ba7c8fbb340
- host-config-cm.yaml
images:
- name: multi-platform-controller
  newName: quay.io/konflux-ci/multi-platform-controller
  newTag: 847104d7315beb482db01ff8d5182ba7c8fbb340
- name: multi-platform-otp-server
  newName: quay.io/konflux-ci/multi-platform-controller-otp-service
  newTag: 847104d7315beb482db01ff8d5182ba7c8fbb340
patches:
- path: patches/logs-in-console-format-cmd-arg-patch.yaml
  target:
    group: apps
    version: v1
    kind: Deployment
    name: multi-platform-controller
