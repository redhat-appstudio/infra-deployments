apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: multi-platform-controller
resources:
- base-snapshot
- https://github.com/konflux-ci/multi-platform-controller/deploy/operator?ref=0115920ccf97c6ce94c41da390a6de07f3404600
- https://github.com/konflux-ci/multi-platform-controller/deploy/otp?ref=0115920ccf97c6ce94c41da390a6de07f3404600
- host-config-cm.yaml
images:
- name: multi-platform-controller
  newName: quay.io/konflux-ci/multi-platform-controller
  newTag: 0115920ccf97c6ce94c41da390a6de07f3404600
- name: multi-platform-otp-server
  newName: quay.io/konflux-ci/multi-platform-controller-otp-service
  newTag: 0115920ccf97c6ce94c41da390a6de07f3404600
patches:
- path: patches/logs-in-console-format-cmd-arg-patch.yaml
  target:
    group: apps
    version: v1
    kind: Deployment
    name: multi-platform-controller
