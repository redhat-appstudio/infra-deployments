apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: multi-platform-controller
resources:
- base-snapshot
- https://github.com/konflux-ci/multi-platform-controller/deploy/operator?ref=b4c660eac7e4068dc0f61402d4210248d9c4c9ab
- https://github.com/konflux-ci/multi-platform-controller/deploy/otp?ref=b4c660eac7e4068dc0f61402d4210248d9c4c9ab
- host-config-cm.yaml
images:
- name: multi-platform-controller
  newName: quay.io/konflux-ci/multi-platform-controller
  newTag: b4c660eac7e4068dc0f61402d4210248d9c4c9ab
- name: multi-platform-otp-server
  newName: quay.io/konflux-ci/multi-platform-controller-otp-service
  newTag: b4c660eac7e4068dc0f61402d4210248d9c4c9ab
patches:
- path: patches/logs-in-console-format-cmd-arg-patch.yaml
  target:
    group: apps
    version: v1
    kind: Deployment
    name: multi-platform-controller
