apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: multi-platform-controller
resources:
- base-snapshot
- https://github.com/konflux-ci/multi-platform-controller/deploy/operator?ref=dc7df76671861ad1fb31cc69263f2b7b431d4d79
- https://github.com/konflux-ci/multi-platform-controller/deploy/otp?ref=dc7df76671861ad1fb31cc69263f2b7b431d4d79
- host-config-cm.yaml
images:
- name: multi-platform-controller
  newName: quay.io/konflux-ci/multi-platform-controller
  newTag: dc7df76671861ad1fb31cc69263f2b7b431d4d79
- name: multi-platform-otp-server
  newName: quay.io/konflux-ci/multi-platform-controller-otp-service
  newTag: dc7df76671861ad1fb31cc69263f2b7b431d4d79
patches:
- path: patches/logs-in-console-format-cmd-arg-patch.yaml
  target:
    group: apps
    version: v1
    kind: Deployment
    name: multi-platform-controller
