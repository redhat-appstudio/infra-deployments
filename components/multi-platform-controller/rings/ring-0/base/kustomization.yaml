apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: multi-platform-controller
resources:
- base-snapshot
- https://github.com/konflux-ci/multi-platform-controller/deploy/operator?ref=df71b77376050c720b93a156f77a7c9fe90d4b5a
- https://github.com/konflux-ci/multi-platform-controller/deploy/otp?ref=df71b77376050c720b93a156f77a7c9fe90d4b5a
- host-config-cm.yaml
images:
- name: multi-platform-controller
  newName: quay.io/konflux-ci/multi-platform-controller
  newTag: df71b77376050c720b93a156f77a7c9fe90d4b5a
- name: multi-platform-otp-server
  newName: quay.io/konflux-ci/multi-platform-controller-otp-service
  newTag: df71b77376050c720b93a156f77a7c9fe90d4b5a
patches:
- path: patches/logs-in-console-format-cmd-arg-patch.yaml
  target:
    group: apps
    version: v1
    kind: Deployment
    name: multi-platform-controller
