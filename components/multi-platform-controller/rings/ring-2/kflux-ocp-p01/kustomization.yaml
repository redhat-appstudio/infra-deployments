apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../base
- external-secrets

# Temporarily stop deploying ring-2/base/logcollector (otelcol-config ExternalSecret).
patches:
- patch: |-
    $patch: delete
    apiVersion: external-secrets.io/v1
    kind: ExternalSecret
    metadata:
      name: otelcol-config
      namespace: multi-platform-controller

helmGlobals:
  chartHome: ../base

helmCharts:
- name: host-config-chart
  releaseName: host-config
  namespace: multi-platform-controller
  valuesFile: host-values.yaml
