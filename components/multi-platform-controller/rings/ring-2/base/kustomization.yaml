- base-snapshot
- https://github.com/konflux-ci/multi-platform-controller/deploy/operator?ref=db220be16db575cf937c71163abad8353ad47bec
- https://github.com/konflux-ci/multi-platform-controller/deploy/otp?ref=db220be16db575cf937c71163abad8353ad47bec
- logcollector
images:
- name: multi-platform-controller
  newName: quay.io/konflux-ci/multi-platform-controller
  newTag: db220be16db575cf937c71163abad8353ad47bec
- name: multi-platform-otp-server
  newName: quay.io/konflux-ci/multi-platform-controller-otp-service
  newTag: db220be16db575cf937c71163abad8353ad47bec
patches:
- path: patches/manager-resources-patch.yaml
