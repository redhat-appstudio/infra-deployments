kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: image-rbac-proxy-admin
  namespace: image-rbac-proxy
rules:
  - apiGroups:
      - ''
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch
      - update
      - patch
      - delete

  - apiGroups:
      - ''
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
      - delete

  - apiGroups:
      - route.openshift.io
    resources:
      - routes
    verbs:
      - get
      - list
      - watch
      - update
      - patch

---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: image-rbac-proxy-admins
  namespace: image-rbac-proxy
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: konflux-image-rbac-proxy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: image-rbac-proxy-admin
