apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: image-rbac-proxy
resources:
- base-snapshot
- oauth
- https://github.com/konflux-ci/image-rbac-proxy/deploy/development/base?ref=821672f592f3ca5d3f408f2db964dd60821d207c
vars:
- name: DEX_DEPLOYMENT_NAME
  objref:
    apiVersion: apps/v1
    kind: Deployment
    name: dex
  fieldref:
    fieldpath: metadata.name
images:
- name: memcached
  newName: quay.io/kubearchive/memcached
  newTag: 1.6.39
- name: quay.io/konflux-ci/image-rbac-proxy
  newName: quay.io/konflux-ci/image-rbac-proxy
  newTag: 821672f592f3ca5d3f408f2db964dd60821d207c
