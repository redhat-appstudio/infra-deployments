apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: image-rbac-proxy
resources:
- base-snapshot
- external-secrets
- https://github.com/konflux-ci/image-rbac-proxy/deploy/base?ref=ddfa0d5ad806042a524a988999c19cd10db91150
vars:
- name: DEX_DEPLOYMENT_NAME
  objref:
    apiVersion: apps/v1
    kind: Deployment
    name: dex
  fieldref:
    fieldpath: metadata.name
images:
- name: quay.io/konflux-ci/image-rbac-proxy
  newName: quay.io/konflux-ci/image-rbac-proxy
  newTag: ddfa0d5ad806042a524a988999c19cd10db91150
