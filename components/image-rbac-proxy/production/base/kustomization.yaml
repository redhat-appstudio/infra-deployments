apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: image-rbac-proxy
resources:
- ../../base
- ../../base/external-secrets
- https://github.com/konflux-ci/image-rbac-proxy/deploy/base?ref=2ee48aa6caacad4ae8bdc5c3a7c1a14e1e9d60cb

images:
- name: quay.io/konflux-ci/image-rbac-proxy
  newName: quay.io/konflux-ci/image-rbac-proxy
  newTag: 2ee48aa6caacad4ae8bdc5c3a7c1a14e1e9d60cb

patches:
- path: external-secret-patch.yaml
  target:
    kind: ExternalSecret
    group: external-secrets.io
    version: v1
