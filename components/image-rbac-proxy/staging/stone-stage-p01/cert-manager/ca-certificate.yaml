apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: image-rbac-proxy-ca
  namespace: image-rbac-proxy
spec:
  isCA: true
  commonName: image-rbac-proxy-ca
  # Long-lived so Route destinationCACertificate does not need frequent updates.
  duration: 87600h # 10 years
  renewBefore: 720h # 30 days
  secretName: image-rbac-proxy-ca
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    kind: Issuer
    name: selfsigned-issuer
