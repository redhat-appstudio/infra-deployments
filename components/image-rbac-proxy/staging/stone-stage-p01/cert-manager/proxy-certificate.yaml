apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: proxy
  namespace: image-rbac-proxy
spec:
  dnsNames:
    - image-rbac-proxy
    - image-rbac-proxy.image-rbac-proxy.svc
    - image-rbac-proxy.image-rbac-proxy.svc.cluster.local
  issuerRef:
    kind: Issuer
    name: image-rbac-proxy-ca-issuer
  secretName: proxy-tls
