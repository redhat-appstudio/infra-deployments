apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: image-rbac-proxy
resources:
- ../base
# Enable this to create/preserve oauth secret
- ../../base/oauth-staging

configMapGenerator:
  - name: dex
    files:
      - dex-config.yaml

patches:
- target:
    kind: Job
    name: oauth-secret-generator
  patch: |-
    - op: add
      path: /spec/template/spec/containers/0/env
      value:
      - name: SKIP_OAUTH_ROTATION
        value: "true"
- path: configmap.yaml
- path: route-patch.yaml
  target:
    kind: Route
    group: route.openshift.io
    version: v1
- path: sa-patch.yaml
  target:
    kind: ServiceAccount
    name: dex-client
    version: v1
