apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: kueue
spec:
  generators:
    - merge:
        mergeKeys:
          - nameNormalized
        generators:
          - clusters:
              values:
                sourceRoot: components/kueue
                environment: staging
                # This app must have cluster specific configurations.
                # empty-base is an overlay that just has the namespace resource.
                # This allows to gradually deploy to all the clusters.
                clusterDir: empty-base
          - list:
              elements: []
  template:
    metadata:
      name: kueue-{{nameNormalized}}
    spec:
      project: default
      source:
        path: '{{values.sourceRoot}}/{{values.environment}}/{{values.clusterDir}}'
        repoURL: https://github.com/redhat-appstudio/infra-deployments.git
        targetRevision: main
      destination:
        server: '{{server}}'
      syncPolicy:
        syncOptions:
          - CreateNamespace=false
        preserveResourcesOnDeletion: true
        retry:
          limit: -1
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
