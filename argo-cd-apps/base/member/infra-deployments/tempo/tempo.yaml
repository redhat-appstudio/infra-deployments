apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: tempo
spec:
  generators:
  - merge:
      mergeKeys:
        - nameNormalized
      generators:
        - clusters:
            values:
              sourceRoot: components/monitoring/tracing/tempo
              environment: staging
              clusterDir: empty-base
              namespace: tempo-operator
        - list:
            elements:
              - nameNormalized: stone-stg-rh01
                values.clusterDir: stone-stg-rh01
                values.namespace: konflux-tempo
  template:
    metadata:
      name: tempo-{{nameNormalized}}
    spec:
      project: default
      source:
        repoURL: https://github.com/redhat-appstudio/infra-deployments.git
        targetRevision: main
        path: '{{values.sourceRoot}}/{{values.environment}}/{{values.clusterDir}}'
      destination:
        namespace: '{{values.namespace}}'
        server: '{{server}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
        retry:
          limit: 50
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
