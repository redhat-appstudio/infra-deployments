apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: mintmaker
spec:
  generators:
    # Exclude the ring-1 staging clusters from this legacy ApplicationSet in
    # every ArgoCD instance that renders base/member directly (staging-downstream,
    # konflux-public-staging), not just the ones with an explicit auto-sync
    # disable patch. rd-staging now manages these clusters. Production clusters
    # are unaffected since none of these names can match a production cluster
    # secret. Same pattern as knative-eventing's base-level exclusion.
    - selector:
        matchExpressions:
          - key: nameNormalized
            operator: NotIn
            values:
              - stone-stage-p01
              - stone-stg-rh01
              - lightwell-dev
              - kflux-stg-p02
      merge:
        mergeKeys:
          - nameNormalized
        generators:
          - clusters:
              values:
                sourceRoot: components/mintmaker
                environment: staging
                clusterDir: base
          - list:
              elements:
                - nameNormalized: kflux-ocp-p01
                  values.clusterDir: kflux-ocp-p01
                - nameNormalized: stone-stage-p01
                  values.clusterDir: stone-stage-p01
                - nameNormalized: stone-prod-p01
                  values.clusterDir: stone-prod-p01
                - nameNormalized: stone-prod-p02
                  values.clusterDir: stone-prod-p02
                - nameNormalized: stone-prd-rh01
                  values.clusterDir: stone-prd-rh01
                - nameNormalized: kflux-prd-rh02
                  values.clusterDir: kflux-prd-rh02
                - nameNormalized: kflux-prd-rh03
                  values.clusterDir: kflux-prd-rh03
                - nameNormalized: kflux-rhel-p01
                  values.clusterDir: kflux-rhel-p01
                - nameNormalized: kflux-osp-p01
                  values.clusterDir: kflux-osp-p01
                - nameNormalized: kflux-fedora-01
                  values.clusterDir: kflux-fedora-01
                - nameNormalized: kflux-lw-p01
                  values.clusterDir: kflux-lw-p01
                - nameNormalized: kflux-stg-p02
                  values.clusterDir: kflux-stg-p02
  template:
    metadata:
      name: mintmaker-{{nameNormalized}}
    spec:
      project: default
      source:
        path: '{{values.sourceRoot}}/{{values.environment}}/{{values.clusterDir}}'
        repoURL: https://github.com/redhat-appstudio/infra-deployments.git
        targetRevision: main
      destination:
        namespace: mintmaker
        server: '{{server}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
        retry:
          limit: 50
          backoff:
            duration: 15s
