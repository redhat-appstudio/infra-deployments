---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: knative-eventing
spec:
  generators:
    - merge:
        mergeKeys:
          - nameNormalized
        generators:
          - clusters:
              values:
                sourceRoot: components/knative-eventing
                environment: staging
                clusterDir: base
          - list:
              elements:
                - nameNormalized: stone-stage-p01
                  values.clusterDir: stone-stage-p01
                - nameNormalized: stone-stg-rh01
                  values.clusterDir: stone-stg-rh01
                - nameNormalized: lightwell-dev
                  values.clusterDir: lightwell-dev
                - nameNormalized: kflux-stg-p02
                  values.clusterDir: kflux-stg-p02
                - nameNormalized: kflux-prd-rh02
                  values.clusterDir: kflux-prd-rh02
        # Exclude stone-stage-p01 and stone-stg-rh01 from all ArgoCD instances,
        # including those reading base directly (e.g. konflux-public-staging
        # whose app-of-apps overlay is not yet enabled). lightwell-dev is
        # handled separately in a follow-up.
        selector:
          matchExpressions:
            - key: nameNormalized
              operator: NotIn
              values:
                - stone-stage-p01
                - stone-stg-rh01
                # ring-2
                - kflux-ocp-p01
                - stone-prod-p01
                - kflux-prd-rh03
                - kflux-osp-p01
                - kflux-rhel-p01
                - kflux-fedora-01
                - kflux-lw-p01
                # ring-3
                - stone-prod-p02
                - stone-prd-rh01
  template:
    metadata:
      name: knative-eventing-{{nameNormalized}}
    spec:
      project: default
      source:
        path: '{{values.sourceRoot}}/{{values.environment}}/{{values.clusterDir}}'
        repoURL: https://github.com/redhat-appstudio/infra-deployments.git
        targetRevision: main
      destination:
        namespace: knative-eventing
        server: '{{server}}'
      ignoreDifferences:
        # ignore aggregated roles changes
        - kind: ClusterRole
          group: rbac.authorization.k8s.io
          name: addressable-resolver
          jsonPointers:
            - /rules
        - kind: ClusterRole
          group: rbac.authorization.k8s.io
          name: channelable-manipulator
          jsonPointers:
            - /rules
        - kind: ClusterRole
          group: rbac.authorization.k8s.io
          name: crossnamespace-subscriber
          jsonPointers:
            - /rules
        - kind: ClusterRole
          group: rbac.authorization.k8s.io
          name: podspecable-binding
          jsonPointers:
            - /rules
        - kind: ClusterRole
          group: rbac.authorization.k8s.io
          name: source-observer
          jsonPointers:
            - /rules
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - RespectIgnoreDifferences=true
        retry:
          limit: 50
          backoff:
            duration: 15s
