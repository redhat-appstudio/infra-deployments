apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: monitoring-workload-loki
spec:
  generators:
    - merge:
        mergeKeys:
          - nameNormalized
        generators:
          - clusters:
              values:
                sourceRoot: components/monitoring/loki
                environment: staging
                # Do not deploy Loki by default, S3-compatible buckets needs to be provisioned first.
                clusterDir: "empty-base"
          - list:
              elements:
                # Staging Private Clusters
                - nameNormalized: stone-stage-p01
                  values.clusterDir: stone-stage-p01
                # Staging Public Clusters
                - nameNormalized: stone-stg-rh01
                  values.clusterDir: stone-stg-rh01
                # Staging EaaS Clusters
                - nameNormalized: kflux-stg-es01
                  values.clusterDir: kflux-stg-es01
  template:
    metadata:
      name: monitoring-workload-loki-{{nameNormalized}}
    spec:
      project: default
      source:
        path: '{{values.sourceRoot}}/{{values.environment}}/{{values.clusterDir}}'
        repoURL: https://github.com/redhat-appstudio/infra-deployments.git
        targetRevision: main
      destination:
        namespace: appstudio-workload-monitoring
        server: '{{server}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
        retry:
          limit: 50
          backoff:
            duration: 15s
