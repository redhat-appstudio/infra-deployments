apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: k8s-groups
spec:
  generators:
    - merge:
        mergeKeys:
          - nameNormalized
        generators:
          - clusters:
              values:
                sourceRoot: components/k8s-groups
                environment: staging
                useCaseDir: rover
          - list:
              elements:
                # Staging
                - nameNormalized: stone-stage-p01
                  values.useCaseDir: rover/rh-sso-internal
                - nameNormalized: stone-stg-rh01
                  values.useCaseDir: rover/rh-sso-internal
                - nameNormalized: kflux-stg-p02
                  values.useCaseDir: rover/ibmid
                # Production
                - nameNormalized: kflux-fedora-01
                  values.useCaseDir: fas
                - nameNormalized: kflux-prd-rh02
                  values.useCaseDir: rover
                - nameNormalized: kflux-prd-rh03
                  values.useCaseDir: rover
                - nameNormalized: kflux-rhel-p01
                  values.useCaseDir: rover
                - nameNormalized: kflux-ocp-p01
                  values.useCaseDir: rover
                - nameNormalized: kflux-osp-p01
                  values.useCaseDir: rover
                - nameNormalized: stone-prd-rh01
                  values.useCaseDir: rover
                - nameNormalized: stone-prod-p01
                  values.useCaseDir: rover
                - nameNormalized: stone-prod-p02
                  values.useCaseDir: rover
  template:
    metadata:
      name: k8s-groups-{{nameNormalized}}
    spec:
      project: default
      source:
        path: '{{values.sourceRoot}}/{{values.environment}}/{{values.useCaseDir}}'
        repoURL: ''  # will be added by kustomization
        targetRevision: main
      destination:
        namespace: k8s-groups
        server: '{{server}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
        retry:
          limit: -1
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
