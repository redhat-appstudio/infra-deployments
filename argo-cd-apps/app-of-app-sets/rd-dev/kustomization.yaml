apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
# rd-dev is now the default e2e preview target (see hack/preview.sh) and is deployed
# as the sole root Application, so it keeps the base "all-application-sets" name.
patches:
  - path: patches/source-path-patch.yaml
    target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
  - path: patches/target-namespace-patch.yaml
    target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
namespace: openshift-gitops
