---
# Drop operator-managed clusters from ApplicationSet generation for Konflux
# services owned by the konflux-operator (ring-2). Uses ApplicationSet
# post-selector on generated params (nameNormalized) so other public
# production clusters are unchanged. konflux-public-production overlay only;
# targets are listed in kustomization.yaml
- op: add
  path: /spec/generators/0/selector
  value:
    matchExpressions:
      - key: nameNormalized
        operator: NotIn
        values:
          - kflux-prd-rh03
