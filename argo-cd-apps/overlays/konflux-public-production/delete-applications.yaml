---
# Tempo is excluded from the production
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: tempo
$patch: delete
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: konflux-verifications-rd
$patch: delete
---
# Production check before the shared ApplicationSet is removed. The live
# ApplicationSet already has preserveResourcesOnDeletion, so generated
# Applications are orphaned instead of pruned.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: application-api
$patch: delete
---
# Operator-owned on all production hub members covered by the exclude list.
# Live ApplicationSets already have preserveResourcesOnDeletion, so any
# leftover Applications are orphaned instead of pruned.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: build-service
$patch: delete
