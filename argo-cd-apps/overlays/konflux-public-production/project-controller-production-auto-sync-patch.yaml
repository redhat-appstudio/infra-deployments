# Preserve auto-sync for production project-controller during the ring-deployments migration.
# The base appset's `automated` block was removed for the staging (Part 2) migration;
# production is not yet migrated, so re-enable it here.
# Remove this patch when project-controller production is migrated to ring deployments.
- op: add
  path: /spec/template/spec/syncPolicy/automated
  value:
    prune: true
    selfHeal: true
