# Strategic-merge delete: drop the legacy internal-services ApplicationSet from
# the ../development graph. Operator-owned member ApplicationSets are no longer
# in that graph.
#
# Only ApplicationSets that actually appear in ../development can be deleted here
# (Kustomize requires a merge target).
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: internal-services
$patch: delete
