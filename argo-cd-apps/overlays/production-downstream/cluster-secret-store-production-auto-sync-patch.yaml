# Preserve auto-sync for production cluster-secret-store during the ring-deployments migration.
# The base appset's `automated` block was removed for the staging (Part 2) migration
# (KFLUXINFRA-4238); production is not yet migrated, so re-enable it here.
# Remove this patch when cluster-secret-store production is migrated to ring deployments.
- op: add
  path: /spec/template/spec/syncPolicy/automated
  value:
    prune: true
    selfHeal: true
