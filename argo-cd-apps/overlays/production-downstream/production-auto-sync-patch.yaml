# Preserve auto-sync for production pipeline-service during the ring-deployments migration.
# The base appset's `automated` block was removed for the staging (Part 2) migration
# (KFLUXINFRA-4256); production is not yet migrated, so re-enable it here.
# Remove this patch when pipeline-service production is migrated to ring deployments.
- op: add
  path: /spec/template/spec/syncPolicy/automated
  value:
    prune: true
    selfHeal: true
