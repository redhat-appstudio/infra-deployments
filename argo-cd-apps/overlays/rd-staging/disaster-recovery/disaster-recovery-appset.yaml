apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: disaster-recovery
spec:
  generators:
    - merge:
        mergeKeys:
          - nameNormalized
        generators:
          - clusters:
              selector:
                matchLabels: # Get tenant clusters for this custom case
                  appstudio.redhat.com/cluster-type: "tenant"
              values:
                sourceRoot: components/tenants-backup-restore-test
                ring: "empty-base"
                clusterDir: "empty-base"
          - list:
              elements: # Run the nightly only on stone-stg-rh01
                - values.ring: ring-1
                  nameNormalized: stone-stg-rh01
                  values.clusterDir: stone-stg-rh01
        selector: # Keep the generated Application limited to stone-stg-rh01
          matchExpressions:
            - key: nameNormalized
              operator: In
              values:
                - stone-stg-rh01

  template:
    metadata:
      name: disaster-recovery-{{nameNormalized}}
      labels:
        app.kubernetes.io/part-of: disaster-recovery
    spec:
      project: default
      source:
        path: '{{values.sourceRoot}}/rings/{{values.ring}}/{{values.clusterDir}}'
        repoURL: https://github.com/redhat-appstudio/infra-deployments.git
        targetRevision: main
      destination:
        namespace: konflux-disaster-recovery
        server: '{{server}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
        retry:
          limit: 50
          backoff:
            duration: 15s
