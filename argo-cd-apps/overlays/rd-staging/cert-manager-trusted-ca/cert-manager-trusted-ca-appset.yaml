# This component intentionally deploys to a single internal cluster only
# (kflux-stg-p02), not the generic staging tenant/internal-tenant cluster
# set, so the cluster list is a plain static list generator rather than a
# clusters generator + k-component.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cert-manager-trusted-ca
spec:
  generators:
    - list:
        elements:
          - name: kflux-stg-p02
            values.sourceRoot: components/cert-manager-trusted-ca-rd
            values.ring: ring-1
            values.clusterDir: kflux-stg-p02

  template:
    metadata:
      name: cert-manager-trusted-ca-{{name}}
    spec:
      project: default
      source:
        path: '{{values.sourceRoot}}/rings/{{values.ring}}/{{values.clusterDir}}'
        repoURL: https://github.com/redhat-appstudio/infra-deployments.git
        targetRevision: main
      destination:
        name: '{{name}}'
        namespace: cert-manager
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
        - CreateNamespace=false
        retry:
          limit: -1
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
