apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: knative-eventing
spec:
  generators:
    - merge:
        mergeKeys:
          - nameNormalized
        generators:
          - clusters:
              selector:
                matchLabels:
                  appstudio.redhat.com/cluster-type: "tenant"
              values:
                sourceRoot: components/knative-eventing-rd
                ring: "empty-base"
                clusterDir: "empty-base"
          - list:
              elements:
                - values.ring: ring-1
                  nameNormalized: lightwell-dev
                  values.clusterDir: lightwell-dev
                - values.ring: ring-1
                  nameNormalized: kflux-stg-p02
                  values.clusterDir: kflux-stg-p02
        selector:
          matchExpressions:
            - key: nameNormalized
              operator: In
              values:
                - lightwell-dev
                - kflux-stg-p02

  template:
    metadata:
      name: knative-eventing-{{nameNormalized}}
    spec:
      project: default
      source:
        path: '{{values.sourceRoot}}/rings/{{values.ring}}/{{values.clusterDir}}'
        repoURL: https://github.com/redhat-appstudio/infra-deployments.git
        targetRevision: main
      destination:
        namespace: knative-eventing
        server: '{{server}}'
      ignoreDifferences:
        # ignore aggregated roles changes
        - kind: ClusterRole
          group: rbac.authorization.k8s.io
          name: addressable-resolver
          jsonPointers:
            - /rules
        - kind: ClusterRole
          group: rbac.authorization.k8s.io
          name: channelable-manipulator
          jsonPointers:
            - /rules
        - kind: ClusterRole
          group: rbac.authorization.k8s.io
          name: crossnamespace-subscriber
          jsonPointers:
            - /rules
        - kind: ClusterRole
          group: rbac.authorization.k8s.io
          name: podspecable-binding
          jsonPointers:
            - /rules
        - kind: ClusterRole
          group: rbac.authorization.k8s.io
          name: source-observer
          jsonPointers:
            - /rules
      syncPolicy:
        # automated:
        #   prune: true
        #   selfHeal: true
        syncOptions:
        - CreateNamespace=true
        - RespectIgnoreDifferences=true
        retry:
          limit: 50
          backoff:
            duration: 15s
