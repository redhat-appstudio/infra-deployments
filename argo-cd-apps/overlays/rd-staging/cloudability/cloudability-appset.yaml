apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cloudability
spec:
  generators:
    - list:
        elements:
          - name: kflux-hub-stg-01
            values.sourceRoot: components/cloudability
            values.ring: ring-1
            values.clusterDir: kflux-hub-stg-01
          - name: kflux-stg-p02
            values.sourceRoot: components/cloudability
            values.ring: ring-1
            values.clusterDir: kflux-stg-p02
          - name: lightwell-dev
            values.sourceRoot: components/cloudability
            values.ring: ring-1
            values.clusterDir: lightwell-dev
          - name: stone-stage-p01
            values.sourceRoot: components/cloudability
            values.ring: ring-1
            values.clusterDir: stone-stage-p01
          - name: stone-stg-rh01
            values.sourceRoot: components/cloudability
            values.ring: ring-1
            values.clusterDir: stone-stg-rh01

  template:
    metadata:
      name: cloudability-{{name}}
    spec:
      project: default
      source:
        path: '{{values.sourceRoot}}/rings/{{values.ring}}/{{values.clusterDir}}'
        repoURL: https://github.com/redhat-appstudio/infra-deployments.git
        targetRevision: main
      destination:
        namespace: ibm-finops-agent
        name: '{{name}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
        - CreateNamespace=true
        retry:
          limit: 50
          backoff:
            duration: 15s
      ignoreDifferences:
        - group: ""
          kind: ConfigMap
          name: trusted-ca-bundle
          namespace: ibm-finops-agent
          jsonPointers:
            - /data
