apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: pvsec
  labels:
    appstudio.redhat.com/deployment-clusters: all | tenant | eaas # Chose one option; helps a k-component detect this appset
spec:
  generators:
    - merge:
        mergeKeys:
          - nameNormalized
        generators:
          - clusters:
              selector:
                  matchExpressions: # Ensures that no clusters are selected; a k-component will replace this with the correct selector
                    - key: appstudio.redhat.com/select-none
                      operator: Exists
                    - key: appstudio.redhat.com/select-none
                      operator: DoesNotExist
              values:
                sourceRoot: components/pvsec
                ring: "empty-base"
                clusterDir: "empty-base"
          - list:
              elements: [] # Populated via a k-component (or manually if the cluster list is unusual)

  template:
    metadata:
      name: pvsec-{{nameNormalized}}
    spec:
      project: default
      source:
        path: '{{values.sourceRoot}}/rings/{{values.ring}}/{{values.clusterDir}}'
        repoURL: https://github.com/redhat-appstudio/infra-deployments.git
        targetRevision: main
      destination:
        namespace: crypto-scanner # (optional) IF the component is deployed to a single namespace
        server: '{{server}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
        - CreateNamespace=true
        retry:
          limit: 50
          backoff:
            duration: 15s

