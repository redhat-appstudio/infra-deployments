apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: smee-client
  labels:
    appstudio.redhat.com/internal-only: 'true'
    appstudio.redhat.com/deployment-clusters: "tenant"
    appstudio.redhat.com/hub-only: 'true'
spec:
  generators:
    - merge:
        mergeKeys:
          - nameNormalized
        generators:
          - clusters:
              selector:
                  matchExpressions: # Ensures that no clusters are selected; a k-component will replace this with the correct selector
                    - key: appstudio.redhat.com/select-none
                      operator: Exists
                    - key: appstudio.redhat.com/select-none
                      operator: DoesNotExist
              values:
                sourceRoot: components/smee-client
                ring: "empty-base"
                clusterDir: "empty-base"
          - list:
              elements: [] # Populated via a k-component
  template:
    metadata:
      name: smee-client-{{nameNormalized}}
      labels:
        app.kubernetes.io/part-of: smee-client
    spec:
      project: default
      source:
        path: '{{values.sourceRoot}}/rings/{{values.ring}}/{{values.clusterDir}}'
        repoURL: https://github.com/redhat-appstudio/infra-deployments.git
        targetRevision: main
      destination:
        namespace: smee-client
        server: '{{server}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
        retry:
          limit: -1
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
