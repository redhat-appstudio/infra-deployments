apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd-infra-deployments

resources:
  - application-cleaner
  - artifact-registry-proxy
  - authentication
  - cluster-secret-store
  - container-image-proxy
  - crossplane-config
  - crossplane-control-plane
  - disaster-recovery
  - dummy-deployment
  - etcd-shield
  - etcd-defrag
  - external-secrets-operator
  - konflux-operator
  - konflux-verifications-rd
  - kube-shard
  - kueue
  - kyverno
  - multi-platform-controller
  - notification-controller
  - pharos
  - pipeline-service
  - policies
  - project-controller
  - pulp-access-controller
  - pvsec
  - repository-validator
  - smee-client
  - trust-manager
  - vector-kubearchive-log-collector

components:
  - ../../k-components/deploy-to-all-staging-clusters
  - ../../k-components/deploy-to-staging-tenant-clusters
  - ../../k-components/deploy-to-staging-eaas-clusters
  - ../../k-components/deploy-to-staging-internal-tenant-clusters
