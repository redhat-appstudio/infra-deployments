apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: build-templates
  labels:
    appstudio.redhat.com/deployment-clusters: tenant
spec:
  generators:
    - merge:
        mergeKeys:
          - nameNormalized
        generators:
          - clusters:
              selector:
                  matchExpressions:
                    - key: appstudio.redhat.com/select-none
                      operator: Exists
                    - key: appstudio.redhat.com/select-none
                      operator: DoesNotExist
              values:
                sourceRoot: components/build-templates-rd
                ring: "empty-base"
                clusterDir: "empty-base"
          - list:
              elements: []

  template:
    metadata:
      name: build-templates-{{nameNormalized}}
      labels:
        app.kubernetes.io/part-of: build-templates
    spec:
      project: default
      source:
        path: '{{values.sourceRoot}}/rings/{{values.ring}}/{{values.clusterDir}}'
        repoURL: https://github.com/redhat-appstudio/infra-deployments.git
        targetRevision: main
      destination:
        namespace: build-templates
        server: '{{server}}'
      ignoreDifferences:
        - group: ""
          kind: ServiceAccount
          name: konflux-integration-runner
          jqPathExpressions:
          - .imagePullSecrets[] | select(.name | startswith("konflux-integration-runner-dockercfg"))
      syncPolicy:
        # automated:
        #   prune: true
        #   selfHeal: true
        syncOptions:
        - CreateNamespace=true
        retry:
          limit: -1
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
