apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: vector-kubearchive-log-collector
  labels:
    appstudio.redhat.com/deployment-clusters: tenant
spec:
  generators:
    - merge:
        mergeKeys:
          - nameNormalized
        generators:
          - clusters:
              selector:
                  matchExpressions: # Ensures that no clusters are selected; a k-component will replace this with the correct selector
                    - key: appstudio.redhat.com/select-none
                      operator: Exists
                    - key: appstudio.redhat.com/select-none
                      operator: DoesNotExist
              values:
                sourceRoot: components/vector-kubearchive-log-collector
                ring: "empty-base"
                clusterDir: "empty-base"
          - list:
              elements: [] # Populated via a k-component (or manually if the cluster list is unusual)

  template:
    metadata:
      name: vector-kubearchive-log-collector-{{nameNormalized}}
      labels:
        app.kubernetes.io/part-of: vector-kubearchive-log-collector
      annotations:
        argocd.argoproj.io/sync-wave: "100"
        argocd.argoproj.io/refresh: "hard"
        argocd.argoproj.io/compare-options: ServerSideDiff=true
    spec:
      ignoreDifferences:
        # Ignore Helm-generated dynamic content that causes drift
        - group: apps
          kind: Deployment
          name: vector-kubearchive-log-collector-grafana
          jsonPointers:
            - /metadata/annotations/deployment.kubernetes.io~1revision
            - /metadata/annotations/kubectl.kubernetes.io~1last-applied-configuration
            - /metadata/generation
            - /spec/template/metadata/annotations/checksum~1config
            - /spec/template/metadata/annotations/checksum~1secret
            - /spec/template/metadata/annotations/checksum~1sc-dashboard-provider-config
        - group: ""
          kind: Secret
          name: vector-kubearchive-log-collector-grafana
          jsonPointers:
            - /metadata/annotations/kubectl.kubernetes.io~1last-applied-configuration
      project: default
      source:
        path: '{{values.sourceRoot}}/rings/{{values.ring}}/{{values.clusterDir}}'
        repoURL: https://github.com/redhat-appstudio/infra-deployments.git
        targetRevision: main
      destination:
        namespace: product-kubearchive-logging
        server: '{{server}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
        - CreateNamespace=true
        retry:
          limit: -1
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
