apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: vector-tekton-logs-collector
  labels:
    appstudio.redhat.com/deployment-clusters: tenant
spec:
  generators:
    - merge:
        mergeKeys:
          - nameNormalized
        generators:
          - clusters:
              selector:
                  matchExpressions: # Ensures that no clusters are selected; a k-component will replace this with the correct selector
                    - key: appstudio.redhat.com/select-none
                      operator: Exists
                    - key: appstudio.redhat.com/select-none
                      operator: DoesNotExist
              values:
                sourceRoot: components/vector-tekton-logs-collector-rd
                ring: "empty-base"
                clusterDir: "empty-base"
          - list:
              elements: [] # Populated via a k-component

  template:
    metadata:
      name: vector-tekton-logs-collector-{{nameNormalized}}
      labels:
        app.kubernetes.io/part-of: vector-tekton-logs-collector
    spec:
      project: default
      source:
        path: '{{values.sourceRoot}}/rings/{{values.ring}}/{{values.clusterDir}}'
        repoURL: https://github.com/redhat-appstudio/infra-deployments.git
        targetRevision: main
      destination:
        namespace: tekton-logging
        server: '{{server}}'
      syncPolicy:
        # automated:
        #   prune: true
        #   selfHeal: true
        syncOptions:
        - CreateNamespace=true
        retry:
          limit: -1
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
