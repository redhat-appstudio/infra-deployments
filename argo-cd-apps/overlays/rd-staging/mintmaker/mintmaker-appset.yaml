apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: mintmaker
  labels:
    appstudio.redhat.com/deployment-clusters: "tenant"
spec:
  generators:
    # mintmaker is not deployed to stone-stg-rh01 or lightwell-dev; drop them
    # from the tenant cluster list populated by deploy-to-staging-tenant-clusters.
    - selector:
        matchExpressions:
          - key: nameNormalized
            operator: NotIn
            values:
              - stone-stg-rh01
              - lightwell-dev
      merge:
        mergeKeys:
          - nameNormalized
        generators:
          - clusters:
              selector:
                matchExpressions: # k-components will replace this with the correct selector
                  - key: appstudio.redhat.com/select-none
                    operator: Exists
                  - key: appstudio.redhat.com/select-none
                    operator: DoesNotExist
              values:
                sourceRoot: components/mintmaker-rd
                ring: "empty-base"
                clusterDir: "empty-base"
          - list:
              elements: [] # Populated via k-components

  template:
    metadata:
      name: mintmaker-{{nameNormalized}}
      labels:
        app.kubernetes.io/part-of: mintmaker
    spec:
      project: default
      source:
        path: '{{values.sourceRoot}}/rings/{{values.ring}}/{{values.clusterDir}}'
        repoURL: https://github.com/redhat-appstudio/infra-deployments.git
        targetRevision: main
      destination:
        namespace: mintmaker
        server: '{{server}}'
      syncPolicy:
        # automated:
        #   prune: true
        #   selfHeal: true
        syncOptions:
          - CreateNamespace=true
        retry:
          limit: 50
          backoff:
            duration: 15s
