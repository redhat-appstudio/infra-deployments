$patch: delete
---
# Owned by ring Argo CD (rd-staging) now that build-templates's
# ring-1 staging clusters are migrated.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: build-templates
$patch: delete
---
# Owned by ring Argo CD (rd-staging) now that internal-services's ring-1
# staging clusters are migrated.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: internal-services
$patch: delete
---
# Staging check before the shared ApplicationSet is removed. The live
# ApplicationSet already has preserveResourcesOnDeletion, so generated
# Applications are orphaned instead of pruned.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: application-api
$patch: delete
---
# Operator-owned on stone-stg-rh01 (the konflux-public-staging member covered
# by the exclude list). Live ApplicationSets already have
# preserveResourcesOnDeletion, so any leftover Applications are orphaned
# instead of pruned.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: build-service
$patch: delete
