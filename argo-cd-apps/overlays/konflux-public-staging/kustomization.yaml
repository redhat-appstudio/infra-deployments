apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base/member
  - ../../base/all-clusters
  - ../../base/backup
  - ../../base/monitoring-blackbox

namespace: konflux-public-staging
patchesStrategicMerge:
  - delete-applications.yaml

patches:
  # Disable legacy build-templates auto-sync while rd-staging owns staging.
  - path: build-templates-remove-auto-sync-patch.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: build-templates
  # Remove automated sync from image-rbac-proxy for staging migration; this
  # AppSet is shared with production, so the base syncPolicy is left untouched
  - path: image-rbac-proxy-remove-auto-sync-patch.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: image-rbac-proxy
  # Orphan resources when an Application is later removed from an operator-owned
  # ApplicationSet. This must be synced before any cluster is excluded, so Argo
  # does not prune those workloads. konflux-public-staging only.
  - path: preserve-resources-on-deletion.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: application-api
  - path: preserve-resources-on-deletion.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: build-service
  - path: preserve-resources-on-deletion.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: integration
  - path: preserve-resources-on-deletion.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: image-controller
  - path: preserve-resources-on-deletion.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: namespace-lister
  - path: preserve-resources-on-deletion.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: konflux-info
  - path: preserve-resources-on-deletion.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: konflux-ui
  - path: preserve-resources-on-deletion.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: enterprise-contract
  - path: preserve-resources-on-deletion.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: konflux-rbac
  - path: preserve-resources-on-deletion.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: release
