apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base/member
  - ../../base/all-clusters
  - ../../base/backup
  - ../../base/monitoring-blackbox

namespace: konflux-public-staging
patchesStrategicMerge:
  - delete-applications.yaml
patches:
  # Disable legacy Kubearchive auto-sync while rd-staging owns staging.
  - path: kubearchive-remove-auto-sync-patch.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: kubearchive
