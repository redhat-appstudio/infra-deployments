apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base/member
  - ../../base/all-clusters
  - ../../base/backup
  - ../../base/eaas
  - ../../base/monitoring-blackbox

namespace: konflux-public-staging
patchesStrategicMerge:
  - delete-applications.yaml

patches:
  - path: disable-auto-sync-patch.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
