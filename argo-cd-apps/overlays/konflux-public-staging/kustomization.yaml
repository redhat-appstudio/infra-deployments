apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base/member
  - ../../base/all-clusters
  - ../../base/backup
  - ../../base/monitoring-blackbox

namespace: konflux-public-staging
patchesStrategicMerge:
  - delete-applications.yaml

patches:
  # Remove automated sync from vector-kubearchive-log-collector for staging migration
  - path: vector-kubearchive-log-collector-remove-auto-sync-patch.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: vector-kubearchive-log-collector
