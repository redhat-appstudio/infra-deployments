apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base/member
  - ../../base/all-clusters
  - ../../base/backup
  - ../../base/monitoring-blackbox

namespace: konflux-public-staging
patchesStrategicMerge:
  - delete-applications.yaml

patches:
  # Remove automated sync from vector-tekton-logs-collector for staging migration
  - path: vector-tekton-logs-collector-remove-auto-sync-patch.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: vector-tekton-logs-collector
  # Disable legacy build-templates auto-sync while rd-staging owns staging.
  - path: build-templates-remove-auto-sync-patch.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: build-templates
  # Remove automated sync from konflux-kite for staging migration; this AppSet is
  # shared with production, so the base syncPolicy is left untouched
  - path: konflux-kite-remove-auto-sync-patch.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: konflux-kite
