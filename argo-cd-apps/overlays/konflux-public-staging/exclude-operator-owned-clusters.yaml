---
# Drop operator-managed clusters from ApplicationSet generation for Konflux
# services owned by the konflux-operator (ring-1). Uses ApplicationSet
# post-selector on generated params (nameNormalized) so other public
# staging clusters are unchanged. konflux-public-staging overlay only;
# targets are listed in kustomization.yaml.
- op: add
  path: /spec/generators/0/selector
  value:
    matchExpressions:
      - key: nameNormalized
        operator: NotIn
        values:
          - stone-stg-rh01
