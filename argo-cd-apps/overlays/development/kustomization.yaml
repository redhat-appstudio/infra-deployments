apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base/local-cluster-secret/all-in-one
  - ../../base/member
  - ../../base/all-clusters
  - ../../base/ca-bundle
  - ../../base/backup
  # Preview/e2e is already rd-dev-only; TODO: finish ownership split (stop inheriting these via development).
  - ../rd-dev/kueue
  - ../rd-dev/kyverno
  - ../rd-dev/pipeline-service
  - ../rd-dev/policies
  - ../rd-dev/kubearchive

patchesStrategicMerge:
  - delete-applications.yaml
namespace: openshift-gitops
