apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base/local-cluster-secret/all-in-one
  - ../../base/member
  - ../../base/all-clusters
  - ../../base/ca-bundle
  - ../../base/backup

patchesStrategicMerge:
  - delete-applications.yaml
namespace: openshift-gitops
patches:
  - path: development-overlay-patch.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: build-templates
  - path: development-overlay-patch.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: has
  - path: development-overlay-patch.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: monitoring-workload-prometheus
  - path: development-overlay-patch.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: ca-bundle
  - path: development-overlay-patch.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: backup
  - path: development-overlay-patch.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: tracing-workload-tracing
  - path: development-overlay-patch.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: tracing-workload-otel-collector
  - path: development-overlay-patch.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: tempo
  - path: development-overlay-patch.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: crossplane-config
  - path: delete-preserve-resources-flag-patch.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: crossplane-config
  - path: dev-application-auto-sync-patch.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: crossplane-config
  - path: development-overlay-patch.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: cert-manager
  - path: development-overlay-patch.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: perf-team-prometheus-reader
  - path: development-overlay-patch.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: internal-services
  # ensure installation order of ApplicationSets during all-application-sets sync
  - path: delete-preserve-resources-flag-patch.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: konflux-verifications-rd
