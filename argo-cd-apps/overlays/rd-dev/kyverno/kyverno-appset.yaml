apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: kyverno-rd
spec:
  generators:
    - merge:
        mergeKeys:
          - nameNormalized
        generators:
          - clusters:
              selector:
                matchLabels:
                  appstudio.redhat.com/member-cluster: "true"
              values:
                sourceRoot: components/kyverno-rd
                ring: "ring-0"
                clusterDir: base
          - list:
              elements: []

  template:
    metadata:
      name: kyverno-{{nameNormalized}}
    spec:
      project: default
      ignoreDifferences:
        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
          name: '*.kyverno.io'
          jqPathExpressions:
            - .spec
            - .metadata.labels
        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
          name: '*.wgpolicyk8s.io'
          jqPathExpressions:
            - .spec
            - .metadata.labels
      source:
        path: '{{values.sourceRoot}}/rings/{{values.ring}}/{{values.clusterDir}}'
        repoURL: https://github.com/redhat-appstudio/infra-deployments.git
        targetRevision: main
      destination:
        namespace: konflux-kyverno
        server: '{{server}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
        retry:
          limit: -1
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
