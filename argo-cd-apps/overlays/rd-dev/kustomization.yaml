apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: openshift-gitops

resources:
  - ../development
  - artifact-registry-proxy
  - container-image-proxy
  - crossplane-config
  - crossplane-control-plane
  - disaster-recovery
  - dummy-deployment
  - etcd-shield
  - konflux-operator
# - kueue # TODO: Uncomment this once e2e tests use solely the rd-dev overlay
# - kyverno # TODO: Uncomment this once e2e tests use solely the rd-dev overlay
  - multi-platform-controller
# - pipeline-service # TODO: Uncomment this once e2e tests use solely the rd-dev overlay
# - policies # TODO: Uncomment this once e2e tests use solely the rd-dev overlay
  - pharos
  - project-controller
  - smee-client
  - repository-validator
  - trust-manager
  - pvsec
  - vector-kubearchive-log-collector
  - vector-tekton-logs-collector

patchesStrategicMerge:
  - delete-legacy-konflux-member-appsets.yaml

# Patch the pipeline-service ApplicationSet to use the `components/pipeline-service/rings/ring-0/base/`
# directory instead of the default `components/pipeline-service/rings/ring-0/legacy-development/` directory,
# which includes the `appstudio-pipelines-scc` SecurityContextConstraints.
patches:
  - path: pipeline-service-operator-patch.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: pipeline-service
