apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: openshift-gitops

resources:
  - ../development
  - artifact-registry-proxy
  - build-templates
  - container-image-proxy
  - crossplane-config
  - crossplane-control-plane
  - disaster-recovery
  - dummy-deployment
  - etcd-shield
  - image-rbac-proxy
  - konflux-kite
  - konflux-operator
# Preview/e2e is already rd-dev-only; these still arrive via ../development until ownership split.
# - kubearchive # TODO: Uncomment here (and stop inheriting via ../development)
# - kueue # TODO: Uncomment here (and stop inheriting via ../development)
# - kyverno # TODO: Uncomment here (and stop inheriting via ../development)
  - mintmaker
  - multi-platform-controller
# - pipeline-service # TODO: Uncomment here (and stop inheriting via ../development)
# - policies # TODO: Uncomment here (and stop inheriting via ../development)
  - pharos
  - project-controller
  - smee-client
  - repository-validator
  - trust-manager
  - pvsec
  - vector-tekton-logs-collector

patchesStrategicMerge:
  - delete-legacy-konflux-member-appsets.yaml

# Patch the pipeline-service ApplicationSet to use the `components/pipeline-service/rings/ring-0/base/`
# directory instead of the default `components/pipeline-service/rings/ring-0/legacy-development/` directory,
# which includes the `appstudio-pipelines-scc` SecurityContextConstraints.
patches:
  - path: pipeline-service-operator-patch.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: pipeline-service
