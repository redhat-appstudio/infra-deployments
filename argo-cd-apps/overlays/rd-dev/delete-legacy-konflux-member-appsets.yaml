# Strategic-merge deletes: remove legacy member ApplicationSets that rd-dev
# replaces with ring ApplicationSets. build-templates comes from
# components/build-templates-rd. internal-services stays deleted here; its ring
# ApplicationSet is not part of this overlay.
#
# Only ApplicationSets that actually appear in ../development can be deleted here
# (Kustomize requires a merge target).
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: build-templates
$patch: delete
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: internal-services
$patch: delete
