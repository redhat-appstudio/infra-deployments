apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: pipeline-service-rd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  generators:
    - merge:
        mergeKeys:
          - nameNormalized
        generators:
          - clusters:
              selector:
                matchLabels:
                  appstudio.redhat.com/member-cluster: "true"
              values:
                sourceRoot: components/pipeline-service-rd
                ring: "ring-0"
                clusterDir: "base"
          - list:
              elements: []
  template:
    metadata:
      name: pipeline-service-{{nameNormalized}}
      labels:
        app.kubernetes.io/part-of: pipeline-service
    spec:
      project: default
      source:
        path: '{{values.sourceRoot}}/rings/{{values.ring}}/{{values.clusterDir}}'
        repoURL: https://github.com/redhat-appstudio/infra-deployments.git
        targetRevision: main
      destination:
        namespace: openshift-pipelines
        server: '{{server}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
        retry:
          limit: -1
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m

