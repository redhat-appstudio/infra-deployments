apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: kubearchive-rd
spec:
  generators:
    - merge:
        mergeKeys:
          - nameNormalized
        generators:
          - clusters:
              selector:
                matchLabels:
                  appstudio.redhat.com/member-cluster: "true"
              values:
                sourceRoot: components/kubearchive-rd
                ring: "ring-0"
                clusterDir: base
          - list:
              elements: []

  template:
    metadata:
      name: kubearchive-{{nameNormalized}}
    spec:
      ignoreDifferences:
        # ignore CRB that gets modified by KubeArchive
        - kind: ClusterRoleBinding
          group: rbac.authorization.k8s.io
          name: clusterkubearchiveconfig-read
          jsonPointers:
            - /subjects
        # ignore RoleBinding that gets modified by KubeArchive operator
        - kind: RoleBinding
          group: rbac.authorization.k8s.io
          name: kubearchive-vacuum
          jsonPointers:
            - /subjects
      project: default
      source:
        path: '{{values.sourceRoot}}/rings/{{values.ring}}/{{values.clusterDir}}'
        repoURL: https://github.com/redhat-appstudio/infra-deployments.git
        targetRevision: main
      destination:
        namespace: product-kubearchive
        server: '{{server}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - SkipDryRunOnMissingResource=true
        retry:
          limit: 50
          backoff:
            duration: 15s
