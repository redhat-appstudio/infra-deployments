apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cluster-secret-store-rh
  # No deployment-clusters label — k-component injection excluded;
  # cluster list managed manually (rh-member-cluster-specific component)
spec:
  generators:
    - merge:
        mergeKeys:
          - nameNormalized
        generators:
          - clusters:
              selector:
                matchExpressions:
                  - key: appstudio.redhat.com/select-none
                    operator: Exists
                  - key: appstudio.redhat.com/select-none
                    operator: DoesNotExist
              values:
                sourceRoot: components/cluster-secret-store-rh-rd
                ring: "empty-base"
                clusterDir: "empty-base"
          - list:
              elements:
                - nameNormalized: stone-prod-p02
                  values.ring: ring-2
                  values.clusterDir: stone-prod-p02
                - nameNormalized: stone-prd-rh01
                  values.ring: ring-3
                  values.clusterDir: stone-prd-rh01
                - nameNormalized: kflux-rhel-p01
                  values.ring: ring-4
                  values.clusterDir: kflux-rhel-p01

  template:
    metadata:
      name: cluster-secret-store-rh-{{nameNormalized}}
    spec:
      project: default
      source:
        path: '{{values.sourceRoot}}/rings/{{values.ring}}/{{values.clusterDir}}'
        repoURL: https://github.com/redhat-appstudio/infra-deployments.git
        targetRevision: main
      destination:
        namespace: cluster-secret-store-rh
        server: '{{server}}'
      syncPolicy:
        # automated:
        #   prune: true
        #   selfHeal: true
        syncOptions:
          - CreateNamespace=true
        retry:
          limit: 50
          backoff:
            duration: 15s
