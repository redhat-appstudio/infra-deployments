apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: konflux-verifications-rd
spec:
  generators:
    - merge:
        mergeKeys:
          - nameNormalized
        generators:
          - clusters:
              selector:
                matchExpressions:
                  - key: appstudio.redhat.com/select-none
                    operator: Exists
                  - key: appstudio.redhat.com/select-none
                    operator: DoesNotExist
              values:
                sourceRoot: components/konflux-verifications-rd
                ring: "empty-base"
                clusterDir: "empty-base"
          - list:
              elements:
                - nameNormalized: stone-prod-p01
                  values.ring: ring-2
                  values.clusterDir: stone-prod-p01
      selector:
        matchExpressions:
          - key: nameNormalized
            operator: In
            values:
              - stone-prod-p01
  template:
    metadata:
      name: konflux-verifications-rd-{{nameNormalized}}
      labels:
        app.kubernetes.io/part-of: konflux-verifications
    spec:
      project: default
      source:
        path: '{{values.sourceRoot}}/rings/{{values.ring}}/{{values.clusterDir}}'
        repoURL: https://github.com/redhat-appstudio/infra-deployments.git
        targetRevision: main
      destination:
        namespace: verification-vanguard-proxy-runner
        server: '{{server}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
        retry:
          limit: 50
          backoff:
            duration: 15s
