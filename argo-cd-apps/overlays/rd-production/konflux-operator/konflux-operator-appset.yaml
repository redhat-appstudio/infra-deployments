apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: konflux-operator
spec:
  generators:
    - merge:
        mergeKeys:
          - nameNormalized
        generators:
          - clusters:
              selector:
                matchLabels:
                  appstudio.redhat.com/cluster-type: "tenant"
              values:
                sourceRoot: components/konflux-operator
                ring: "empty-base"
                clusterDir: "empty-base"
          - list:
              elements:
                - values.ring: ring-2
                  nameNormalized: kflux-lw-p01
                  values.clusterDir: kflux-lw-p01
      selector:
        matchExpressions:
          - key: values.ring
            operator: NotIn
            values:
              - empty-base

  template:
    metadata:
      name: konflux-operator-{{nameNormalized}}
    spec:
      project: default
      source:
        path: '{{values.sourceRoot}}/rings/{{values.ring}}/{{values.clusterDir}}'
        repoURL: https://github.com/redhat-appstudio/infra-deployments.git
        targetRevision: main
      destination:
        namespace: konflux-operator
        server: '{{server}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - SkipDryRunOnMissingResource=true
        retry:
          limit: -1
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
