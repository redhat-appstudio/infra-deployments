apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd-infra-deployments

resources:
  - artifact-registry-proxy
  - authentication
  - cert-manager-trusted-ca
  - cluster-secret-store
  - cluster-secret-store-rh
  - container-image-proxy
  - crossplane-config
  - crossplane-control-plane
  - etcd-defrag
  - etcd-shield
  - external-secrets-operator
  - image-rbac-proxy
  - konflux-verifications-rd
  - konflux-kite
  - konflux-operator
  - kubearchive
  - kueue
  - kyverno
  - mintmaker
  - multi-platform-controller
  - notification-controller
  - pharos
  - pipeline-service
  - policies
  - project-controller
  - pulp-access-controller
  - pvsec
  - repository-validator
  - smee-client
  - trust-manager
  - vector-kubearchive-log-collector
  - vector-tekton-logs-collector

components:
  - ../../k-components/deploy-to-all-production-clusters
  - ../../k-components/deploy-to-production-tenant-clusters
  - ../../k-components/deploy-to-production-eaas-clusters
  - ../../k-components/deploy-to-production-internal-tenant-clusters
