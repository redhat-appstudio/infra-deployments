---
# Exclude kflux-stg-p02 from ApplicationSets that are not ready for this
# staging ROKS cluster yet (perf-team awaits perfscale tenant namespaces).
- op: add
  path: /spec/generators/0/selector
  value:
    matchExpressions:
      - key: nameNormalized
        operator: NotIn
        values:
          - kflux-stg-p02
