apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd-staging
resources:
  - ../../base/member
  - ../../base/all-clusters
  - ../../base/backup
  - ../../base/eaas
  - ../../base/monitoring-blackbox
  - ../../base/smee-client
  - ../../base/ca-bundle
  - ../../base/repository-validator

patchesStrategicMerge:
  - delete-applications.yaml

patches:
  - path: disable-auto-sync.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
  # Exclude the local common cluster from generated deployment targets. Split
  # across 3 files/targets (via labelSelector) so we never crash on or
  # replace an ApplicationSet's existing clusters.selector - see comments in
  # each patch file for details.
  - path: remove-local-common-cluster-patches/specific-clusters-patch.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      labelSelector: "!appstudio.redhat.com/direct-cluster-generator,!appstudio.redhat.com/deployment-clusters"
  - path: remove-local-common-cluster-patches/all-clusters-group-patch.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      labelSelector: "appstudio.redhat.com/deployment-clusters=all"
  - path: remove-local-common-cluster-patches/direct-generator-patch.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      labelSelector: "appstudio.redhat.com/direct-cluster-generator=true"
  # Exclude operator-managed clusters from Argo generation for services owned
  # by the konflux-operator. Orphan (do not prune) when Applications go away.
  - path: exclude-operator-owned-clusters.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: application-api
  - path: preserve-resources-on-deletion.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: application-api
  - path: exclude-operator-owned-clusters.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: build-service
  - path: preserve-resources-on-deletion.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: build-service
  - path: exclude-operator-owned-clusters.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: integration
  - path: preserve-resources-on-deletion.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: integration
  - path: exclude-operator-owned-clusters.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: image-controller
  - path: preserve-resources-on-deletion.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: image-controller
  - path: exclude-operator-owned-clusters.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: namespace-lister
  - path: preserve-resources-on-deletion.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: namespace-lister
  - path: exclude-operator-owned-clusters.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: konflux-info
  - path: preserve-resources-on-deletion.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: konflux-info
  - path: exclude-operator-owned-clusters.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: konflux-ui
  - path: preserve-resources-on-deletion.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: konflux-ui
  - path: exclude-operator-owned-clusters.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: enterprise-contract
  - path: preserve-resources-on-deletion.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: enterprise-contract
  - path: exclude-operator-owned-clusters.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: konflux-rbac
  - path: preserve-resources-on-deletion.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: konflux-rbac
  - path: exclude-operator-owned-clusters.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: release
  - path: preserve-resources-on-deletion.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: release
