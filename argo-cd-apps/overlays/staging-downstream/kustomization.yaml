apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd-staging
resources:
  - ../../base/member
  - ../../base/all-clusters
  - ../../base/backup
  - ../../base/quality-dashboard
  - ../../base/eaas
  - ../../base/monitoring-blackbox
  - ../../base/smee-client
  - ../../base/ca-bundle
  - ../../base/repository-validator

patchesStrategicMerge:
  - delete-applications.yaml

patches:
  - path: staging-downstream-overlay-patch.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: multi-platform-controller
  # Exclude stone-stage-p01 from Argo generation for services owned by the
  # konflux-operator there. Orphan (do not prune) when Applications go away.
  # release stays on Argo with disable-auto-sync until monitor ownership is confirmed.
  - path: exclude-stone-stage-p01-operator-owned.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: application-api
  - path: preserve-resources-on-deletion.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: application-api
  - path: exclude-stone-stage-p01-operator-owned.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: build-service
  - path: preserve-resources-on-deletion.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: build-service
  - path: exclude-stone-stage-p01-operator-owned.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: integration
  - path: preserve-resources-on-deletion.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: integration
  - path: exclude-stone-stage-p01-operator-owned.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: image-controller
  - path: preserve-resources-on-deletion.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: image-controller
  - path: exclude-stone-stage-p01-operator-owned.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: namespace-lister
  - path: preserve-resources-on-deletion.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: namespace-lister
  - path: exclude-stone-stage-p01-operator-owned.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: konflux-info
  - path: preserve-resources-on-deletion.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: konflux-info
  - path: exclude-stone-stage-p01-operator-owned.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: konflux-ui
  - path: preserve-resources-on-deletion.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: konflux-ui
  - path: exclude-stone-stage-p01-operator-owned.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: enterprise-contract
  - path: preserve-resources-on-deletion.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: enterprise-contract
  - path: exclude-stone-stage-p01-operator-owned.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: konflux-rbac
  - path: preserve-resources-on-deletion.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: konflux-rbac
  # Keep auto-sync/self-heal off for release on all staging members until
  # release-service-monitor ownership is confirmed for stone-stage-p01.
  - path: disable-auto-sync.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: release
  # Remaining disable-auto-sync for other staging members (e.g. stone-stg-rh01)
  # while operator rollout is stone-stage-p01-only. Harmless on p01 once the
  # Applications are no longer generated.
  - path: disable-auto-sync.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: application-api
  - path: disable-auto-sync.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: build-service
  - path: disable-auto-sync.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: integration
  - path: disable-auto-sync.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: image-controller
  - path: disable-auto-sync.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: namespace-lister
  - path: disable-auto-sync.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: konflux-info
  - path: disable-auto-sync.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: konflux-ui
  - path: disable-auto-sync.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: enterprise-contract
  - path: disable-auto-sync.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: konflux-rbac
