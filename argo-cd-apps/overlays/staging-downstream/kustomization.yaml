apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd-staging
resources:
  - ../../base/member
  - ../../base/all-clusters
  - ../../base/backup
  - ../../base/quality-dashboard
  - ../../base/eaas
  - ../../base/monitoring-blackbox
  - ../../base/smee-client
  - ../../base/ca-bundle
  - ../../base/repository-validator

patchesStrategicMerge:
  - delete-applications.yaml

patches:
  - path: staging-downstream-overlay-patch.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: multi-platform-controller
  # Temporarily disable auto-sync/self-heal for services that the Konflux
  # operator will own on stone-stage-p01 (PR #13169), so ArgoCD does not race
  # the operator during ownership handoff. Revert once migration is complete.
  - path: disable-auto-sync.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: application-api
  - path: disable-auto-sync.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: build-service
  - path: disable-auto-sync.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: integration
  - path: disable-auto-sync.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: image-controller
  - path: disable-auto-sync.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: namespace-lister
  - path: disable-auto-sync.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: konflux-info
  - path: disable-auto-sync.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: konflux-ui
  - path: disable-auto-sync.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: enterprise-contract
  - path: disable-auto-sync.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: konflux-rbac
  - path: disable-auto-sync.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: release
