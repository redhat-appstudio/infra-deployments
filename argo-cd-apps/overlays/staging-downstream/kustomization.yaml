apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd-staging
resources:
  - ../../base/member
  - ../../base/all-clusters
  - ../../base/backup
  - ../../base/monitoring-blackbox
  - ../../base/ca-bundle

patchesStrategicMerge:
  - delete-applications.yaml

patches:
  # ROKS (hypershift) — kubelet is managed by the platform
  - path: exclude-kubelet-config-roks-clusters.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: kubelet-config
  # Defer perf-team (tenant namespaces)
  - path: exclude-perf-team-roks-clusters.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: perf-team-prometheus-reader
