apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd-staging
resources:
  - ../../base/member
  - ../../base/all-clusters
  - ../../base/backup
  - ../../base/eaas
  - ../../base/monitoring-blackbox
  - ../../base/smee-client
  - ../../base/ca-bundle
  - ../../base/repository-validator

patchesStrategicMerge:
  - delete-applications.yaml

patches:
  - path: staging-downstream-overlay-patch.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: multi-platform-controller
  - path: mpc-lightwell-dev-patch.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: multi-platform-controller
  # Exclude operator-managed clusters from Argo generation for services owned
  # by the konflux-operator. Orphan (do not prune) when Applications go away.
  - path: exclude-operator-owned-clusters.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: application-api
  - path: preserve-resources-on-deletion.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: application-api
  - path: exclude-operator-owned-clusters.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: build-service
  - path: preserve-resources-on-deletion.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: build-service
  - path: exclude-operator-owned-clusters.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: integration
  - path: preserve-resources-on-deletion.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: integration
  - path: exclude-operator-owned-clusters.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: image-controller
  - path: preserve-resources-on-deletion.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: image-controller
  - path: exclude-operator-owned-clusters.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: namespace-lister
  - path: preserve-resources-on-deletion.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: namespace-lister
  - path: exclude-operator-owned-clusters.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: konflux-info
  - path: preserve-resources-on-deletion.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: konflux-info
  - path: exclude-operator-owned-clusters.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: konflux-ui
  - path: preserve-resources-on-deletion.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: konflux-ui
  - path: exclude-operator-owned-clusters.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: enterprise-contract
  - path: preserve-resources-on-deletion.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: enterprise-contract
  - path: exclude-operator-owned-clusters.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: konflux-rbac
  - path: preserve-resources-on-deletion.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: konflux-rbac
  - path: exclude-operator-owned-clusters.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: release
  - path: preserve-resources-on-deletion.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: release
  # Disable auto-sync for remaining staging members (e.g. stone-stg-rh01)
  # while operator rollout targets stone-stage-p01 and lightwell-dev only.
  # Harmless on operator-owned clusters once the Applications are no longer
  # generated.
  - path: disable-auto-sync.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: application-api
  - path: disable-auto-sync.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: build-service
  - path: disable-auto-sync.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: integration
  - path: disable-auto-sync.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: image-controller
  - path: disable-auto-sync.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: namespace-lister
  - path: disable-auto-sync.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: konflux-info
  - path: disable-auto-sync.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: konflux-ui
  - path: disable-auto-sync.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: enterprise-contract
  - path: disable-auto-sync.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: konflux-rbac
  - path: disable-auto-sync.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: release
  - path: disable-auto-sync.yaml
    target:
      kind: ApplicationSet
      version: v1alpha1
      name: konflux-verifications-rd
