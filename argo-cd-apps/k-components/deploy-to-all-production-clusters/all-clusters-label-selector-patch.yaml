---
- op: add
  path: /spec/generators/0/merge/generators/0/clusters/selector
  value:
    matchLabels:
      argocd.argoproj.io/secret-type: cluster
    matchExpressions:
      # Exclude the default cluster (the one hosting this ArgoCD instance, registered with
      # server https://kubernetes.default.svc)
      - key: app.kubernetes.io/name
        operator: NotIn
        values: [argocd-infra-deployments-default-cluster-config]
