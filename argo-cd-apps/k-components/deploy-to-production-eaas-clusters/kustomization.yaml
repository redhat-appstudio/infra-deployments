      group: argoproj.io
      version: v1alpha1
      kind: ApplicationSet
      labelSelector: appstudio.redhat.com/deployment-clusters=eaas
  - path: eaas-clusters-list-patch.yaml
    target:
      group: argoproj.io
      version: v1alpha1
      kind: ApplicationSet
      labelSelector: appstudio.redhat.com/deployment-clusters=eaas
