---
# This k-component should include internal tenant and hub clusters ONLY
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - path: internal-tenant-and-hub-clusters-label-selector-patch.yaml
    target:
      group: argoproj.io
      version: v1alpha1
      kind: ApplicationSet
      labelSelector: "appstudio.redhat.com/internal-only=true, appstudio.redhat.com/deployment-clusters=tenant, appstudio.redhat.com/hub-only=true"
  - path: internal-tenant-and-hub-clusters-list-patch.yaml
    target:
      group: argoproj.io
      version: v1alpha1
      kind: ApplicationSet
      labelSelector: "appstudio.redhat.com/internal-only=true, appstudio.redhat.com/deployment-clusters=tenant,appstudio.redhat.com/hub-only=true"
