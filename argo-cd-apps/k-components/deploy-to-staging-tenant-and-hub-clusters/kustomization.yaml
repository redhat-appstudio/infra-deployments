---
# This k-component should include regular tenant clusters and hub tenant clusters ONLY
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - path: tenant-and-hub-clusters-label-selector-patch.yaml
    target:
      group: argoproj.io
      version: v1alpha1
      kind: ApplicationSet
      labelSelector: "appstudio.redhat.com/deployment-clusters=tenant, !appstudio.redhat.com/internal-only, appstudio.redhat.com/hub-only"
  - path: tenant-and-hub-clusters-list-patch.yaml
    target:
      group: argoproj.io
      version: v1alpha1
      kind: ApplicationSet
      labelSelector: "appstudio.redhat.com/deployment-clusters=tenant, !appstudio.redhat.com/internal-only, appstudio.redhat.com/hub-only"
