---
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - path: internal-tenant-clusters-label-selector-patch.yaml
    target:
      group: argoproj.io
      version: v1alpha1
      kind: ApplicationSet
      labelSelector: "appstudio.redhat.com/internal-only=true, appstudio.redhat.com/deployment-clusters=tenant"
  - path: internal-tenant-clusters-list-patch.yaml
    target:
      group: argoproj.io
      version: v1alpha1
      kind: ApplicationSet
      labelSelector: "appstudio.redhat.com/internal-only=true, appstudio.redhat.com/deployment-clusters=tenant"
