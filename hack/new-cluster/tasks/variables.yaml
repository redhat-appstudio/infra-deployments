# Validate and initialize some variables

- name: Ensure required variables are defined
  tags: [always]
  fail:
    msg: "Required variable '{{ item }}' has not been provided via prompt or variable file"
  when: "vars[item] is undefined or vars[item] == ''"
  loop: "{{ required_vars }}"
- name: Make sure shortname contains only valid characters
  tags: [always]
  fail:
    msg: "Variable 'shortname' must match ^[a-z0-9-]+$, got: {{shortname}}"
  when: "not (shortname | regex_search('^[a-z0-9-]+$'))"
- name: Make sure longname contains only valid characters
  tags: [always]
  fail:
    msg: "Variable 'longname' must match ^[a-z0-9.-]+$, got: {{longname}}"
  when: "not (longname | regex_search('^[a-z0-9.-]+$'))"
- name: Make sure cutename contains only valid characters
  tags: [always]
  fail:
    msg: "Variable 'cutename' must match ^[a-z0-9]+$, got: {{cutename}}"
  when: "not (cutename | regex_search('^[a-z0-9]+$'))"
- name: Make sure awsaccount is a string of numbers
  tags: [always]
  fail:
    msg: "Variable 'awsaccount' must contain only digits, got: {{awsaccount}}"
  when: "awsaccount is defined and awsaccount != '' and not (awsaccount | string | regex_search('^[0-9]+$'))"
- name: Make sure ring is sane
  tags: [always]
  fail:
    msg: "Variable 'ring' must be one of {{allowed_rings}}, not {{ring}}"
  when: "vars['ring'] not in vars['allowed_rings']"
- name: Make sure env is sane
  tags: [always]
  fail:
    msg: "Variable 'env' must be one of {{allowed_envs}}, not {{env}}"
  when: "vars['env'] not in vars['allowed_envs']"
- name: Make sure network is sane
  tags: [always]
  fail:
    msg: "Variable 'network' must be one of {{allowed_networks}}, not {{network}}"
  when: "vars['network'] not in vars['allowed_networks']"
- name: Determine the latest github commits
  tags: [always]
  include_tasks: tasks/github/find-latest-commits.yaml
  loop: "{{ github_commit_vars }}"
  vars:
    slug: "{{ item.slug }}"
    varname: "{{ item.varname }}"
- name: Determine latest task-runner semver tag and digest from quay.io
  tags: [always]
  include_tasks: tasks/quay/find-latest-semver-tag.yaml
  vars:
    repo: konflux-ci/task-runner
    varname_tag: task_runner_tag
    varname_digest: task_runner_digest
