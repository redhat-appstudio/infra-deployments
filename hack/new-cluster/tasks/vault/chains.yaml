---
- name: Check if the chains signing secret is already present
  tags: [chains]
  ansible.builtin.command:
    argv:
      - vault
      - kv
      - metadata
      - get
      - -format=json
      - -mount=stonesoup
      - "{{ env }}/platform/ansible/generated/{{ shortname }}/chains-signing-secret"
  register: check_result
  environment:
    VAULT_ADDR: "{{ vault_addr }}"
    VAULT_TOKEN: "{{ vault_token }}"
  changed_when: false
  check_mode: false
  failed_when: >-
    check_result.rc != 0 and
    not (check_result.rc == 2 and
         ('No value found at stonesoup/metadata/' ~ env ~ '/platform/ansible/generated/' ~ shortname ~ '/chains-signing-secret') in
         (check_result.stdout ~ check_result.stderr))

- name: Create the absent Chains key with the shared credential tasks
  tags: [chains]
  ansible.builtin.include_tasks:
    file: chains-key.yaml
    apply:
      tags: [chains]
  vars:
    chains_secret_path: "{{ env }}/platform/ansible/generated/{{ shortname }}/chains-signing-secret"
    chains_expected_version: 0
    chains_verify_public_key: false
  when: check_result.rc == 2 and not ansible_check_mode
