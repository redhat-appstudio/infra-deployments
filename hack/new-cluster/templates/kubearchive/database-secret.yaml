---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: database-secret
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "-2"
spec:
  dataFrom:
    - extract:
        key: {{ env }}/platform/terraform/generated/{{ shortname }}/kubearchive-database
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: appsre-stonesoup-vault
  target:
    creationPolicy: Owner
    deletionPolicy: Delete
    name: kubearchive-database-credentials
    template:
      data:
        DATABASE_KIND: postgresql
        DATABASE_PORT: '{% raw %}{{ index . "db.port" }}{% endraw %}'
        DATABASE_URL: '{% raw %}{{ index . "db.host" }}{% endraw %}'
        DATABASE_PASSWORD: '{% raw %}{{ index . "db.password" }}{% endraw %}'
        DATABASE_USER: '{% raw %}{{ index . "db.user" }}{% endraw %}'
        DATABASE_DB: '{% raw %}{{ index . "db.name" }}{% endraw %}'
        DATABASE_CA_CERT: '{% raw %}{{ index . "db.ca_cert" | b64dec }}{% endraw %}'
        PGSSLMODE: verify-full
        PGSSLROOTCERT: /etc/ssl/certs/db-ca.crt
