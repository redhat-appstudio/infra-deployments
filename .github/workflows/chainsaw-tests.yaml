name: Run Chainsaw tests

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/chainsaw-tests.yaml'
      - 'components/kyverno/**'
      - 'components/policies/**'

jobs:
  find-chainsaw-tests:
    name: Find chainsaw tests
    runs-on: ubuntu-latest
    outputs:
      directories: ${{ steps.list-tests.outputs.directories }}
    steps:
    - name: Checkout Git Repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - id: list-tests
      run: |
        DIRS=$(find -name .chainsaw-test -type d | jq -R -s -c 'split("\n")[:-1]')
        echo "directories=${DIRS}" >> $GITHUB_OUTPUT

  chainsaw-test:
    name: Run Chainsaw tests
    runs-on: ubuntu-latest
    needs: ["find-chainsaw-tests"]
    strategy:
      fail-fast: false
      matrix:
        directory: ${{ fromJSON(needs.find-chainsaw-tests.outputs.directories) }}

    steps:
    - name: Create k8s Kind Cluster
      uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc  # v1.14.0

    - name: Checkout Git Repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Install Dependencies
      shell: bash
      run: |
        kustomize build --enable-helm components/kyverno/chainsaw | \
          kubectl apply -f - --server-side

    - name: Install Cosign
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

    - name: Install Chainsaw
      uses: kyverno/action-install-chainsaw@1223ef75bedeb59c4e7b5455463d4316e76dff01  # v0.2.15
      with:
        verify: true

    - name: Wait for kyverno ready
      shell: bash
      run: |
        set -e
        kubectl rollout status deployment \
          --namespace konflux-kyverno \
          --selector '!job-name' \
          --timeout=300s

    - name: Run chainsaw
      shell: bash
      run: |
        chainsaw test \
          --config .chainsaw.yaml \
          --no-color=false \
          "${{ matrix.directory }}"
