name: Verify Pipelines Configuration

on:
  pull_request_target:
    branches:
      - main
      - pipelines-config-validation
    paths:
      - 'components/pipeline-service/**'
      - '.github/workflows/verify-pipelines-configs.yaml'

jobs:
  verify-pipelines-configs:
    name: Verify pipelines Kustomize rendering
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      has_errors: ${{ steps.check.outputs.has_errors }}
    steps:
      - name: Checkout base branch (scripts trusted)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # hash v7

      - name: Overlay PR manifests
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --depth=1 origin "${PR_HEAD_SHA}"
          git restore --source="${PR_HEAD_SHA}" --staged --worktree -- components/pipeline-service/

      - name: Setup Kustomize
        uses: multani/action-setup-kustomize@bf96e027caf74ab03bb3f79bac2addb331b28f1d
        with:
          version: 5.8.1

      - name: Render Pipelines base, rings, and cluster configurations
        id: check
        shell: bash
        run: |
          ERRORS_FILE="/tmp/errors_detected"
          COMMENT_FILE="/tmp/pr_comment"

          function fail() {
            message="${1:-An unknown error occurred}"
            body="${2:-See workflow logs for details}"
            echo "::error::${message}"
            printf '## ⚠️ %s\n\n%s\n\n' "${message}" "${body}" | tee -a "${GITHUB_STEP_SUMMARY}" >> "${COMMENT_FILE}"
            touch "${ERRORS_FILE}"
          }

          # Render entrypoints independently: ring snapshots may differ during promotion.
          # Nested bases are validated through their owning ring/cluster entrypoints.
          shopt -s nullglob
          kustomizations=(
            components/pipeline-service/base/kustomization.yaml
            components/pipeline-service/rings/*/*/kustomization.yaml
            components/pipeline-service/empty-base/*/kustomization.yaml
          )
          render_errors="$(mktemp)"
          while IFS= read -r -d '' kustomization; do
            directory="${kustomization%/kustomization.yaml}"
            echo "Rendering ${directory}"
            # Only builtins and Helm are enabled; never execute PR-owned scripts/plugins.
            if ! kustomize build --enable-helm "${directory}" > /dev/null 2> "${render_errors}"; then
              fail "Cannot render Pipelines service configuration: \`${directory}\`." \
                "$(printf 'Fix the Kustomize rendering error below.\n\n```text\n%s\n```' "$(cat "${render_errors}")")"
            fi
          done < <(printf '%s\0' "${kustomizations[@]}" | LC_ALL=C sort -z)
          rm -f "${render_errors}"

          if [ -e "${ERRORS_FILE}" ]; then
            echo "has_errors=true" >> "${GITHUB_OUTPUT}"
          else
            echo "✅ All Pipelines service base, ring, and cluster configurations render successfully with Kustomize" | tee -a "${GITHUB_STEP_SUMMARY}" | tee -a "${COMMENT_FILE}"
            echo "has_errors=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Upload comment artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr-comment
          path: /tmp/pr_comment
          retention-days: 1

  # Run as a separate job to ensure `kustomize build` is not run on unapproved code with a privileged token in its environment
  report-validation-status:
    name: Status Report
    runs-on: ubuntu-latest
    needs: verify-pipelines-configs
    if: always()
    permissions:
      pull-requests: write
      issues: write
    steps:
      - name: Download comment artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pr-comment
          path: /tmp

      - name: Post comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COMMENT_MARKER="<!-- verify-pipelines-configs -->"

          # Delete any previous comment from this workflow
          gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            --jq ".[] | select(.body | contains(\"${COMMENT_MARKER}\")) | .id" \
            | xargs -r -I {} gh api "repos/${{ github.repository }}/issues/comments/{}" -X DELETE

          echo "${COMMENT_MARKER}" >> /tmp/pr_comment

          gh pr comment ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --body-file /tmp/pr_comment

          if [ "${{ needs.verify-pipelines-configs.result }}" != "success" ] || \
             [ "${{ needs.verify-pipelines-configs.outputs.has_errors }}" != "false" ]; then
            exit 1
          fi
