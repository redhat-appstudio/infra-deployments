name: Check Kubernetes YAMLs with kube-linter

on:
  # Note that both `push` and `pull_request` triggers should be present for GitHub to consistently present kube-linter
  # SARIF reports.
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
jobs:
  scan:
    permissions: write-all
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # This prepares directory where github/codeql-action/upload-sarif@v1 looks up report files by default.
      - name: Create ../results directory for SARIF report files
        shell: bash
        run: mkdir -p ../results kustomizedfiles

      - name: Setup Kustomize
        uses: multani/action-setup-kustomize@bf96e027caf74ab03bb3f79bac2addb331b28f1d
        with:
          version: 5.8.1

      - name: Run kustomize build
        env:
          OUTPUT: GITHUB
        run: |
          find argo-cd-apps components -name 'kustomization.yaml' \
            ! -path '*/k-components/*' \
            ! -path '*konflux-operator/*/cr/*' \
            ! -path '*konflux-operator/rings/*/base/cr/*' \
            ! -path 'components/repository-validator/staging/*' \
            ! -path 'components/repository-validator/production/*' \
            ! -path 'components/repository-validator-rd/rings/*' \
            ! -path 'components/monitoring/blackbox/staging/*' \
            ! -path 'components/monitoring/blackbox/production/*' \
            ! -path 'components/*/chainsaw/*' \
            ! -path 'components/etcd-shield/base/*' \
            ! -path 'configs/etcd-defrag-rd/rings/*' \
            ! -path 'components/kueue-rd/base/*' \
            ! -path 'components/kueue-rd/rings/*/base/external-repo/*' \
            ! -path 'components/kube-shard/base/*' \
            ! -path 'components/*/rings/*/base/base-snapshot/*' \
            | \
            xargs -I {} -n1 -P8  bash -c 'dir=$(dirname "{}"); output_file=$(echo "$dir" | tr / -)-kustomization.yaml; ./hack/kustomize-build-with-retry.sh "$dir" -o "kustomizedfiles/$output_file"'

      - name: Scan yaml files with kube-linter
        uses: stackrox/kube-linter-action@ca0d55b925470deb5b04b556e6c4276ea94d03c3 # v1.0.4
        id: kube-linter-action-scan
        with:
          version: v0.7.6
          # Adjust this directory to the location where your kubernetes resources and helm charts are located.
          directory: kustomizedfiles
          # The following two settings make kube-linter produce scan analysis in SARIF format which would then be
          # made available in GitHub UI via upload-sarif action below.
          format: sarif
          output-file: ../results/kube-linter.sarif

      - name: Upload SARIF report files to GitHub
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        if: always()

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure() && steps.kube-linter-action-scan.outcome == 'failure'
        with:
          name: kustomize-manifests
          path: kustomizedfiles
