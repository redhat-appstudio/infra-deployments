codecov:
  require_ci_to_pass: true

flag_management:
  individual_flags:
    - name: infra-tools
      paths:
        - infra-tools/
      statuses:
        - type: patch
          target: 80%

comment:
  layout: "reach,diff,flags,components"
  behavior: default

ignore:
  - "infra-tools/cmd/*/main.go"
  - "components/**"
  - "argo-cd-apps/**"
  - "configs/**"
  - "hack/**"
  - "docs/**"
  - "**/*.yaml"
  - "**/*.yml"
  - "**/*.json"
  - "**/*.md"
  - "**/*.sh"
  - "**/*.env"
  - "**/*.conf"
  - "tests"
